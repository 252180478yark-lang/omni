# Omni-Vibe OS Ultra — 开发模式（仅基础设施）
# 启动：docker-compose -f docker-compose.dev.yml up -d
# 停止：docker-compose -f docker-compose.dev.yml down
# 配合 dev-start.ps1 / dev-stop.ps1 使用

name: ${COMPOSE_PROJECT_NAME:?RuntimeAllocation required}

x-runtime-labels: &runtime-labels
  io.omni.runtime_id: "${OMNI_RUNTIME_ID:?RuntimeAllocation required}"
  org.opencontainers.image.revision: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  io.omni.source_fingerprint: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"
  io.omni.worktree_id: "${OMNI_WORKTREE_ID:?RuntimeAllocation worktree id required}"
  io.omni.scheduler_role: "disabled"
  io.omni.approval_worker_role: "${OMNI_APPROVAL_WORKER_ROLE:-disabled}"

x-build-labels: &build-labels
  io.omni.build.source_commit: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  io.omni.build.source_fingerprint: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"

x-build-args: &build-args
  OMNI_BUILD_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_BUILD_SOURCE_FINGERPRINT: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"

x-runtime-env: &runtime-env
  COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:?RuntimeAllocation compose project required}"
  OMNI_ALLOCATION_ID: "${OMNI_ALLOCATION_ID:?RuntimeAllocation id required}"
  OMNI_RUNTIME_ID: "${OMNI_RUNTIME_ID:?RuntimeAllocation runtime id required}"
  OMNI_WORKTREE_ID: "${OMNI_WORKTREE_ID:?RuntimeAllocation worktree id required}"
  OMNI_SOURCE_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_EXPECTED_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_SOURCE_FINGERPRINT: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"
  OMNI_ALLOCATED_PORTS_SHA256: "${OMNI_ALLOCATED_PORTS_SHA256:?RuntimeAllocation port digest required}"
  OMNI_ALLOCATED_VOLUMES_SHA256: "${OMNI_ALLOCATED_VOLUMES_SHA256:?RuntimeAllocation volume digest required}"
  OMNI_RUNTIME_ALLOCATION_FILE: "/runtime-state/allocations.json"
  OMNI_SCHEDULER_ENABLED: "${OMNI_SCHEDULER_ENABLED:-false}"
  OMNI_APPROVAL_WORKER_ENABLED: "${OMNI_APPROVAL_WORKER_ENABLED:-false}"
  OMNI_APPROVAL_WORKER_ROLE: "${OMNI_APPROVAL_WORKER_ROLE:-disabled}"

services:
  runtime-preflight:
    image: "omni-migration-runner:${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
    build:
      context: .
      dockerfile: services/infra-core/migrations/Dockerfile
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    entrypoint: ["python", "-B", "/workspace/scripts/runtime_guard.py"]
    command: ["allocation-preflight", "--json"]
    environment: *runtime-env
    volumes:
      - "${OMNI_RUNTIME_ALLOCATION_SOURCE:?RuntimeAllocation evidence file required}:/runtime-state/allocations.json:ro"
    restart: "no"

  postgres:
    build:
      context: ./services/infra-core/postgres
      labels: *build-labels
    labels: *runtime-labels
    environment:
      <<: *runtime-env
      POSTGRES_USER: ${POSTGRES_USER:-omni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-omni_vibe_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/infra-core/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni_user} -d ${POSTGRES_DB:-omni_vibe_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - omni-network
    depends_on:
      runtime-preflight:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    labels: *runtime-labels
    environment: *runtime-env
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./services/infra-core/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme_redis} ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - omni-network
    depends_on:
      runtime-preflight:
        condition: service_completed_successfully

  migrate:
    image: "omni-migration-runner:${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
    build:
      context: .
      dockerfile: services/infra-core/migrations/Dockerfile
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    environment:
      <<: *runtime-env
      DATABASE_URL: "postgresql://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-omni_vibe_db}"
      OMNI_DATABASE_DISPOSABLE: "${OMNI_DATABASE_DISPOSABLE:?RuntimeAllocation database mode required}"
    command: ["--allocation-aware", "--receipt-dir", "/migration-receipts"]
    volumes:
      - "${OMNI_MIGRATION_RECEIPT_DIR:-./.runtime/migration-receipts}:/migration-receipts:rw"
      - "${OMNI_RUNTIME_ALLOCATION_SOURCE:?RuntimeAllocation evidence file required}:/runtime-state/allocations.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omni-network
    restart: "no"

volumes:
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:-omni_postgres_data}"
  redis_data:
    name: "${REDIS_VOLUME_NAME:-omni_redis_data}"

networks:
  omni-network:
    name: "${OMNI_NETWORK_NAME:-omni-network}"
    driver: bridge
