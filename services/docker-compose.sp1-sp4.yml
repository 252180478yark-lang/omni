# Omni-Vibe OS — Application Services
# 需要先启动 infra-core (omni-network 必须已存在)
# 推荐使用根目录 docker-compose.yml 统一启动

name: ${COMPOSE_PROJECT_NAME:?RuntimeAllocation required}

x-runtime-labels: &runtime-labels
  io.omni.runtime_id: "${OMNI_RUNTIME_ID:?RuntimeAllocation required}"
  org.opencontainers.image.revision: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  io.omni.source_fingerprint: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"
  io.omni.worktree_id: "${OMNI_WORKTREE_ID:?RuntimeAllocation worktree id required}"
  io.omni.scheduler_role: "disabled"
  io.omni.approval_worker_role: "${OMNI_APPROVAL_WORKER_ROLE:-disabled}"

x-build-labels: &build-labels
  io.omni.build.source_commit: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  io.omni.build.source_fingerprint: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"

x-build-args: &build-args
  OMNI_BUILD_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_BUILD_SOURCE_FINGERPRINT: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"

x-runtime-env: &runtime-env
  COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:?RuntimeAllocation compose project required}"
  OMNI_ALLOCATION_ID: "${OMNI_ALLOCATION_ID:?RuntimeAllocation id required}"
  OMNI_RUNTIME_ID: "${OMNI_RUNTIME_ID:?RuntimeAllocation runtime id required}"
  OMNI_WORKTREE_ID: "${OMNI_WORKTREE_ID:?RuntimeAllocation worktree id required}"
  OMNI_SOURCE_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_EXPECTED_COMMIT: "${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
  OMNI_SOURCE_FINGERPRINT: "${OMNI_SOURCE_FINGERPRINT:?RuntimeAllocation source fingerprint required}"
  OMNI_ALLOCATED_PORTS_SHA256: "${OMNI_ALLOCATED_PORTS_SHA256:?RuntimeAllocation port digest required}"
  OMNI_ALLOCATED_VOLUMES_SHA256: "${OMNI_ALLOCATED_VOLUMES_SHA256:?RuntimeAllocation volume digest required}"
  OMNI_RUNTIME_ALLOCATION_FILE: "/runtime-state/allocations.json"
  OMNI_SCHEDULER_ENABLED: "${OMNI_SCHEDULER_ENABLED:-false}"
  OMNI_APPROVAL_WORKER_ENABLED: "${OMNI_APPROVAL_WORKER_ENABLED:-false}"
  OMNI_APPROVAL_WORKER_ROLE: "${OMNI_APPROVAL_WORKER_ROLE:-disabled}"

services:
  runtime-preflight:
    image: "omni-migration-runner:${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
    build:
      context: ..
      dockerfile: services/infra-core/migrations/Dockerfile
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    entrypoint: ["python", "-B", "/workspace/scripts/runtime_guard.py"]
    command: ["allocation-preflight", "--json"]
    environment: *runtime-env
    volumes:
      - "${OMNI_RUNTIME_ALLOCATION_SOURCE:?RuntimeAllocation evidence file required}:/runtime-state/allocations.json:ro"
    restart: "no"

  migrate:
    image: "omni-migration-runner:${OMNI_SOURCE_COMMIT:?RuntimeAllocation source commit required}"
    build:
      context: ..
      dockerfile: services/infra-core/migrations/Dockerfile
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    environment:
      <<: *runtime-env
      DATABASE_URL: "postgresql://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-omni_vibe_db}"
      OMNI_DATABASE_DISPOSABLE: "${OMNI_DATABASE_DISPOSABLE:?RuntimeAllocation database mode required}"
    command: ["--allocation-aware", "--receipt-dir", "/migration-receipts"]
    volumes:
      - "${OMNI_MIGRATION_RECEIPT_DIR:-../.runtime/migration-receipts}:/migration-receipts:rw"
      - "${OMNI_RUNTIME_ALLOCATION_SOURCE:?RuntimeAllocation evidence file required}:/runtime-state/allocations.json:ro"
    depends_on:
      runtime-preflight:
        condition: service_completed_successfully
    networks:
      - omni-network
    restart: "no"

  identity-service:
    build:
      context: ./identity-service
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    environment:
      <<: *runtime-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-omni_vibe_db}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/3"
      JWT_SECRET_KEY_FILE: "/run/secrets/omni_identity_jwt"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - "${OMNI_IDENTITY_JWT_SECRET_FILE:?Identity JWT secret file required}:/run/secrets/omni_identity_jwt:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully
    networks:
      - omni-network

  frontend:
    build:
      context: ../frontend
      labels: *build-labels
      args:
        <<: *build-args
        NEXT_PUBLIC_OMNI_UNIFIED_SHELL: "${NEXT_PUBLIC_OMNI_UNIFIED_SHELL:-true}"
    labels: *runtime-labels
    environment:
      <<: *runtime-env
      OMNI_APPROVAL_SERVICE_SECRET_FILE: "/run/secrets/omni_approval_hmac"
      OMNI_COMPATIBILITY_TOKEN_FILE: "/run/secrets/omni_compatibility"
      NEXT_PUBLIC_USE_BACKEND_HUB: "true"
      NEXT_PUBLIC_OPENAI_BASE_URL: "http://localhost:8001/v1"
      NEXT_PUBLIC_OMNI_API_BASE_URL: "http://localhost"
      AI_PROVIDER_HUB_URL: "http://ai-provider-hub:8001"
      IDENTITY_SERVICE_URL: "http://identity-service:8000"
      KNOWLEDGE_ENGINE_URL: "http://knowledge-engine:8002"
      VIDEO_ANALYSIS_SERVICE_URL: "http://video-analysis:8006"
    command: ["npm", "run", "start"]
    volumes:
      - "${OMNI_APPROVAL_HMAC_SECRET_FILE:?Approval HMAC secret file required}:/run/secrets/omni_approval_hmac:ro"
      - "${OMNI_COMPATIBILITY_TOKEN_FILE:?Compatibility token file required}:/run/secrets/omni_compatibility:ro"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      ai-provider-hub:
        condition: service_started
      knowledge-engine:
        condition: service_started
    networks:
      - omni-network

  ai-provider-hub:
    build:
      context: ./ai-provider-hub
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    env_file:
      - ./ai-provider-hub/.env.example
    environment:
      <<: *runtime-env
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:${AI_PROVIDER_HUB_PORT:-8001}:8001"
    volumes:
      - ai_hub_data:/app/data
    networks:
      - omni-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully

  knowledge-engine:
    build:
      context: ./knowledge-engine
      labels: *build-labels
      args: *build-args
    labels:
      <<: *runtime-labels
      io.omni.scheduler_role: "${OMNI_SCHEDULER_ROLE:-disabled}"
    env_file:
      - ./knowledge-engine/.env.example
    environment:
      <<: *runtime-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-omni_vibe_db}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/1"
      OMNI_SCHEDULER_ENABLED: "${OMNI_SCHEDULER_ENABLED:-false}"
      OMNI_APPROVAL_WORKER_ENABLED: "${OMNI_APPROVAL_WORKER_ENABLED:-false}"
      OMNI_APPROVAL_SERVICE_SECRET_FILE: "/run/secrets/omni_approval_hmac"
      OMNI_COMPATIBILITY_TOKEN_FILE: "/run/secrets/omni_compatibility"
      OMNI_APPROVAL_FRONTEND_PRINCIPAL: "service:frontend"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:${KNOWLEDGE_ENGINE_PORT:-8002}:8002"
    volumes:
      - "${OMNI_APPROVAL_HMAC_SECRET_FILE:?Approval HMAC secret file required}:/run/secrets/omni_approval_hmac:ro"
      - "${OMNI_COMPATIBILITY_TOKEN_FILE:?Compatibility token file required}:/run/secrets/omni_compatibility:ro"
      - "${OMNI_RUNTIME_ALLOCATION_SOURCE:?RuntimeAllocation evidence file required}:/runtime-state/allocations.json:ro"
      - knowledge_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully
      ai-provider-hub:
        condition: service_started
    networks:
      - omni-network

  news-aggregator:
    build:
      context: ./news-aggregator
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    env_file:
      - ./news-aggregator/.env.example
    environment:
      <<: *runtime-env
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-omni_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-omni_vibe_db}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/2"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "127.0.0.1:${NEWS_AGGREGATOR_PORT:-8005}:8005"
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully
      ai-provider-hub:
        condition: service_started
      knowledge-engine:
        condition: service_started
    networks:
      - omni-network

  video-analysis:
    build:
      context: ./video-analysis
      labels: *build-labels
      args: *build-args
    labels: *runtime-labels
    env_file:
      - ./video-analysis/.env.example
    environment:
      <<: *runtime-env
      AI_PROVIDER_HUB_URL: "http://ai-provider-hub:8001"
      KNOWLEDGE_ENGINE_URL: "http://knowledge-engine:8002"
      KNOWLEDGE_TARGET_KB_ID: "default"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006"]
    ports:
      - "127.0.0.1:${VIDEO_ANALYSIS_PORT:-8006}:8006"
    volumes:
      - video_analysis_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-preflight:
        condition: service_completed_successfully
      ai-provider-hub:
        condition: service_started
    networks:
      - omni-network

volumes:
  ai_hub_data:
  knowledge_data:
    name: "${KNOWLEDGE_VOLUME_NAME:-omni_knowledge_data}"
  video_analysis_data:

networks:
  omni-network:
    external: true
    name: "${OMNI_NETWORK_NAME:-omni-network}"
