# Runbook G — 品牌心智（云图 每日）
name: G-品牌心智
platform: yuntu
schedule: "0 9 * * *"
description: 云图首页5A总览 + 品牌心智（联想量/美誉度/偏爱度）→ mvp_brand_mind_daily
tags: [suite, daily, brand, mind, yuntu]

session:
