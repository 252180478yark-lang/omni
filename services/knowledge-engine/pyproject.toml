[project]
name = "knowledge-engine"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.0.0",
  "numpy>=1.26.0",
  # PostgreSQL + pgvector
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  # Redis caching
  "redis[hiredis]>=5.0.0",
  # LangGraph RAG workflow
  "langgraph>=0.2.0",
  # Chinese word segmentation
  "jieba>=0.42.1",
  # Text chunking
  "langchain-text-splitters>=0.3.0",
  "tiktoken>=0.7.0",
  # Document parsing
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
  "trafilatura>=1.12.0",
  "pysrt>=1.1.2",
  # MCP server (Anthropic Model Context Protocol)
  "fastmcp>=3.2,<4",
  # Volcengine Visual API (realman portrait video / 单图音频驱动)
  "volcengine>=1.0.0",
  # 图片处理（人脸网格覆盖，step 7 content_sensitive 绕路）
  "Pillow>=10.0.0",
  # Gemini Files API（reverse_storyboard_video 直调,绕过 ai-provider-hub 的 ≤20MB inline_data 限制）
  "google-generativeai>=0.8.0",
  # httplib2 proxy patch 用（Gemini Files API 上传走 httplib2，国内代理需要 PySocks）
  "PySocks>=1.7.1",
  # 本地语音转文字（桌面输入框口述）：faster-whisper CPU·medium·中文，离线不走云。
  # 拉 ctranslate2 + av(PyAV 内置 ffmpeg 解 webm/opus) + huggingface_hub（首次下模型，国内设 HF_ENDPOINT 镜像）。
  "faster-whisper>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["config", "config.*", "scripts", "scripts.*", "tests", "tests.*"]

[project.optional-dependencies]
harvester = [
  "playwright>=1.40.0",
  "cryptography>=42.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# L0-7：限定收集 tests/，避免 scripts/ 下一次性抓取探针 test_*.py 被收集 import 报错污染（2026-06-03 整理，对齐 scout-agent pytest.ini）
# testpaths 在无路径参数 + 某些 pytest 版本下不被尊重（实测 `python -m pytest` 仍收集 scripts/test_img_*.py
# 并卡死在模块级浏览器探针）。addopts 的 --ignore 强制排除，恒生效，作为 testpaths 的兜底（2026-06-03）。
testpaths = ["tests"]
addopts = "--ignore=scripts"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
