    metric_policy: planting_a3_v1
    north_star: a3_ratio
    diagnostic_metrics:
      - cpm
      - play_3s_rate
      - completion_rate
    vector_threshold_100: 70
    key_vector_dimensions:
      - audience_scene
      - pain_conflict
      - product_action
      - result_relief
      - justification_evidence
