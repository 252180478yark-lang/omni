      completion_floor: null
      a3_floor: null
      cpm_ceiling: null
      min_impressions: null
      min_a3_eligible_users: null
      max_exposure_ratio: 3.0
      rate_scale: '0-1'
      currency: CNY
    iteration_candidates:
      play_3s_rate:
        - opening_hook_3s
        - presentation_motif
      completion_rate:
        - story_pace
        - justification_density
      a3_ratio:
        - pain_scene_bridge
        - justification_module
    global_iteration_order:
      - pain_scene_bridge
      - idea_seed
      - opening_hook_3s
      - selling_point_set
      - scene
      - emotion
      - story_pace
      - justification_density
      - justification_module
      - presentation_motif
      - edit_pace
      - visual_vector
      - bgm
      - target_model

