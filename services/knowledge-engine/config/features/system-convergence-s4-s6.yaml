schema_version: 1
feature_id: system-convergence-s4-s6
title: System graph planning and pilot controls
domain: platform.system_graph
owner: {kind: team, id: omni}
lifecycle: active
routes:
  canonical: /system-graph
  visible: true
  placements: [sidebar, direct]
capabilities:
  - {capability_id: planned-fact-projection, kind: read}
  - {capability_id: candidate-plan-revision, kind: admin}
  - {capability_id: issue-repair-history, kind: read}
  - {capability_id: repository-pilot-calibration, kind: admin}
expected_edges:
  - from: ui_route:/system-graph
    to: bff_operation:GET:/api/omni/system-graph/integration-plans
    relation: calls
    required: true
  - from: bff_operation:GET:/api/omni/system-graph/integration-plans
    to: rest_operation:GET:/api/v1/system-graph/integration-plans
    relation: proxies_to
    required: true
  - from: rest_operation:POST:/api/v1/system-graph/integration-plans
    to: service_symbol:app.services.system_graph.integration_plans.create_candidate_plan
    relation: invokes
    required: true
  - from: test:services/knowledge-engine/tests/test_system_graph_integration_router.py::test_rest_plan_requires_owner_and_returns_only_candidate_artifacts
    to: rest_operation:POST:/api/v1/system-graph/integration-plans
    relation: verifies
    required: true
  - from: test:services/knowledge-engine/tests/test_system_graph_mcp_registration.py::test_system_graph_mcp_tools_are_registered_and_in_doctor_contract
    to: mcp_tool:system_graph_confirm_plan
    relation: verifies
    required: true
checks:
  - check_id: system-graph-rest-owner
    kind: pytest
    target: services/knowledge-engine/tests/test_system_graph_integration_router.py::test_rest_plan_requires_owner_and_returns_only_candidate_artifacts
    verifies: rest_operation:POST:/api/v1/system-graph/integration-plans
    required: true
  - check_id: system-graph-mcp-doctor
    kind: pytest
    target: services/knowledge-engine/tests/test_system_graph_mcp_registration.py::test_system_graph_mcp_tools_are_registered_and_in_doctor_contract
    verifies: mcp_tool:system_graph_confirm_plan
    required: true
  - check_id: system-graph-owner-page
    kind: command
    target: frontend/tests/system-graph-plan.test.tsx
    verifies: ui_route:/system-graph
    required: true
aliases: []
dependencies:
  - {ref: health_registration:service:knowledge-engine, required: true}
