schema_version: 1
feature_id: content-studio
title: 内容工坊
domain: content.generation
owner: {kind: team, id: omni}
lifecycle: active
routes:
  canonical: /content-studio
  visible: true
  placements: [home, onboarding, direct]
  owned_surfaces:
    - /content-studio
    - /content-studio/avatars
    - /content-studio/avatars/[id]
    - /content-studio/briefs
    - /content-studio/briefs/[id]
    - /content-studio/guide
    - /content-studio/new
ia:
  mode: work
  primary_group: content
  primary_order: 0
  contextual_groups: []
  phase: retain
  flag: unified_shell
capabilities:
  - {capability_id: content-pipeline, kind: generate}
expected_edges: []
checks:
  - check_id: knowledge-health
    kind: health
    target: /api/v1/system/health/features/content-studio
    verifies: health_registration:service:knowledge-engine
    required: true
  - check_id: ai-provider-health
    kind: health
    target: /api/v1/system/health/features/content-studio
    verifies: health_registration:service:ai-provider-hub
    required: true
aliases: []
dependencies:
  - {ref: health_registration:service:knowledge-engine, required: true}
  - {ref: health_registration:service:ai-provider-hub, required: true}
