schema_version: 1
feature_id: ad-review
title: 投放复盘
domain: advertising
owner: {kind: team, id: omni}
lifecycle: active
routes:
  canonical: /ad-review
  visible: true
  placements: [home, onboarding, direct]
  owned_surfaces:
    - /ad-review
    - /ad-review/[id]
    - /ad-review/[id]/review
    - /ad-review/analytics
    - /ad-review/flywheel
ia:
  mode: work
  primary_group: operations
  primary_order: 10
  contextual_groups: []
  phase: merge
  flag: unified_shell
capabilities:
  - {capability_id: campaign-review, kind: generate}
expected_edges: []
checks:
  - check_id: ad-review-service-health
    kind: health
    target: /api/v1/system/health/features/ad-review
    verifies: health_registration:service:ad-review-service
    required: true
aliases:
  - {href: /marketing/review, target: /ad-review}
dependencies:
  - {ref: health_registration:service:ad-review-service, required: true}
  - {ref: health_registration:service:ai-provider-hub, required: false}
