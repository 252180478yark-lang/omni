    \n二者区别如下：\n\n| 人群包 | 尝鲜版-心智人群 | 正式版-特色人群 |\n| :--- | :--- | :--- |\n\n\n\n\n\n| 维度 | 尝鲜版内容 | 正式版内容 |\n| :--- | :--- |\
    \ :--- |\n| **圈选逻辑** | 通过心智词圈词拉取，选取范围是食饮行业通用心智词 | 在心智词的基础上，与FT团队共建，叠加细分赛道人群偏好维度。正式版人群更具行业特色、提升满足食饮细分赛道精细人群需求的能力<br>eg：酒赛道添加偏好维度包含但不限于年份、产地、度数等；乳饮赛道添加偏好维度包含但不限于奶源地等；速食赛道添加偏好为额度包含但不限于时令、是否传统零食等；\
    \ |\n| **上线范围** | 仅上线至【云图-人群-平台尝鲜人群】，可正常投放使用 | 上线后会正式替代【云图-人群-平台尝鲜人群】中的尝鲜版人群包，以及【云图-人群-新建人群中-行业特色人群】中会出现可以直接选用的人群标签 |\n\
    | **数据拉取** | 无法通过数据集中【食饮行业特色人群】字段拉取消耗，仅能通过包名称拉取by包归因消耗 | 在数据拉取上会有对应字段可用，无需再使用包名进行归因拉取 |\n| **数据更新周期** | 现人群包为9月上线，人群包数据无法自动更新\
    \ | 人群包数据by月自动更新，更具时效性，能灵活结合行业for时效热点及趋势需求 |\n\n## “尝鲜版”心智人群设计逻辑\n\n从基础的食饮行业兴趣人群出发，通过“心智词”引入构建食饮行业特色人群标签体系。品牌与消费者间的链接，更本质的关联品牌长期生意。心智词的引入对人群的刻画更加完善和准确，且通过人群上线后的定期更新，持续帮品牌找到最对的人。\n\
