risks:
- id: RISK-001
  description: The shared worktree has a user-staged .gitignore and many unrelated historical files.
  mitigation: Use a temporary Git index and stage only exact paths declared in CHG-001 to CHG-003.
- id: RISK-002
  description: Rerunning 096 could change a live creator-history migration outside P0 scope.
  mitigation: Canonicalize its exact source only; do not invoke --rerun or the ledger reconciliation tool for 096.
- id: RISK-003
  description: Applying 097 changes runtime schema and a bridge call invokes the text model.
  mitigation: Apply only 097 after source verification; run no script/video provider request and stop after bridge candidates.
- id: RISK-004
  description: Historical v3 order 88f04565-b9b0-4a11-bf75-261728b90163 lacks pack lineage.
  mitigation: Leave it immutable and auditable; create a separate v4 order instead of reusing or repairing it.
- id: RISK-005
  description: The v4 overlay imports P0 foundation modules absent from HEAD; canonicalizing only the overlay would fail in a clean checkout.
  mitigation: Add the audited P0-only dependency closure, including registration, baseline, migrations, prompts, frontend integration, and focused tests; stage mixed files as P0-only hunks.
- id: RISK-006
  description: The runtime ledger contains active non-P0 feature migrations whose SQL sources are absent from HEAD, causing P0 baseline to fail even though P0 does not execute those features.
  mitigation: Canonicalize only the exact already-applied SQL source files. Do not add their services, UI, providers, or rerun any migration.
- id: RISK-007
  description: A structurally valid bridge can still turn a person concern or a product-evidence snippet into an unsupported comparative or food-result claim.
  mitigation: Require each pain/product claim to carry its corresponding exact upstream evidence text, constrain pain to a user concern, and reject the bridge before it reaches human selection when the deterministic claim gate fails.
- id: RISK-008
  description: A raw video with changed product packaging or label text could be re-QAed into raw_passed and then reach final QA merely because an earlier raw report passed.
  mitigation: Permanently latch packaging_different or label_text_different against that exact raw asset; raw and final gates require a passing report bound to the same raw asset and reject any latched identity mismatch.
out_of_scope:
- Any AI 插镜 or 电商视觉 source import, migration, deployment, or code rewrite.
- Creator-learning source code, UI, runtime service, provider, and deployment changes; only the exact applied migration SQL source is admitted for ledger reproducibility.
- Unrelated staged or untracked work, including .gitignore and all non-P0 hunks in mixed registration, model, container, and page files.
- Rerunning, editing, reconciling, cancelling, or deleting migration 096 and the historical v3 production order.
- Script generation, script selection, paid video generation, release, publishing, or any Yuntu action.
rollback:
  strategy: Revert only the two exact canonical-source commits if source tracking must be undone; disable v4 order creation in code if necessary. Do not drop the additive 097 column or touch 096 during rollback.
  data_recovery: The nullable 097 field preserves legacy rows. A created v4 order is immutable audit data and can be cancelled only through the supported P0 workflow if later required.
