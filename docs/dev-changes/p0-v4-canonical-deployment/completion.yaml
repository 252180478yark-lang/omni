contract_delta:
- description: Expanded the canonical overlay into the smallest P0-only dependency closure.
  reason: The audited v4 overlay referenced P0 foundation modules absent from HEAD, so an overlay-only commit would not run in a clean checkout.
  effect: Added CHG-004 without importing AI insert, ecommerce visual, creator runtime, or unrelated UI code.
  accepted: true
- description: Added source-only active migration-ledger SQL sources.
  reason: Runtime preflight validates every active ledger entry against canonical SQL, even when the non-P0 feature itself is not executed.
  effect: Added CHG-005 SQL sources only; no migrations were rerun and no non-P0 service was introduced.
  accepted: true
- description: Added strict bridge-claim grounding after live bridge review exposed unsupported comparative and food-result claims.
  reason: Structural evidence references did not stop free-text bridge fields from turning a concern or inference into a product fact.
  effect: Added CHG-006 deterministic validation and prompt constraints before human bridge selection.
  accepted: true
- description: Added raw-asset product-identity hard-failure latch after review of the mutated package/label video.
  reason: The same raw asset could previously be re-QAed into a pass after packaging_different or label_text_different.
  effect: Added CHG-007; only product identity failures are irreversible, while other raw QA recovery semantics remain compatible.
  accepted: true
- description: Replaced the repeat-create bridge verification with a read of the existing v4 order.
  reason: Re-running the original check would create an unnecessary second order and invoke another text-model bridge call after the required candidate already existed.
  effect: VER-007 proves the same frozen order, its pack lineage, zero scripts, zero video attempts, and its next human gate without new generation work.
  accepted: true
