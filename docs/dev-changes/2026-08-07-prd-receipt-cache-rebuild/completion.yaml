  planned_change_id: CHG-001
  paths:
  - scripts/rebuild_delivery_receipts.py
  summary: Added a fail-closed recovery CLI that binds a committed manifest to exact live GitHub artifacts, validates all receipts before publication, enforces shared cache limits, never overwrites evidence, and uses no-follow directory handles for atomic publication and hash-bound rollback.
- id: ACT-002
  planned_change_id: CHG-002
  paths:
  - scripts/generate_implementation_status.py
  summary: Added bounded recursive receipt discovery, no-follow cache reads, a versioned S4-S6 historical compatibility mapping, and an explicit runtime-unknown truth boundary.
- id: ACT-003
  planned_change_id: CHG-003
  paths:
  - tests/test_delivery_receipt_rebuild.py
  - tests/test_implementation_status.py
  - tests/test_prd_status_projection.py
  summary: Added regression coverage for path escape, ancestor swap, file limits, duplicate and external manifests, idempotence, non-overwrite, partial rollback, legacy slice mapping, exact delivery subjects, unresolved gates, and runtime unknown semantics.
- id: ACT-004
  planned_change_id: CHG-004
  paths:
  - docs/prds/2026-07-29-omni-fde-system-convergence-master-prd/implementation-status.yaml
  - docs/dev-changes/2026-08-07-prd-receipt-cache-rebuild/impact.yaml
  - docs/dev-changes/2026-08-07-prd-receipt-cache-rebuild/completion.yaml
  - docs/dev-changes/2026-08-07-prd-receipt-cache-rebuild/delivery-projection.yaml
  summary: Regenerated canonical and change-scoped delivery projections from four live verified receipts; S4-S14 are COMPLETE, S0/S0.5 and their prerequisites remain explicitly BLOCKED, projection errors are empty, and runtime remains unknown.
contract_delta:
- description: Expanded the locked contract to include ownership, readiness, and W5 recovery consumers plus their regression suites.
  reason: Independent review proved those consumers dynamically reuse the same receipt discovery implementation.
  effect: Recursive discovery is verified across all known downstream governance readers rather than only the PRD projection.
  accepted: true
- description: Strengthened cache publication and reads from path checks to Git-common-dir-rooted no-follow directory handles, and aligned recovery limits with discovery limits.
  reason: Repeated red-team review reproduced ancestor symlink escape and identified validation-to-use races in shared cache operations.
  effect: Reads, writes, publication races, and rollback fail closed without following replaced ancestors; unsupported platforms do not fall back to unsafe shared-cache writes.
  accepted: true
- description: Added a versioned compatibility mapping for the historical S4-S6 gap-closure contract and explicit runtime observation semantics.
  reason: The historical feature_ref does not contain parseable slice tokens, and delivery receipts alone cannot prove current service health.
  effect: The delivered gap contract no longer creates a false projection error, while every projection states runtime status unknown until separately observed.
  accepted: true
