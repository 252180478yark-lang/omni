  - consumer:scripts/w5_recovery_evidence.py
  edges:
  - manifest verified_deliveries declares exact artifact IDs, digests, raw hashes, and cache paths
  - projection currently scans only verified-receipts/*.json and misses the declared w0/*.json location
  evidence:
  - Four canonical artifacts remain non-expired and their signed receipts validate against GitHub and repository history.
  - Fresh projection at the base commit reports S1-S14 VERIFIED_NOT_DELIVERED until explicit receipts are supplied.
