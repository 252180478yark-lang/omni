compatibility:
  api:
    status: not_applicable
    strategy: No REST, IPC, or MCP contract changes.
  database:
    status: not_applicable
    strategy: No migration or persistent business-data changes.
  workflow:
    status: compatible
    strategy: Existing explicit external receipt paths remain unchanged. Automatic cache discovery alone becomes recursive, with stable sorting and deduplication, regular-file and containment checks, no symlink or junction traversal, depth 4, at most 256 files, 1 MiB per file, and 8 MiB total; every limit violation fails closed.
  data_source:
    status: compatible
    strategy: Uses authenticated gh CLI against exact committed versioned artifact IDs; missing, modified, expired, oversized, ambiguous, unsafe, or drifting artifacts fail closed. Cache publication and automatic cache reads require no-follow directory-fd support; unsupported platforms fail closed and may still use live dry-run or explicit external receipt inputs without writing shared cache state.
graph_acceptance:
  required_edges:
  - from: manifest:w0-verified-deliveries
    to: script:rebuild-delivery-receipts
    relation: configures
  - from: script:rebuild-delivery-receipts
    to: cache:verified-receipts-w0
    relation: writes-verified-evidence
  - from: cache:verified-receipts
