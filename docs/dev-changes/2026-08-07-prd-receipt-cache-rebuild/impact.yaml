  layer: service
  command: uv run --with 'pyyaml>=6,<7' --with pytest python -m pytest tests/test_delivery_receipt_rebuild.py -q
  proves: Manifest parsing, safe target resolution, exact hash checks, atomic writes, and fail-closed recovery behavior.
  required: true
- id: VER-002
  layer: integration
  command: PYTHONDONTWRITEBYTECODE=1 uv run --with 'pyyaml>=6,<7' python -B scripts/rebuild_delivery_receipts.py --dry-run --manifest docs/dev-changes/2026-08-02-omni-unified-ai-workbench-w0/path-ownership-fingerprint.yaml
  proves: All four versioned live GitHub artifacts validate without mutating the linked-worktree shared cache; temporary-repository tests prove publication separately.
  required: true
- id: VER-003
  layer: service
  command: uv run --with 'pyyaml>=6,<7' --with pytest python -m pytest tests/test_implementation_status.py tests/test_workspace_ownership.py tests/test_development_readiness.py -q -k 'not production_s8_s10_handoff_hashes_bind_to_the_historical_git_blobs'
  proves: Nested receipt discovery is bounded, deterministic, compatible, rejects path escapes and limits, and preserves ownership, readiness, and W5 consumers.
  required: true
- id: VER-004
  layer: workflow
  command: uv run --with 'pyyaml>=6,<7' --with pytest python -m pytest tests/test_prd_status_projection.py::test_recovered_delivery_projection_preserves_truth_boundaries -q
  proves: The four canonical contracts project effective_state COMPLETE with manifest subjects and hashes, unresolved secret, migration, hook, and projection gates remain explicit, and no runtime-health claim is inferred.
  required: true
- id: VER-005
  layer: governance
  command: uv run --with 'pyyaml>=6,<7' python -m py_compile scripts/generate_implementation_status.py scripts/rebuild_delivery_receipts.py && git diff --check
  proves: Both command entry points parse under the supported Python runtime and the candidate patch has no whitespace or integrity errors.
  required: true
