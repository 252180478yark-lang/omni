    relation: read-by
  - from: cache:verified-receipts
    to: consumer:scripts/check_development_readiness.py
    relation: read-by
  - from: cache:verified-receipts
    to: consumer:scripts/w5_recovery_evidence.py
    relation: read-by
  allowed_unknowns:
  - Current Docker runtime and frontend reachability remain unknown until the separate runtime recovery change starts services.
  - S0 secret, migration baseline, and current-user hook trust gates may remain blocked and must not be inferred from delivery receipts.
  forbidden_orphans:
  - script:scripts/rebuild_delivery_receipts.py
risks:
- A forged or relocated manifest path could overwrite unintended files; constrain resolved targets to the Git common-dir receipt cache and reject symlinks/path escape.
- A stale artifact could be trusted; verify live artifact metadata, archive safety, signed payload equality, raw hash, immutable commit, and contract hashes before exclusive publication.
- Recursive discovery could traverse links; do not follow symlinked directories and reject resolved paths outside the cache root.
- A partially valid manifest could leave a misleading subset; validate every declared artifact and target before writing, then roll back only files created by this invocation whose hashes still match.
out_of_scope:
- Starting Docker or asserting current frontend/runtime health.
- Changing S0 secret fixtures, migration policy, or current-user hook trust.
- Fixing the separate runtime trace token wiring and Host Bridge container routing gaps.
- Publishing, migration execution, paid actions, deletion, or other R3 effects.
rollback:
  strategy: Revert the commit. Recovery treats identical existing regular files as idempotent success and fails closed on different content, non-regular files, symlinks, or publication races. It validates all four entries before any receipt write, records created paths, and on failure removes only files created by that invocation whose current hash still matches; it never overwrites prior evidence.
  data_recovery: No business data changes. CI artifacts remain the source of truth and the cache can be rebuilt again while artifacts are available.
