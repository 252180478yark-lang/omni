risk:
  level: R2
  reasons:
  - Changes delivery-governance evidence discovery and rebuild behavior across linked worktrees.
  - Regenerates the canonical PRD implementation projection from immutable CI receipts.
  - The local Git common-dir cache is shared by linked worktrees and changes ownership, readiness, and W5 recovery evidence resolution; it is reversible repository-local state, not an external platform mutation.
  external_effects: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The repository versions exact canonical delivery artifact metadata, but a fresh machine cannot rebuild the missing verified-receipt cache and the projection ignores receipts stored in its documented nested cache directory. The canonical status therefore regresses delivered slices to VERIFIED_NOT_DELIVERED.
  expected_outcome: A deterministic fail-closed command restores the four versioned canonical receipts, nested receipts are discovered by projection, and the canonical status represents delivered slices without claiming runtime health or bypassing S0 gates.
  user_visible_behavior:
  - The PRD implementation status distinguishes already delivered S0-S14 code from unresolved security, migration, hook-trust, and runtime readiness.
  - Developers can recover delivery evidence on a new machine with one bounded command.
