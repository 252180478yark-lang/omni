contract_delta:
- description: Curated the original recovery candidate for the unified integration lineage and transferred later-written shared runtime, Docker, frontend, database and local MCP ownership to their final contracts.
  reason: The source branch bundled machine-local configuration and paths subsequently rewritten by profile-aware macOS, single-user trust and WebSocket changes; commit-mode delivery requires one final owner and an ancestor baseline.
  effect: This contract retains the macOS start/stop entrypoints and unique nullable video-analysis startup repair, while excluded local planning/configuration and superseded shared paths remain absent or are owned by later integration contracts.
  accepted: true
- description: The GRAPH_DIFF_READY strict validator is executed after the state transition because its expected state does not exist before the transition.
  reason: Recording it as a pre-transition requirement would create a circular state dependency.
  effect: All required implementation and runtime evidence is recorded before transition; the exact strict command is then run and appended before handoff.
  accepted: true
