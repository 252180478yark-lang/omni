  summary: Added supported macOS start, stop, and deterministic recovery-verification workflows with isolated RuntimeAllocation URLs and a developer handoff in the README.
  paths:
  - scripts/dev-start-mac.sh
  - scripts/dev-stop-mac.sh
  - scripts/verify-mac-recovery.sh
  - README.md
- id: RECOVERY-ACT-002
  planned_change_id: RECOVERY-002
  summary: Made the Next.js custom server runnable in the production image by preserving its runtime entrypoint and source modules and binding the server to a Docker-reachable interface.
  paths:
  - frontend/Dockerfile
  - frontend/next.config.mjs
  - frontend/server.ts
- id: RECOVERY-ACT-003
  planned_change_id: RECOVERY-003
  summary: Made all affected service images build reliably on Apple Silicon with HTTPS Debian sources, bounded retries, and portable ARM64 dependency installation.
  paths:
  - services/knowledge-engine/Dockerfile
  - services/livestream-analysis/Dockerfile
  - services/scout-agent/Dockerfile
  - services/video-analysis/Dockerfile
- id: RECOVERY-ACT-004
  planned_change_id: RECOVERY-004
  summary: Normalized nullable AI Hub model settings before video-analysis startup and added focused regression coverage for null, missing, blank, and populated values.
  paths:
  - services/video-analysis/app/main.py
  - services/video-analysis/app/settings_normalization.py
  - services/video-analysis/tests/test_settings_normalization.py
- id: RECOVERY-ACT-005
  planned_change_id: RECOVERY-005
  summary: Added a project-local localhost-only Omni MCP declaration without importing Windows credentials.
  paths:
  - .codex/config.toml
- id: RECOVERY-ACT-006
  planned_change_id: RECOVERY-006
  summary: Restored the verified PostgreSQL 16 custom dump and knowledge archive into the fresh isolated RuntimeAllocation, backfilled only its disposable legacy migration checksums, and upgraded it through all 45 existing migrations while preserving the source database.
  paths:
  - docker-compose.yml
  - migrations/104_workbench_context_and_agent_binding.sql
  - scripts/apply_migrations.py
