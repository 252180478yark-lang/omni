  evidence:
  - docker-compose.yml requires RuntimeAllocation environment, builds all affected services, and wires them to the allocated PostgreSQL service.
  - Current container logs show frontend exits with ERR_MODULE_NOT_FOUND for /app/server.ts and video-analysis exits when default_chat_model is null.
  - The recovered source database `omni_windows_20260612` is 4,761 MB with 106 user tables and substantial business rows; the current test runtime database is only 18 MB and mostly empty.
  - scripts/runtime_allocation.py list reports isolated ports, volume names, source fingerprints, and ownership for every local runtime.
