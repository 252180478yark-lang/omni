risks:
- id: RECOVERY-RISK-DATA-TARGET
  description: Restoring into the wrong PostgreSQL volume could overwrite unrelated Mac data.
  mitigation: Create a new RuntimeAllocation, resolve its exact compose project and volume, start only its PostgreSQL service, and verify both source and target identities before import. Never restore into an existing non-target volume.
- id: RECOVERY-RISK-SECRET-EXPOSURE
  description: Runtime allocation and MCP configuration can reference credentials.
  mitigation: Reuse generated secret-file references, never print secret values, and keep the MCP endpoint localhost-only.
- id: RECOVERY-RISK-SCHEMA-DRIFT
  description: The June Windows snapshot has fewer migrations than the current source and could fail during upgrade.
  mitigation: Keep the verified source database unchanged, restore only into a new isolated volume, run existing migrations, and stop on the first deterministic migration error without deleting either copy.
- id: RECOVERY-RISK-BUILD-NETWORK
  description: Debian or Python package mirrors may time out during Apple Silicon builds.
  mitigation: Use HTTPS Debian sources and bounded retries while preserving package versions; retain already-built images and report a network failure separately from a source failure.
out_of_scope:
- No conversion, mounting, modification, or deletion of the 129 GB Windows docker_data.vhdx.
- No automatic import of auth.json, browser profiles, cookies, plaintext secrets, Windows binaries, or the scout-session archive.
- No database schema addition, public API change, external deployment, paid action, or cloud data transmission.
- No cleanup of existing Docker containers, images, volumes, RuntimeAllocations, downloaded backups, or unrelated worktree changes.
rollback:
  strategy: Stop the exact new Compose project without `down -v`; keep its isolated volume for inspection, and revert only the repository paths listed in this contract if requested. Existing Mac and Windows-source runtimes are not modified.
  data_recovery: The verified source database `omni_windows_20260612`, the 2.5 GB custom dump, the restored knowledge volume, and the pre-import Codex/Docker snapshot remain intact. No destructive rollback is required.
