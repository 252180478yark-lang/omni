risk:
  level: R2
  contract_profile: full
  reasons:
  - The recovery changes Docker build/runtime behavior across frontend and four services on Apple Silicon.
  - The runtime restores a user-owned Windows PostgreSQL snapshot into a new isolated local volume and upgrades it through existing migrations.
  - Project-local MCP configuration and macOS runtime allocation scripts affect development workflow but do not grant external access.
  external_effects: []
  scope_deltas:
  - id: RECOVERY-DELTA-001
    discovered_at: '2026-08-07T01:55:00Z'
    reason: The macOS system Python is 3.9 and does not provide stdlib tomllib; the deterministic MCP parse check must select the already-supported Python 3.11 tool runtime.
    added_paths: []
    required_level: R2
    risk_change: No scope or behavior change; only the verification interpreter is made explicit.
  - id: RECOVERY-DELTA-002
    discovered_at: '2026-08-07T02:24:00Z'
    reason: The rebuilt frontend process was healthy but Docker's published port returned 502 because the custom server bound only to the container loopback interface.
    added_paths:
    - frontend/server.ts
    required_level: R2
    risk_change: Compatible container-network binding change; no route, authentication, or public deployment behavior changes.
  - id: RECOVERY-DELTA-003
    discovered_at: '2026-08-09T15:34:13Z'
    reason: Unified commit-mode validation proved the macOS start and stop entrypoints are introduced after this contract's immutable recovery baseline and are already present at the later integration baseline.
    added_paths:
    - scripts/dev-start-mac.sh
    - scripts/dev-stop-mac.sh
    required_level: R2
    risk_change: Compatible ownership correction only; the scripts, loopback bindings, RuntimeAllocation use and non-destructive stop behavior are unchanged.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The Windows backups are present on macOS, but the current Omni Docker stack uses a nearly empty database and cannot serve the UI because the frontend image lacks server.ts while video-analysis crashes on a null model value.
  expected_outcome: A fresh isolated macOS RuntimeAllocation boots the full Omni stack on Apple Silicon, runs against a verified copy of the recovered Windows data, and exposes a working local UI plus deterministic database and health evidence.
  user_visible_behavior:
  - The macOS start script prints the allocated local frontend and Nginx URLs and starts without overwriting another Omni runtime.
  - The Nginx and frontend entry points return a successful HTTP response.
  - The recovered Windows business records are queryable from the runtime database and visible through an existing product read path.
  - The project-local Codex configuration registers the localhost Omni MCP endpoint without copying Windows credentials.
