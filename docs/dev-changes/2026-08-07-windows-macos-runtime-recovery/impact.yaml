  - id: service:docker-compose.omni
    role: Builds and runs the Omni infrastructure and application services.
  - id: service:frontend.runtime
    role: Runs the Next.js custom server from server.ts.
  - id: service:video-analysis.startup-settings
    role: Loads persisted and AI Hub Gemini settings during service startup.
  - id: service:knowledge-engine.image
    role: Builds the Knowledge Engine image with Debian and Playwright dependencies.
  - id: service:livestream-analysis.image
    role: Builds livestream analysis with ffmpeg.
  - id: service:scout-agent.image
    role: Builds the browser automation service with Debian system dependencies.
  - id: db:postgres.recovered-windows-runtime
    role: New isolated runtime copy of the recovered Windows PostgreSQL database.
  - id: mcp-server:omni-localhost
    role: Project-local Codex MCP declaration for the local Knowledge Engine.
