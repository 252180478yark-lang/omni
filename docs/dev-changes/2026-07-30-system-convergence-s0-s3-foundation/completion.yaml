contract_delta:
- description: Added readiness fixture coverage and made every dynamically loaded governance dependency a critical immutable asset.
  reason: Full CI regression proved the old temporary repository omitted workspace ownership and its delivery resolver dependencies.
  effect: Session readiness reports malformed ownership as explicit unknown and clean CI fixtures exercise the real dependency chain.
  accepted: true
- description: Projected OMNI_BUILD_SOURCE_FINGERPRINT alongside the host allocation build commit.
  reason: A real pre-side-effect RuntimeAllocation smoke found that dev-start could not validate the complete source/build identity pair.
  effect: Host development validates the exact checkout while Compose containers continue to use Dockerfile-baked identity rather than runtime spoofing.
  accepted: true
- description: Updated the legacy human-gate integration test to use an authenticated owner and verify decided_by, while retaining an anonymous 401 assertion.
  reason: The S2 approval boundary intentionally removed anonymous list/approve/reject access.
  effect: Compatibility behavior is proven against a fully migrated disposable database without weakening authentication.
  accepted: true
- description: Removed graph-test collection-time deletion of all app modules.
  reason: The cleanup created duplicate exception class identities and made a valid combined Knowledge Engine suite fail by collection order.
  effect: Domain tests now pass both separately and in one process; CI still uses service working directories to avoid unrelated package-name collisions.
  accepted: true
- description: Expanded the locked scope to remove 31 tracked Python bytecode cache artifacts from four explicit service directories.
  reason: Repository hygiene inspection found committed __pycache__ artifacts that remain tracked despite the existing __pycache__/ and *.pyc ignore rules.
  effect: Only the enumerated generated bytecode files may be deleted; no Python source or runtime behavior changes, and a deterministic Git index check must prove that no tracked *.pyc remains.
  accepted: true
- description: Normalized the two pre-authorized graph unknowns to collector identities with explicit owners and expiries.
  reason: A fresh dynamic all-feature scan completed seven of nine collectors and isolated the only unavailable evidence to the absent candidate attestation and the owner-controlled live health adapter.
  effect: No collector failure is converted to missing or removed evidence; both unknowns must be refreshed or re-accepted after their expiry.
  accepted: true
- description: Replaced VER-014 worktree-only discovery with a reproducible locked-base-to-index candidate gate plus an identical-tree shadow-commit proof.
  reason: The implementation was already committed at VERIFYING, so worktree mode can only see the final contract delta and cannot represent the locked base-to-candidate implementation without emitting false actual-change mismatches.
  effect: Index mode now accepts an explicit immutable base and compares that base directly with the current Git index, so the exact locked command proves the full candidate without a temporary clone. The identical index tree must also pass base-to-shadow commit mode; no default ref, remote, shared database, or shared runtime is changed.
  accepted: true
- description: Made schema-v3 index validation fail closed when the immutable delivery base is omitted and updated the implementation Skill to pass that base explicitly.
  reason: A bare HEAD-to-index diff can omit implementation that was committed while the same contract was still VERIFYING, allowing an incomplete candidate scope to appear valid.
  effect: Schema v1/v2 compatibility remains available, while schema v3 must prove the complete declared-base-to-index tree and reject a mismatched or missing base.
  accepted: true
- description: Bound the accepted graph snapshot to the last graph-affecting implementation commit and reserved the following commit for contract evidence only.
  reason: GraphSnapshotContent includes its subject commit in the content hash, so writing that hash into the same implementation commit would create an impossible self-reference and stale provenance.
  effect: Commit 597d7402565b539bde12f5229ca78fd7e6b9a502 is the immutable graph subject; its two dynamic scans form the S3 before/after determinism pair and must agree. Because no same-schema pre-S3 snapshot exists, added, modified and removed fact lists stay empty instead of inventing a historical diff, and the later contract-only commit may not change graph-affecting source.
  accepted: true
- description: Separated the S3 typed sample fact graph from the contract-level foundation edge evidence whose planned-to-fact projection begins in S4.
  reason: The 12 foundation acceptance triples use governance IDs such as hook, artifact, state and workflow, while the S3 collectors intentionally emit typed feature, route, operation, service-symbol, table, migration, test and health facts; treating the former as d429 snapshot edges would fabricate observed facts.
  effect: The S3 snapshot claim is limited to deterministic collection and the cost-management sample's seven required typed edges, all present with open evidence. The 12 foundation relationships remain independently proven by their source/test evidence below; automatic contract-to-fact mapping, missing-edge issues and blocking CI remain out of scope until S4.
  accepted: true
- description: Replaced the allocation-dependent bare Compose render command with the deterministic Compose runtime contract test.
  reason: Canonical Compose intentionally requires RuntimeAllocation variables, so docker compose config --quiet without an allocation must fail closed and cannot be a reproducible locked verification command.
  effect: VER-005 now proves both the fail-closed boundary and the allocation-aware render contract in tests; a separate dry-run allocation environment rendered the actual Compose model with exit code 0 without creating a lease or changing runtime state.
  accepted: true
