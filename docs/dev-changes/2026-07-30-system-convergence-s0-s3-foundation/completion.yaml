contract_delta:
- description: Added readiness fixture coverage and made every dynamically loaded governance dependency a critical immutable asset.
  reason: Full CI regression proved the old temporary repository omitted workspace ownership and its delivery resolver dependencies.
  effect: Session readiness reports malformed ownership as explicit unknown and clean CI fixtures exercise the real dependency chain.
  accepted: true
- description: Projected OMNI_BUILD_SOURCE_FINGERPRINT alongside the host allocation build commit.
  reason: A real pre-side-effect RuntimeAllocation smoke found that dev-start could not validate the complete source/build identity pair.
  effect: Host development validates the exact checkout while Compose containers continue to use Dockerfile-baked identity rather than runtime spoofing.
  accepted: true
- description: Updated the legacy human-gate integration test to use an authenticated owner and verify decided_by, while retaining an anonymous 401 assertion.
  reason: The S2 approval boundary intentionally removed anonymous list/approve/reject access.
  effect: Compatibility behavior is proven against a fully migrated disposable database without weakening authentication.
  accepted: true
- description: Removed graph-test collection-time deletion of all app modules.
  reason: The cleanup created duplicate exception class identities and made a valid combined Knowledge Engine suite fail by collection order.
  effect: Domain tests now pass both separately and in one process; CI still uses service working directories to avoid unrelated package-name collisions.
  accepted: true
