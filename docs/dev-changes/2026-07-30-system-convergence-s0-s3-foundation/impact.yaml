risks:
- id: RSK-001
  description: Parallel agents could touch the same shared bootstrap or policy file and silently overwrite each other.
  mitigation: Assign disjoint path domains, reserve shared files to one owner, inspect the combined diff, and run contract ownership validation before verification.
- id: RSK-002
  description: Runtime isolation code could alter the canonical main runtime or reveal credentials while inspecting allocations.
  mitigation: Keep allocation state local and ignored, redact DSNs and secrets, preserve canonical defaults, and test with fixtures without stopping or rebuilding current containers.
- id: RSK-003
  description: A migration change could be mistaken for authorization to change a shared database.
  mitigation: Restrict this contract to migration source and disposable-database verification; shared or production execution remains an explicit R3 gate.
- id: RSK-004
  description: A worker crash after an external side effect but before result persistence could cause a duplicate replay.
  mitigation: Require handler idempotency strategy, persist effect-started state, and move uncertain outcomes to manual reconciliation instead of automatic replay.
- id: RSK-005
  description: Health aggregation could report false success when probes fail or build identity is stale.
  mitigation: Preserve typed source failures, make unknown non-green, compare build identity, and exercise unavailable, degraded, stale, unknown, and partial fixtures.
- id: RSK-006
  description: Dynamic graph collection could leak source content or erase facts when one source times out.
  mitigation: Store evidence coordinates rather than snippets, redact secret patterns, isolate dynamic collectors with timeouts, and prohibit removed edges from failed sources.
- id: RSK-007
  description: Tracked cookie helper scripts contain session-like literals that could remain usable even after their source representation is removed.
  mitigation: Replace literals with validated external secret-file references, scan tracked source without returning matched values, and report external credential rotation as a separate owner-authorized action.
out_of_scope:
- No default-branch merge or push, external CI mutation, release, deployment, or external-system write is authorized by this contract.
- No shared, canonical, staging, or production database migration is executed; database verification uses disposable isolated resources only.
- No running container, user worktree, branch, volume, credential, client application, or business data is stopped, deleted, rewritten, or retired.
- S4 planned-versus-fact issue cards and blocking CI graph gate, S5 candidate co-design, S7 graph API/UI persistence, S8 trace spine, and later PRD slices are not included.
- No arbitrary external side-effect handler is claimed exactly-once unless it declares and proves a transaction, provider idempotency key, or manual-reconciliation boundary.
- No external account session or cookie is rotated, revoked, exported, or replayed; those provider-side actions require explicit target confirmation and fresh R3 authorization.
rollback:
  strategy: Revert the isolated candidate commit; retain schema-v1/v2 contract readers and legacy human-gate endpoints, remove generated graph/status artifacts, and release only allocations owned by this change ID.
  data_recovery: The implementation does not mutate shared business data. Disposable database fixtures can be dropped after verification; an un-applied additive migration requires no data recovery.
