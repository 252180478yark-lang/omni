risk:
  level: R2
  reasons:
  - The change spans repository governance, local hooks, runtime allocation, migration orchestration, backend APIs, frontend health semantics, and deterministic graph artifacts.
  - An incorrect ownership, migration, health, or approval transition could block development or misrepresent an unavailable or unapproved operation as safe.
  - Database changes are additive migration files only; this contract does not authorize applying them to a shared or production database.
  external_effects: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: PRD v1.2 currently has an externally delivered S0.5 governance candidate, but S0 ownership projection, proportional S1 contracts, S1.5 runtime isolation, S2 local process gates, S2.5 truthful health and recoverable approval, and S3 deterministic feature graph are absent or partial.
  expected_outcome: Deliver one coherent, backward-compatible S0 through S3 foundation in an isolated branch, with deterministic local verification and an immutable candidate that remains verified-not-delivered until trusted default-branch CI emits its external attestation.
  user_visible_behavior:
  - New development tasks classify risk and path ownership before writes, remediate same-risk scope drift, and block only risk escalation, active lease conflict, or deterministic broken evidence.
  - Parallel worktrees obtain isolated ports, database, writable volumes, Redis namespace, build identity, and scheduler ownership before starting a writable runtime.
  - Development, Docker, and CI use the same checksum-verifying migration runner and can emit a redacted MigrationReceipt.
  - The overview reports healthy, degraded, unavailable, stale, or unknown with failed-source reasons instead of converting errors to zeros or a false 100 percent.
  - A new approval operation returns pending immediately, resumes through a leased worker, and never blindly replays an uncertain external side effect.
  - The cost-management sample FeatureDefinition generates an atomic registry and graph-expectation bundle and stable, redacted fact snapshots with evidence.
