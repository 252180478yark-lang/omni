  - scripts/runtime_guard.py verify currently reports cross-worktree writable database, volume, scheduler, and build-identity conflicts and has no allocation store.
  - .codex/hooks.json currently contains advisory SessionStart handlers only.
  - frontend/src/app/api/omni/overview/route.ts currently reduces two HTTP probes to healthy/down and folds failed data reads into zero metrics.
  - services/knowledge-engine/app/mcp/human_gate.py currently polls inside the caller request, and no ApprovalOperation worker or recovery model exists.
  - No FeatureDefinition schema, deterministic system graph scanner, immutable snapshot writer, or fact-snapshot diff exists at the base commit.
  - Two tracked cookie helper scripts contain embedded session-like material; S0 source hygiene must replace literals with local secret-file references without printing or exporting any value.
