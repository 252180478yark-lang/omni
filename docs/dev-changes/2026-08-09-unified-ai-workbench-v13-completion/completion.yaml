- id: WB13-ACT-007
  planned_change_id: WB13-CHG-007
  summary: 'Corrected the S3 collector regression to assert the declared non-overlapping owners: workspace-operations owns the work workspace and system-console owns the development command center.'
  paths:
  - services/knowledge-engine/tests/test_system_graph_collectors.py
contract_delta:
- description: Added the S3 system-graph owner regression after the first real feature-branch CI run.
  reason: CI proved the existing test still expected workspace-operations to own /workspace/development even though the versioned system-console FeatureDefinition is its canonical and sole owner.
  effect: The test now follows current machine truth and independently verifies both sides of the non-overlapping ownership boundary; no product route or collector implementation changes.
  accepted: true
- description: Included the shared runtime-trace BFF authentication helper in local-owner convergence.
  reason: The blueprint and run center otherwise retained a second identity/HMAC dependency outside the initially discovered shared helper.
  effect: Loopback-owned reads use local trust; same-origin writes, R3 decisions and audit remain unchanged.
  accepted: true
- description: Extended the downstream Knowledge Engine Agent Contract to accept canonical project/context/provider fields.
  reason: Host Bridge could not remove raw public paths while its active consumer still required project_dir.
  effect: New fields are additive, the legacy input remains accepted but excluded from output, and no migration is required.
  accepted: true
- description: Migrated identity-era frontend regressions and inbox UI/session behavior to the current local-owner contract.
  reason: Full regression found tests and a visible email/password form that contradicted the single-user product contract.
  effect: Product login is removed; external provider/platform credentials and browser mutation protections remain.
  accepted: true
- description: Hardened approval decision verification after separating requester and decision actors.
  reason: The local owner may approve an operation requested by the trusted Knowledge Engine principal; conflating both identities rejected valid decisions.
  effect: Request provenance and approved decision actor are independently validated, with legacy identity decisions still compatible.
  accepted: true
- description: Reopened the GRAPH_DIFF_READY candidate for post-commit repair of real context persistence, Host acceptance/rebind semantics, grounded suggestions, approval projection and unsafe Codex argv.
  reason: Independent code-path review proved the previous passing tests manually injected context and asserted the unsafe sandbox flag instead of exercising the normal UI-to-Host-to-database chain.
  effect: Adds no migration or external effect; the existing append-only context table and durable approval queue become reachable, and provider/sandbox behavior becomes fail-closed.
  accepted: true
