compatibility:
  api:
    status: compatible
    strategy: Existing routes and response identities remain; new context/provider/artifact fields are additive. Raw project_dir may be accepted only at the authenticated Host-internal input boundary during the compatibility window and is never returned publicly.
  database:
    status: compatible
    strategy: Reuse additive migration 104 and existing approval/runtime tables; this change adds no migration and does not rewrite or delete persisted rows.
  workflow:
    status: compatible
    strategy: Existing legacy sessions/operations with absent context pairs remain readable. New Host runs freeze a complete snapshot/revision pair, provider resolution becomes immutable after acceptance, and R3 approval state/CAS semantics remain unchanged.
  data_source:
    status: compatible
    strategy: Reuse system graph, runtime event and provider event truth sources. Collector failure remains unavailable/stale and never becomes missing or success.
