  - id: WB13-DELTA-004
    discovered_at: '2026-08-09T03:46:00Z'
    reason: The retained inbox still renders an Identity email/password form and its session endpoint still calls identity-service, contradicting the locked single-user local-owner outcome even though shared verification was already local.
