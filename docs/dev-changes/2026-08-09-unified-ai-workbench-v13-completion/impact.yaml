risks:
- id: WB13-RISK-001
  description: A page/object switch could retarget an already running or approval-waiting operation.
  mitigation: Persist the canonical context snapshot/revision pair per Host run and require compare-and-swap for rebind; tests hold SKU-A while the UI advances to SKU-B.
- id: WB13-RISK-002
  description: Removing product authentication could expand network exposure.
  mitigation: Keep frontend, Host and published service ports bound to loopback; add manifest/Compose assertions and retain same-origin checks for browser mutations.
- id: WB13-RISK-003
  description: Provider fallback could silently switch the executing brain.
  mitigation: Resolve and disclose fallback before acceptance; after acceptance failure becomes PAUSED/FAILED and recovery retains provider/parent lineage.
- id: WB13-RISK-004
  description: A progressive blueprint could display demo or planned nodes as facts.
  mitigation: Reuse the canonical graph model, require provenance/freshness, and test unavailable/partial/empty responses with no demo fallback.
out_of_scope:
- Physical deletion of legacy routes, identity-service source, Desktop renderer source, tables, migrations, secrets or historical data.
- Real external publication, payment, credential changes, shared-database migration execution or any other R3 side effect.
- New Prompt/Eval experiment backend, multi-user accounts, RBAC or remote network exposure.
- The adjacent omni-desktop repository; it receives a separate contract and commit after this canonical Web/Host boundary is verified.
rollback:
  strategy: Revert the focused candidate commits. The new UI slots/components are additive, existing full-page graph/runtime routes remain, Host state stays backward-readable, and legacy input aliases remain accepted. Restore the previous Compose profile to re-enable identity/HMAC containers if rollback is required.
  data_recovery: No destructive schema or data migration occurs. Existing context/session/runtime/approval rows are preserved and legacy null/absent context pairs remain valid.
