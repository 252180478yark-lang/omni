intent:
  problem: 'W0/G1/W1 and later system-convergence work provide the registry, contracts, graph and runtime foundations, but PRD v1.3 W2-W6 remain disconnected: business pages lack the progressive evidence assistant/blueprint/run center, Host sessions expose raw project_dir and do not persist the frozen context pair, and retained BFFs still require product login/internal HMAC in a loopback-only single-user product.'
  expected_outcome: The shared Web Shell presents evidence-grounded AI actions, a truthful progressive blueprint and recoverable run/approval center; provider-neutral Host sessions persist immutable context and disclose provider/fallback without raw paths; retained local BFFs work as the owner without login or internal shared secrets while R3 still requires explicit operation approval.
  user_visible_behavior:
  - Work and development modes preserve the same selected context, session and operation while rendering the existing 5+5 navigation.
  - A global assistant separates observations, inferences and proposed actions; absent evidence returns an explicit insufficiency state and creates no write operation.
  - Blueprint and run-center drawers are available from migrated pages, distinguish fact/plan/stale/unavailable, deduplicate events, and expose approval/recovery actions.
  - Host-unavailable, provider-unavailable, context-changed and upstream-error states are actionable and never presented as success.
  - The local owner opens retained pages without product login; external provider credentials and R3 confirmation remain protected.
