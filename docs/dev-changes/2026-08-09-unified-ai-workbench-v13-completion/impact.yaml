  - id: WB13-DELTA-003
    discovered_at: '2026-08-09T03:44:00Z'
    reason: Full frontend regression proved four legacy test suites still assert mandatory Identity login and an extra Identity upstream call, while their production routes now correctly use the trusted local owner contract.
