schema_version: 2
change_id: 2026-07-29-feature-contract-gate-archival-compatibility
title: Permit verified historical actual paths in feature-contract gate
state: COMPLETE
created_at: '2026-07-29T13:19:19Z'
updated_at: '2026-07-29T13:24:43Z'
feature_refs:
- feature_id: s1-governance-foundation
  feature_ref: prd:2026-07-29-omni-fde-system-convergence-master#S1-governance
before_snapshot:
  ref: git:e534655124387655d6528960c67616269f68771c
intent:
  problem: The feature-contract gate currently rejects a valid staged batch when a changed COMPLETE contract records actual files that were already committed to HEAD by the owning delivery before the contract artifacts were staged.
  expected_outcome: The gate accepts an actual path outside the current diff only when Git proves that exact path is already tracked at the evaluation head; it retains bidirectional coverage for current protected changes, validates contract-only archival diffs, and rejects non-diff paths that are untracked or unavailable from the evaluation head.
  user_visible_behavior:
  - Contract-only archival delivery can coexist with unrelated protected changes in a staged batch without falsely failing the global contract gate.
  - A completion contract cannot use a merely on-disk or missing path to bypass current-diff accountability, and CI evaluates the supplied --head rather than the checkout's unrelated local HEAD.
current_chain:
  nodes:
  - ci:feature-contract-gate
  - service:feature-contract-gate
  - source:git-head-tree
  - state:contract-gate-report
  edges:
  - ci:feature-contract-gate -> service:feature-contract-gate
  - service:feature-contract-gate -> source:git-head-tree
  - service:feature-contract-gate -> state:contract-gate-report
  evidence:
  - scripts/check_feature_contracts.py:check_feature_contracts currently compares every completion.actual_changes path only with the current changed-file set.
  - Current staged diff contains 51 actual paths that are absent from the diff and all 51 are already tracked in e534655, the current evaluation head for this staged check.
