  - tests/test_feature_contracts.py
  summary: Cover both the accepted HEAD-tracked historical path and the rejected untracked historical path while retaining the bidirectional current-diff regression.
contract_delta:
- description: Refined the archival exception from an implicit local HEAD lookup to an explicit evaluation-head lookup, and applied actual-path delivery proof to valid contract-only diffs as well as protected diffs.
  reason: The implementation audit showed that CI's --head can differ from the checkout's local HEAD and that leaving contract-only diffs unchecked would retain a path-evidence gap.
  effect: The locked file scope is unchanged; the gate is stricter for untracked, missing, malformed, and contract-only actual paths while still accepting the verified historical S0/P0 records.
  accepted: true
