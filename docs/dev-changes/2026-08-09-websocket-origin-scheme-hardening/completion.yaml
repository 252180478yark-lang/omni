state: GRAPH_DIFF_READY
actual_changes:
- id: ACT-WS-001
  planned_change_id: WS-001
  summary: Extracted WebSocket Origin classification into a deterministic helper that compares exact effective http/https scheme and host, honors the first trusted forwarded values, falls back to direct socket encryption, and rejects malformed or non-origin URL forms before fixed local-owner projection.
  paths:
  - frontend/server.ts
  - frontend/src/lib/agent-chat/ws-origin.ts
- id: ACT-WS-002
  planned_change_id: WS-002
  summary: Added direct, TLS, proxy, array/comma header, mismatch and malformed Origin tests while updating the existing local-owner source-closure assertion to follow the extracted classifier without changing invalid-origin close behavior.
  paths:
  - frontend/tests/websocket-origin.test.ts
  - frontend/tests/approval-auth-session.test.ts
contract_delta:
- description: Added standalone TypeScript coverage and made the intentionally minimal encrypted-socket fixture explicit across an unknown boundary.
  reason: Pull-request CI includes test sources in npx tsc --noEmit and correctly rejected a direct assertion from a one-field object to Node's full Socket type.
  effect: Runtime code is unchanged; the fixture remains minimal, all six security tests pass, and the exact CI compiler command now passes locally.
  accepted: true
- description: Added the existing approval-auth-session source-closure test to the implementation scope.
  reason: Full frontend regression exposed a hardcoded assertion for the former in-file classifier symbol after the classifier was extracted into a testable module.
  effect: The regression now requires isSameOriginWebSocketUpgrade wiring while retaining its no browser token, no session credential and invalid-origin checks.
  accepted: true
- description: Replaced the manual in-app browser check with an isolated production-server smoke in the unified worktree.
  reason: The production artifact and loopback server are deterministic and directly prove the retained routes without depending on unrelated desktop browser state.
  effect: Both workspace routes must return HTTP 200 from the built custom server and the workspace markup must remain the passwordless Omni surface.
  accepted: true
