risk:
  level: R2
  contract_profile: full
  reasons:
  - The retained local-owner WebSocket upgrade currently compares Origin host only, so an http request can accept an https Origin or the inverse despite HTTP mutation routes already requiring exact scheme and host.
  - Scheme inference must remain correct behind a trusted local reverse proxy without weakening malformed, missing or non-HTTP Origin rejection.
  external_effects: []
  scope_deltas:
  - id: WS-DELTA-001
    discovered_at: '2026-08-09T15:15:00Z'
    reason: The full frontend regression suite proved approval-auth-session.test.ts contains a source-closure assertion hardcoded to the former in-file classifier name. Extracting the classifier correctly changed that symbol while preserving the invalid-origin behavior.
    added_paths:
    - frontend/tests/approval-auth-session.test.ts
    required_level: R2
    risk_change: Test-only compatible closure. Update the assertion to require the new imported classifier name so the existing no-token and WebSocket-origin wiring guard follows the implementation without weakening its security checks.
  - id: WS-DELTA-002
    discovered_at: '2026-08-09T15:34:13Z'
    reason: The unified integration worktree has no in-app browser bound to its isolated production build, while the built custom server and loopback HTTP surface are directly testable.
    added_paths: []
    required_level: R2
    risk_change: Replace the manual browser-only verification with a deterministic production-server smoke that proves both retained workspace routes return HTTP 200 without a login redirect or surface.
  - id: WS-DELTA-003
    discovered_at: '2026-08-09T15:40:00Z'
    reason: Pull-request CI runs a standalone TypeScript check that includes test fixtures; it rejected the intentionally minimal Socket fixture's direct structural assertion even though unit tests and the Next production build passed.
    added_paths: []
    required_level: R2
    risk_change: Test-only type closure. Preserve the minimal encrypted-socket fixture through an explicit unknown boundary and add the standalone CI typecheck to required evidence.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The fixed local-owner WebSocket is passwordless by design and therefore depends on an exact browser-origin boundary. Host-only comparison leaves a cross-scheme gap and diverges from the existing HTTP same-origin contract.
  expected_outcome: WebSocket upgrade authorization compares an http/https Origin against the exact effective request scheme and host, including first-hop forwarded headers, and rejects missing, malformed, non-HTTP or scheme/host-mismatched origins before any local-owner action can be accepted.
  user_visible_behavior:
  - Normal loopback agent-chat WebSocket connections continue to work without login, account, password, cookie or internal token.
  - Cross-scheme, cross-host, malformed and non-HTTP Origin handshakes are rejected with the existing same_origin_required behavior.
  - HTTPS termination through a trusted local proxy works when x-forwarded-proto and x-forwarded-host describe the browser-visible origin.
current_chain:
  nodes:
  - id: source:local-browser-origin
    role: Browser-supplied Origin for the loopback personal workspace.
  - id: service:frontend-websocket-upgrade
    role: Node HTTP upgrade boundary for /ws/agent-chat.
  - id: service:frontend-local-owner
    role: Fixed owner projection used after same-origin authorization.
  - id: workflow:agent-chat-websocket
    role: Agent chat and approval event channel.
  edges:
  - from: source:local-browser-origin
    to: service:frontend-websocket-upgrade
    relation: checked-by-host-only
  - from: service:frontend-websocket-upgrade
    to: service:frontend-local-owner
    relation: projects-after-origin-check
  - from: service:frontend-local-owner
    to: workflow:agent-chat-websocket
    relation: operates
  evidence:
  - frontend/server.ts accepts only http/https Origin protocols and matching hosts, but does not compare parsedOrigin.protocol with x-forwarded-proto or the socket protocol.
  - frontend/src/app/api/omni/_shared.ts already defines the intended HTTP semantic as exact protocol plus host.
  - frontend/tests/approval-ws-authorization.test.ts proves invalid-origin sessions are closed before approval actions, but does not test how the server classifies schemes and proxy headers.
