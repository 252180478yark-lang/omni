risks:
- id: WS-RISK-001
  description: TLS termination can make the backend socket plain HTTP even when the browser origin is HTTPS.
  mitigation: Prefer the first normalized x-forwarded-proto and x-forwarded-host values, then fall back to the direct socket encryption state and Host header.
- id: WS-RISK-002
  description: Comma-delimited or array proxy headers can be interpreted inconsistently and accidentally widen admission.
  mitigation: Use one small exported classifier with deterministic first-value normalization and explicit tests for strings, arrays, whitespace and mismatches.
- id: WS-RISK-003
  description: Extracting origin logic could change the existing invalid-origin close path.
  mitigation: Keep attachWsHandler and its invalid-origin sentinel unchanged and rerun its authorization regression together with the new classifier suite.
out_of_scope:
- No account, login, password, cookie, JWT, HMAC, bearer token, signing key, RBAC or product identity layer.
- No change to HTTP mutation authorization, WebSocket message schemas, approval Gate semantics, Knowledge Engine, database or Docker service count.
- No external publication, network exposure expansion, proxy trust configuration change or destructive cleanup.
rollback:
