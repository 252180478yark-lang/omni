compatibility:
  api:
    status: compatible
    strategy: Existing REST/BFF schemas and error semantics are unchanged; deployment now supplies their required file-backed credential.
  database:
    status: not_applicable
    strategy: No schema, migration, or business-data changes.
  workflow:
    status: compatible
    strategy: RuntimeAllocation may emit receiver and publisher compatibility aliases, but user configuration exposes only OMNI_RUNTIME_TRACE_TOKEN_FILE as the canonical source; child roles derive their alias from it.
  data_source:
    status: not_applicable
    strategy: No external data source changes.
graph_acceptance:
  required_edges:
  - from: workflow:runtime-allocation
    to: credential_ref:runtime-trace-token
    relation: provisions-file-ref
  - from: credential_ref:runtime-trace-token
    to: runtime:frontend-container
    relation: mounts-read-only
  - from: credential_ref:runtime-trace-token
    to: runtime:knowledge-engine-container
    relation: mounts-read-only
  - from: credential_ref:runtime-trace-token
    to: runtime:scout-agent-container
    relation: mounts-read-only
  - from: runtime:frontend-container
    to: api:knowledge-engine-runtime-trace
    relation: authenticates-to
  - from: runtime:scout-agent-container
    to: api:knowledge-engine-runtime-trace
    relation: publishes-to
  allowed_unknowns:
  - Docker Engine availability and live browser smoke remain runtime observations, not code-delivery facts.
  - Frontend callers that do not supply a trace context still receive Scout responses without execution correlation; automatic trace creation belongs to a separate caller/session contract.
  forbidden_orphans:
  - credential_ref:runtime-trace-token
risks:
- Token value could leak through environment or logs; only file paths may be serialized, mounted, or asserted.
- Reusing approval, identity, or compatibility secrets would collapse trust boundaries; all four files must be distinct.
- Host launcher inheritance could expose the token to unrelated children; remove both aliases before selectively adding the receiver alias to Knowledge Engine and publisher alias to Frontend or Scout.
- Browser-provided trace identifiers could pollute trusted runtime evidence; only validated identifiers from an authenticated actor may be forwarded, and traceparent is not accepted until W3C-to-Omni continuity is implemented.
out_of_scope:
- Changing runtime trace APIs, database schema, pages, Host Bridge routing, System Graph Origin behavior, or login UX.
- Starting shared production containers, executing migrations, publishing externally, or deleting credentials.
rollback:
  strategy: Revert the commit to remove the new allocation aliases and Compose mounts. The unused repository-external token file may remain safely unreferenced; no deletion is required.
  data_recovery: No business data changes.
