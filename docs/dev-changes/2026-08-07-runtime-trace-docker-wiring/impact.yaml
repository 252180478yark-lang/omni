risk:
  level: R2
  reasons:
  - Changes the cross-service authentication wiring used by runtime trace readers and publishers.
  - Adds a repository-external local secret reference to RuntimeAllocation and mounts it read-only into three containers.
  external_effects: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: Runtime trace APIs and publishers already require file-backed bearer authentication, but RuntimeAllocation and both Compose entry points do not provision or mount a shared token. Real frontend execution views can therefore return unconfigured or unavailable errors while mocked tests pass.
  expected_outcome: One independent external token file is generated per repository, exposed through server and service aliases, mounted read-only into Frontend, Knowledge Engine, and Scout, and filtered from unrelated host children.
  user_visible_behavior:
  - /workspace/execution can call the configured runtime-trace BFF and Knowledge Engine path instead of failing because the service token is absent.
  - Scout can publish runtime events to the in-network Knowledge Engine using the same opaque token file.
current_chain:
  nodes:
  - page:/workspace/execution
  - bff:/api/omni/runtime-traces/*
  - api:knowledge-engine-runtime-trace
  - service:scout-runtime-trace-publisher
  - workflow:scripts/runtime_allocation.py
  - runtime:docker-compose.yml
  edges:
  - page:/workspace/execution -> bff:/api/omni/runtime-traces/*
  - bff:/api/omni/runtime-traces/* -> api:knowledge-engine-runtime-trace
  - service:scout-runtime-trace-publisher -> api:knowledge-engine-runtime-trace
  evidence:
  - Frontend and Knowledge Engine code already consume OMNI_RUNTIME_TRACE_SERVICE_TOKEN_FILE and OMNI_RUNTIME_TRACE_TOKEN_FILE.
  - Current Compose contracts mount approval, identity, and compatibility secrets but no runtime trace token.
