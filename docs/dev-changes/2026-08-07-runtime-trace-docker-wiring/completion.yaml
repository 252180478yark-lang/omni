contract_delta:
- description: Transferred cumulative-candidate ownership of scripts/runtime_allocation.py and docker-compose.yml to their later integration contracts while retaining this contract's trace-specific tests and SP1-SP4 compose ownership.
  reason: Branch CI evaluates the complete merge-base diff and correctly rejected multiple schema-v3 owners after later integration commits modified the same shared files.
  effect: The runtime-trace behavior remains present and regression-tested, but each protected shared path now has one final semantic owner in the cumulative delivery candidate.
  accepted: true
- description: Added host-mode Knowledge Engine receiver wiring and made OMNI_RUNTIME_TRACE_TOKEN_FILE the single canonical host source for every receiver/publisher mount.
  reason: Independent PRD review proved host KE was excluded and separately configurable aliases could silently point at different tokens.
  effect: Container and host publishers always authenticate with the same token as KE; mismatched service alias input is ignored and regression-tested.
  accepted: true
- description: Added CHG-005 for Frontend-to-Scout trace-context forwarding and Scout's KE startup dependency.
  reason: Scout only publishes explicit trace contexts, while the BFF previously stripped all trace headers and Compose did not order Scout after KE.
  effect: Explicit page/session trace context now reaches Scout and trace response evidence returns to callers; automatic context creation for untraced callers remains an accepted unknown.
  accepted: true
- description: Corrected the active-allocation dry-run fast path for every local secret.
  reason: Red-team review reproduced that dry-run could create a missing external token and omitted its dry_run result field.
  effect: Both fresh and active dry-runs are side-effect free and expose a consistent dry_run flag.
  accepted: true
- description: Authenticated and validated browser-supplied Omni trace context at the Scout BFF and stopped forwarding traceparent.
  reason: A public BFF forwarding arbitrary identifiers could let an unauthenticated caller cause trusted Scout service events to be appended to an existing trace; Scout does not parse W3C traceparent into Omni identity.
  effect: Existing untraced Scout calls remain compatible, while trace-linked calls require a verified user and valid bounded identifiers; unsupported W3C continuity is not claimed.
  accepted: true
