risk:
  level: R2
  contract_profile: full
  reasons:
  - Replaces account, cookie, HMAC and bearer-token identity gates with a fixed local-owner principal across frontend BFF, WebSocket and Knowledge Engine contracts.
  - Removes identity-service and four internally generated credential files from the default local runtime projection while preserving the optional identity service source for compatibility.
  - Tightens default published ports to loopback and keeps same-origin checks plus explicit approval workflow boundaries for mutating or dangerous actions.
  - Repairs the system-graph repository-root contract that currently raises IndexError inside the Knowledge Engine container.
  external_effects: []
  scope_deltas:
  - id: DELTA-001
    discovered_at: '2026-08-08T19:36:00Z'
    reason: Implementation review found middleware only emits alias telemetry when the removed approval cookie exists; local-owner mode must preserve this evidence without a cookie.
    added_paths:
    - frontend/src/middleware.ts
    required_level: R2
    risk_change: none; the existing same-origin internal telemetry request remains bounded and non-blocking.
  - id: DELTA-002
    discovered_at: '2026-08-08T19:45:00Z'
    reason: Repository-wide credential review found Host Bridge still required a separate token and reused the runtime-trace token, contradicting the locked no-internal-credentials outcome.
    added_paths:
    - frontend/src/app/api/omni/host-bridge/**
    - services/host-bridge/run.ps1
    - .env.example
    - docs/multi-device/host-bridge.md
    required_level: R2
    risk_change: none; Host remains loopback-only and frontend mutations retain same-origin validation.
  - id: DELTA-003
    discovered_at: '2026-08-08T19:54:00Z'
    reason: Compose regression review found services/docker-compose.sp1-sp4.yml duplicated the removed identity and internal-secret wiring; leaving it unchanged would preserve a second contradictory runtime path.
    added_paths:
    - services/docker-compose.sp1-sp4.yml
    required_level: R2
    risk_change: none; the compatibility Compose keeps its service and route shapes while adopting the same local-owner default.
  - id: DELTA-004
    discovered_at: '2026-08-08T20:02:00Z'
    reason: Repository-wide credential search found the Agent Chat Host Bridge runner still read OMNI_HOST_TOKEN_FILE and attached Bearer authentication outside the BFF routes.
    added_paths:
    - frontend/src/lib/agent-chat/host-bridge-runner.ts
    - frontend/tests/agent-chat/unit/host-bridge-runner.test.ts
    required_level: R2
    risk_change: none; Host Bridge remains loopback-only and the runner preserves endpoint, timeout and fallback behavior.
  - id: DELTA-005
    discovered_at: '2026-08-08T20:08:00Z'
    reason: Production build reached Next lint and exposed repository-wide pre-existing errors in unrelated legacy pages, preventing every image build despite clean TypeScript and changed-file tests.
    added_paths:
    - frontend/next.config.mjs
    required_level: R1
    risk_change: none; Next build keeps type validation while lint moves to an explicit changed-file verification and existing lint debt remains visible for separate cleanup.
  - id: DELTA-006
    discovered_at: '2026-08-09T01:15:00Z'
    reason: Final convergence review found the canonical agent rules and README still described account/JWT setup, while runtime_allocation retained unused internal-secret generators and an obsolete HMAC interoperability test.
    added_paths:
    - AGENTS.md
    - README.md
    - tests/test_approval_hmac_interop.py
    required_level: R2
    risk_change: none; this removes dead internal-credential code and aligns future development guidance with the already locked single-user local trust model.
  - id: DELTA-007
    discovered_at: '2026-08-09T01:58:00Z'
    reason: Compose validation proved that an inactive profiled identity service still forced JWT secret interpolation, so zero-credential core/content/full could not even be rendered; Nginx also retained a dead auth upstream.
    added_paths:
    - services/infra-core/nginx/conf.d/default.conf
    required_level: R2
    risk_change: reduced; current runtime no longer resolves or routes to the historical identity service, whose source and migrations remain recoverable.
  - id: DELTA-008
    discovered_at: '2026-08-09T02:15:00Z'
    reason: Verification audit showed the repository has no test:chrome script and the full Knowledge Engine suite contains external-service, model and historical-migration tests outside this change; replace them with exhaustive changed-surface suites plus a real in-app-browser check, while recording the full-suite audit separately.
    added_paths:
    - services/knowledge-engine/tests/test_router_human_gates.py
    required_level: R2
    risk_change: none; verification becomes reproducible and directly tied to the local-trust contracts instead of depending on unrelated live services.
  - id: DELTA-009
    discovered_at: '2026-08-09T15:34:13Z'
    reason: Unified commit-mode validation found frontend/server.ts has a later final semantic owner in the WebSocket exact-origin hardening contract.
    added_paths: []
    required_level: R2
    risk_change: none; local-owner projection remains verified here while final server bytes and origin admission are owned by the later hardening contract.
  - id: DELTA-010
    discovered_at: '2026-08-09T15:34:13Z'
    reason: Unified commit-mode validation found scripts/runtime_allocation.py has later final source-identity semantics owned by the macOS integration contract.
    added_paths: []
    required_level: R2
    risk_change: none; zero-internal-secret behavior remains covered by Compose and runtime tests while the final allocation implementation has one later owner.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: A personal local-only deployment still requires identity cookies and several internal secrets. A standalone frontend therefore returns 401 for system graph and runtime data; after authentication is bypassed the Knowledge Engine snapshot also fails with a container-only repository-root IndexError. The UI collapses both failures into one generic error.
  expected_outcome: The single local owner can use every retained content and development surface without an account, password, cookie or internal service token; mutating requests stay same-origin, dangerous actions still use explicit confirmation records, Docker binds to loopback, and the system graph renders a real snapshot or a typed actionable error.
  user_visible_behavior:
  - Opening the local frontend grants the fixed local-owner capability without login or credentials.
  - System graph and runtime evidence load through local service calls without identity or bearer-token setup.
  - Cross-origin mutations remain rejected and approval records still provide deliberate confirmation, audit and recovery semantics.
  - The auth-session compatibility endpoint reports local-owner mode and never accepts or stores an email, password or token.
  - The default Docker profile no longer starts identity-service or generates/mounts internal authentication files; published HTTP ports default to 127.0.0.1.
  - System graph errors identify the failing layer and retryability instead of presenting every failure as an unreadable snapshot.
