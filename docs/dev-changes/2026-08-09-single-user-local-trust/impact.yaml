risks:
- id: RISK-001
  description: Removing login would expose owner capabilities if a published port binds beyond the local machine.
  mitigation: Bind published HTTP ports to 127.0.0.1 by default, retain same-origin mutation checks, and document that remote exposure requires a separate reverse-proxy security boundary.
- id: RISK-002
  description: Treating approvals as identity could accidentally remove deliberate confirmation for destructive or external actions.
  mitigation: Preserve the approval-operation state machine, idempotency, audit and reconciliation; only remove credential verification.
- id: RISK-003
  description: Broad removal of bearer headers could hide an unintended non-local consumer.
  mitigation: Preserve endpoint schemas, run repository-wide reference searches and contract tests, and retain optional legacy identity service source outside default profiles.
- id: RISK-004
  description: Repository-root discovery could escape to an unrelated ancestor or fail in a container image.
  mitigation: Prefer explicit OMNI_REPO_ROOT=/workspace in Compose and use bounded ancestor discovery requiring AGENTS.md.
out_of_scope:
- External provider credentials required by third-party APIs; these remain local secret references and are never rendered in UI or logs.
- PostgreSQL, Redis or infrastructure datastore password removal; no database authentication contract is changed in this slice.
- Physical deletion of identity-service source, database schema or historical migrations; the service becomes optional/legacy and can be retired under a separate evidence-backed R3 change.
- Remote publication, push, deployment, shared-runtime migration, paid action or external platform write.
- Relaxing explicit confirmation for destructive, costly, publishing or external-write actions.
rollback:
  strategy: Revert the candidate commit to restore identity, HMAC and bearer-token wiring. The optional identity service source and all data schemas remain intact, so rollback requires no data operation.
  data_recovery: No business data is removed or migrated. Approval records, graph snapshots and runtime traces remain compatible.
