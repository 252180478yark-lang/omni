compatibility:
  api:
    status: compatible
    strategy: Existing routes and payload shapes remain. Identity failures disappear in local mode; the auth-session route remains as a compatibility projection that returns the fixed local owner. Mutation endpoints retain same-origin validation and typed upstream errors.
  database:
    status: not_applicable
    strategy: No migration, table, column, persistent business-data write or database authentication change is included.
  workflow:
    status: compatible
    strategy: Account authentication and internal service credentials are removed from the local path. Explicit approval-operation records, idempotency, audit, revocation, recovery and reconciliation remain; they become intent confirmation rather than identity proof.
  data_source:
    status: compatible
    strategy: No external provider credential is changed. Static system-graph collection resolves an explicit OMNI_REPO_ROOT or discovers an AGENTS.md-bounded ancestor; unavailable sources remain typed errors/unknown rather than empty data.
