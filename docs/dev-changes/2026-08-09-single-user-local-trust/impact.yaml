  - Docker Knowledge Engine logs show services/knowledge-engine/app/routers/system_graph.py repository_root indexing parents[4] and raising IndexError under /app/app/routers.
  - frontend/src/app/api/omni/_shared.ts verifies every actor against identity-service and signs approval proxy requests with OMNI_APPROVAL_SERVICE_SECRET_FILE.
  - frontend/src/app/api/omni/runtime-traces/_runtime-auth.ts and services/knowledge-engine/app/routers/runtime_traces.py require a runtime-trace bearer token.
  - scripts/runtime_allocation.py generates approval HMAC, identity JWT, compatibility and runtime-trace credential files for every allocation.
  - docker-compose.yml includes identity-service in the default dependency graph and publishes nginx ports without an explicit loopback host.
