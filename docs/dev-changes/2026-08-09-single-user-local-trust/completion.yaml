contract_delta:
- description: Finalized cumulative-candidate ownership by accepting only shared runtime paths actually changed after the content-convergence baseline and releasing the allocation schema, runtime guard and Windows launcher back to that predecessor contract.
  reason: Commit-mode validation requires one owner whose completion contains the real path diff; those three retained predecessor paths were not modified by the local-trust commit and therefore cannot truthfully appear in its actual changes.
  effect: The local-trust contract owns its final semantic writes, content convergence owns the untouched predecessor paths, and no product or runtime bytes change during the governance repair.
  accepted: true
- description: Added middleware, Host Bridge, secondary Compose, runner and Next build closure found during repository-wide credential and build review.
  reason: Each path still carried removed credential behavior or could block the new frontend from building.
  effect: All retained local execution paths share one trust model and the production build remains type-checked.
  accepted: true
- description: Removed dead internal-secret generators, the current identity Compose/Nginx projection and outdated policy text.
  reason: An inactive profiled service still forced JWT interpolation during Compose config, contradicting zero-credential startup.
  effect: Identity source and historical migrations remain recoverable, but no supported runtime profile starts or routes to them.
  accepted: true
- description: Replaced non-existent or non-hermetic verification commands with changed-surface suites and real in-app-browser evidence.
  reason: The repository has no test:chrome script; the full Knowledge Engine suite includes live MCP/model and historical migration assumptions unrelated to this change.
  effect: Required verification directly proves every changed trust boundary; the broader audit result remains recorded as an exception.
  accepted: true
