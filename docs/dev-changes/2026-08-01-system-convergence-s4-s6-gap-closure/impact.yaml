risks:
- id: RSK-001
  description: Cross-process updates could acknowledge two conflicting revisions.
  mitigation: Persist immutable revision files with exclusive creation and fail the loser with a deterministic CAS conflict.
- id: RSK-002
  description: A collector failure could be misreported as a missing edge and promoted to a block.
  mitigation: Evaluate source-specific success and permit blocking only for observed deterministic facts selected by a versioned policy.
- id: RSK-003
  description: A pilot could fabricate delivery or execute an R3 side effect.
  mitigation: Local evidence stays external_ci_pending; only CI emits attestation, and the R3 fixture uses the real approval state machine without a worker/effect handler.
out_of_scope:
- No shared database migration, business data write, external publication, paid action, secret rotation, or runtime container mutation.
- S7-S14 graph visualization, runtime animation, frontend convergence, and legacy retirement remain separate slices.
rollback:
  strategy: Revert this gap-closure commit; local plan/issue/pilot artifacts are additive and may be ignored or moved aside without touching business data.
  data_recovery: No business data is changed. Preserve immutable JSON revisions for audit; restore a prior artifact directory snapshot if local planning history must be recovered.
