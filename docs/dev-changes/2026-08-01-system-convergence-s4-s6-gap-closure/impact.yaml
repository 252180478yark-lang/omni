intent:
  problem: The existing S4-S6 candidate proves a narrow fixture skeleton but lacks durable issues, real CI warning artifacts, cross-process CAS, evidence/state guards, an owner UI, and repository-backed pilot evidence.
  expected_outcome: S4-S6 meet PRD v1.2 acceptance locally at GRAPH_DIFF_READY, with external CI attestation remaining the only delivery authority.
  user_visible_behavior:
  - Owners can create, review, rebase, archive, and explicitly freeze candidate integration plans from /system-graph.
  - Planned/fact gaps produce durable searchable repair cards and CI warning artifacts without converting unknown evidence into missing facts.
  - R1/R2 repository pilots and an inert R3 approval fixture emit a transcript and calibrated block-policy evidence.
