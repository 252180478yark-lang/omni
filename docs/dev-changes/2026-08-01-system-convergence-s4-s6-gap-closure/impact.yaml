  api:
    status: compatible
    strategy: Existing create/get/patch/confirm responses remain valid; list, review, rebase, archive, summaries, and durable impact artifact fields are additive.
  database:
    status: not_applicable
    strategy: Issue, plan, and pilot evidence are local JSON artifacts; no database schema or shared runtime DDL changes.
  workflow:
    status: compatible
    strategy: Existing draft/frozen values remain valid while reviewing/stale/archived and issue/pilot states are added with forward-only revisions.
  data_source:
    status: compatible
    strategy: Immutable snapshots and CI attestation remain read-only sources; failed collectors remain unknown and no secret-bearing evidence is persisted.
