contract_delta:
- description: Use the repository's Vitest script for the S5 owner page verification.
  reason: Frontend package.json exposes test:unit rather than an npm test script, and Vitest does not accept Jest runInBand.
  effect: VER-003 now runs the exact supported frontend unit-test entrypoint without changing product scope.
  accepted: true
- description: Extend the existing frontend graph collector for literal callers of a catch-all BFF route.
  reason: The real S5 page calls /api/omni/system-graph/integration-plans while Next.js implements that boundary with [[...path]]; exact-only route matching would leave the required page-to-BFF edge unobservable.
  effect: CHG-005 now owns the compatible collector and regression-test change; no runtime or API behavior changes.
  accepted: true
- description: Persist the deterministic after-scan beside the v3 completion contract.
  reason: GRAPH_DIFF_READY needs a content-addressed, reviewable graph artifact rather than an ignored local output path.
  effect: CHG-005 owns one generated graph-snapshot JSON file under this contract directory; it contains repository evidence only and no runtime secret.
  accepted: true
- description: Run VER-006 as the immediate post-transition self-check instead of a transition prerequisite.
  reason: The index gate strictly requires the staged v3 contract to already be GRAPH_DIFF_READY, so making that same command a prerequisite to the state transition is circular.
  effect: VER-006 is optional only for the atomic transition, then is executed, recorded and rerun against the final staged index; CHG-005 remains covered by required VER-005.
  accepted: true
