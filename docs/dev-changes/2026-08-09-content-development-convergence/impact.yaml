risks:
- id: RSK-001
  description: Hiding a feature from navigation could be mistaken for deleting its route or backend consumer.
  mitigation: Preserve all FeatureDefinition IDs, owned surfaces, aliases, pages and services; assert the 45-page inventory and direct-route resolution in contract tests.
- id: RSK-002
  description: Optional Compose profiles could make a required core dependency unavailable or accidentally change persistent resources.
  mitigation: Keep identity, hub and knowledge engine in core; assert exact service sets and unchanged named volumes/ports, and provide full-profile rollback without down -v.
- id: RSK-003
  description: A visual rewrite could hide unknown or unavailable state behind a cleaner presentation.
  mitigation: Retain semantic state badges, four-state command-center renderers, keyboard navigation, reduced motion and fail-closed health observations.
- id: RSK-004
  description: The branch is based on two local receipt-recovery commits that are not yet externally delivered.
  mitigation: Record the exact base commit, keep this work in an independent clean worktree, and require a fresh CI attestation for this change after receipt-recovery integration or retargeting.
- id: RSK-005
  description: A structurally smaller Compose graph could be declared healthy while its custom Next server is absent, loopback-only, or its selected profile is not the one allocated and verified.
  mitigation: Copy the custom server closure into the runner image, bind it inside the container, carry runtime_profile through allocation/environment/preflight/verify, assert unexpected profile services, and require a real image build plus host/container HTTP smoke.
out_of_scope:
- No physical deletion of frontend pages, BFF routes, services, Compose files, Dockerfiles, images, build cache, databases, named volumes or source directories.
- No process merger, endpoint rename, authentication or secret change, external publication, remote push, migration execution, scheduler enablement or external platform write.
- No edits to the dirty macOS recovery worktree, its Dockerfiles, server files, launch scripts or untracked recovery contract.
- No retirement claim for the legacy shell, old /exec/ compatibility adapters or hidden features until telemetry, consumer and recovery gates are separately satisfied; this slice only moves the four known frontend consumers to canonical operation IDs.
rollback:
  strategy: Revert this candidate as one immutable change to restore the prior IA, renderers, BFF consumers and runtime projection. NEXT_PUBLIC_OMNI_UNIFIED_SHELL only restores the legacy shell chrome and is not represented as a complete product rollback. Use docker compose --profile full up -d under a valid full RuntimeAllocation to restore the full service projection.
  data_recovery: No data transformation occurs. Existing database and named volumes are preserved, and rollback must never use down -v or a prune command.
