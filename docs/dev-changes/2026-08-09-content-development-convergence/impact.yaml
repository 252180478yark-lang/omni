compatibility:
  api:
    status: compatible
    strategy: Existing page URLs, BFF/REST/MCP routes, operation IDs and direct links remain unchanged; root becomes a reversible server redirect to the already canonical workspace.
  database:
    status: not_applicable
    strategy: No table, view, field, migration, database name, named volume or persistent data is changed.
  workflow:
    status: compatible
    strategy: Existing feature IDs and physical pages remain available. FeatureDefinition changes only primary navigation visibility and group projection; legacy group identifiers remain accepted during rolling telemetry compatibility, while complete rollback is by immutable candidate revert rather than a shell-only flag.
  data_source:
    status: compatible
    strategy: FeatureDefinition and runtime manifest remain the existing versioned sources. Generated registries are regenerated from YAML and optional runtime services retain their current endpoints.
