risk:
  level: R2
  contract_profile: full
  reasons:
  - The change modifies the registry-driven frontend IA, shared shell and three page renderers across frontend and FeatureDefinition contracts.
  - Docker profile membership and runtime required-service semantics change the default runtime projection while retaining every service, volume, port and API.
  external_effects: []
  scope_deltas:
  - added_paths:
    - frontend/src/app/api/omni/workbench/navigation-events/route.ts
    - frontend/tests/workbench-navigation-events.test.ts
    - frontend/tests/system-health-overview.test.ts
    reason: Typecheck exposed the existing navigation-event BFF allowlist and retired-homepage rendering tests as direct consumers of the changed IA and root renderer contracts; they must move atomically with those sources.
    required_level: R2
  - added_paths:
    - frontend/Dockerfile
    - frontend/server.ts
    - frontend/playwright.config.ts
    - config/schemas/runtime-allocation.schema.json
    - scripts/runtime_allocation.py
    - scripts/runtime_guard.py
    - dev-start.ps1
    - tests/test_runtime_allocation.py
    - tests/test_runtime_guard.py
    - tests/test_dev_runtime_environment.py
    - README.md
    - docs/multi-device/setup.md
    - frontend/src/app/api/omni/asset-lineage/route.ts
    - frontend/src/app/api/omni/asset-metrics/route.ts
    - frontend/src/app/api/omni/assets/route.ts
    - frontend/src/app/api/omni/mcp-exec/reverse-storyboard/route.ts
    - frontend/tests/canonical-tool-execution-bffs.test.ts
    - frontend/src/lib/workbench-ia-compat.ts
    - frontend/src/middleware.ts
    - frontend/src/app/workspace/development/page.tsx
    - frontend/tests/workbench-middleware.test.ts
    - frontend/tests/workbench-route-inventory.test.ts
    - services/knowledge-engine/app/mcp/tools/pipeline.py
    - services/knowledge-engine/app/mcp/doctor.py
    - services/knowledge-engine/tests/test_tool_execution.py
    reason: Independent pre-delivery review proved that the slim runtime would otherwise ship an unreachable frontend image, a profile-unaware allocation/guard contract, stale canonical startup guidance, four remaining BFF consumers of the already delivered canonical operation executor, a root-route registry mismatch, and no rolling bridge for old IA telemetry. These blockers were discovered before staging or delivery and are now locked before their product edits.
    required_level: R2
  - added_paths:
    - services/knowledge-engine/app/runtime_preflight.py
    - services/knowledge-engine/tests/test_runtime_preflight.py
    reason: Runtime-profile implementation review proved that the one-shot guard could validate the allocation record while the actual Knowledge Engine startup preflight remained unaware of the caller-selected profile. The application preflight and its focused tests are locked before editing so Compose environment, allocation evidence and application startup fail closed on the same profile identity.
    required_level: R2
  - added_paths:
    - frontend/.dockerignore
    reason: The first real frontend image build transferred a 1.14 GB context because local node_modules, .next and test evidence were not excluded. The Docker context boundary is locked before adding a non-runtime ignore file, then the same image build will be repeated to prove the reduced context still contains the custom server closure.
    required_level: R1
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The delivered unified shell still exposes ten navigation groups and twenty-four visible features, duplicates the home, workspace, system graph and execution surfaces, uses a dense violet marketing presentation, and forces optional content-analysis services into the default Docker runtime.
  expected_outcome: Omni presents one calm two-mode web workbench with only content-production and development surfaces in six source-driven groups, one shared system command center, and a canonical Compose runtime that starts a six-service core by default while preserving content and full profiles as reversible projections.
  user_visible_behavior:
  - The normal web entry redirects to one workspace, whose Content mode offers production, analysis and library destinations derived from FeatureDefinition.
  - Development mode uses the same shell and workspace to expose agent tools, quality gates and one shared system command center with system-graph and runtime views.
  - Legacy and non-core features remain directly addressable but disappear from primary navigation; no page, API, service, database object or data volume is deleted.
  - The default Compose projection starts core services only; content and full profiles restore optional analysis, review, news and gateway services without renaming endpoints or volumes.
