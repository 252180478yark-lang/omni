contract_delta:
- description: Updated the S6 isolated-pilot fixture to the required runtime-profile manifest contract after CI reached the full convergence Gate.
  reason: Runtime allocation now intentionally fails closed when runtime_profiles is absent, while the old minimal fixture still represented the pre-profile manifest shape.
  effect: The disposable R1/R2 pilot continues to prove allocation, receipt, transcript and release behavior under the current core/content/full profile contract; production runtime logic is unchanged.
  accepted: true
- description: Transferred cumulative-candidate ownership of AppShell, the root Compose file and the runtime manifest to the later unified-workbench integration contract while retaining content convergence ownership of runtime allocation and all remaining shell/profile paths.
  reason: Feature-branch CI evaluates the full merge-base diff; the later Workbench v1.3 commit is the final semantic writer for those three protected shared files and duplicate v3 ownership is forbidden.
  effect: The content/development convergence behavior stays in the candidate, while the integrated delivery graph has one owner per protected path and no implementation bytes are changed by the transfer.
  accepted: true
- description: Added direct IA consumers, compatibility middleware, route inventory and system-health tests to the implementation boundary.
  reason: TypeScript and focused regressions proved these existing consumers embed the changed group allowlist, alias ownership or retired root-renderer contract and therefore must move atomically with the FeatureDefinition sources.
  effect: Old v1 clients remain accepted by an immutable adapter, v2 clients use six groups, root is a one-hop alias, and every physical page still resolves with one owner.
  accepted: true
- description: Split production compilation proof from inherited repository-wide lint debt.
  reason: The standard Next build compiled and type-checked the candidate before failing on legacy lint findings in unchanged pages; every changed TypeScript/TSX file passes zero-warning scoped ESLint.
  effect: VER-003 uses Next's supported --no-lint build to prove compilation, type checking and 47-page generation; the unchanged debt is not mislabeled as a regression.
  accepted: true
- description: Expanded the locked scope after independent delivery review to include the frontend runner closure, runtime allocation/guard/startup truth, canonical BFF consumers and rolling IA compatibility.
  reason: The first slice could have shipped a loopback-only/closure-incomplete container, profile-unaware startup, four stale execution consumers, root ownership drift and rejected v1 telemetry.
  effect: All discovered blockers were locked before their files were edited; no database, endpoint, page, service, port or named volume was removed.
  accepted: true
- description: Synchronized route-selected mode once per committed URL and raised three low-contrast shell labels.
  reason: Real Chrome reproduced a race that reverted a user switch before router.push committed, then axe identified three sub-AA labels on the neutral sidebar/status background.
  effect: Exclusive-route switches preserve the requested mode through navigation, and the final desktop/mobile axe selection has zero violations.
  accepted: true
- description: Added runtime_profile to the actual Knowledge Engine startup identity and made it required in RuntimeAllocation schema and Compose environment.
  reason: Guard preflight alone could verify the allocation record while the application process remained unaware of the caller-selected profile.
  effect: Missing, legacy or mismatched profile evidence now fails before database, scheduler or filesystem side effects; existing legacy allocations must be released and reacquired.
  accepted: true
- description: Added a frontend Docker context boundary after the first real image build transferred 1.14 GB.
  reason: Local node_modules, .next and Playwright evidence were being sent even though the multi-stage Dockerfile rebuilds dependencies and output internally.
  effect: The repeated build transferred only the changed source context, still generated all 47 pages, and the resulting runner answered HTTP 200 both inside the container and through its published host port.
  accepted: true
- description: Closed two final-audit fail-open paths in runtime verification.
  reason: A mismatched allocation profile constructed an invalid Issue instead of a structured error, while four content/full services had no manifest/Compose readiness probe and could be reported ready from running state alone.
  effect: Profile mismatch now returns a severity=error issue, every core/content/full long-lived service has a checked health contract, and container-only services use Docker health instead of an invalid host-loopback fallback.
  accepted: true
