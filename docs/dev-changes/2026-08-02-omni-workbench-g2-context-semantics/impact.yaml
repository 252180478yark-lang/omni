compatibility:
  api:
    status: compatible
    strategy: No wire field, enum, required key, route, request, or response changes. Descriptions clarify the existing context_snapshot_id fields only.
  database:
    status: compatible
    strategy: Migration 104 and every database object, trigger, column, constraint, index, and COMMENT remain byte-identical. The existing agent-session value is interpreted as the accepted security anchor; the existing runtime-execution value remains the immutable per-operation target. Host current-head state is not added to the database in this delta.
  workflow:
    status: compatible
    strategy: A session's provider-acceptance anchor never moves. W5 may later implement one Host-owned current-head CAS that requires the expected snapshot and revision, advances only to a canonical next revision, and freezes that selected head into each new runtime execution. Existing operations never inherit a later head.
  data_source:
    status: not_applicable
    strategy: No external source, credential, collector, or runtime database is accessed.
