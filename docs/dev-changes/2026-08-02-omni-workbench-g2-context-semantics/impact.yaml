intent:
  problem: G1 uses context_snapshot_id for both the accepted agent-session anchor and the per-operation target, while FrontendAgentBinding also carries a current context head. The wire fields are structurally compatible, but their ownership and mutation semantics are not explicit enough to implement AC-FR007-04 without either mutating the accepted session anchor or losing the frozen target of an already-running operation.
  expected_outcome: 'Freeze one contract-only three-layer interpretation: mcp.agent_session_contracts.context_snapshot_id is the immutable provider-acceptance and security anchor; FrontendAgentBinding.context_snapshot_id plus context_revision projects the Host-owned current head and advances only through a single-writer compare-and-swap; mcp.runtime_executions.context_snapshot_id plus RunOperationProjection.context_snapshot_id and nullable context_revision expose the complete target pair selected when an operation starts. The operation pair is iff: legacy projections require both values explicit null, while new W5 operations require both a non-null snapshot and positive revision.'
  user_visible_behavior:
  - This integration delta changes no page, endpoint, database row, or runtime behavior; it adds only the nullable legacy-safe context_revision key to RunOperationProjection.
  - W5 can preserve the same logical session while the Host advances its current context head, without retargeting an older running or approval-waiting operation.
  - Consumers can distinguish the accepted session security anchor, the current Host head, and an operation's frozen target from authoritative descriptions and tests.
  - After a frontend or Host restart, an old operation projection carries its own complete frozen snapshot/revision pair instead of borrowing the current session revision; partial pairs are rejected.
