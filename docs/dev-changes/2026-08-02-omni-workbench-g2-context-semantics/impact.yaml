  - migrations/104_workbench_context_and_agent_binding.sql:294-366 independently rejects retargeting a non-null runtime execution context; its column comment at lines 422-423 already calls that value the frozen execution context.
  - config/schemas/workbench-foundation.v1.schema.json defines FrontendAgentBinding.context_snapshot_id plus context_revision and separately defines RunOperationProjection.context_snapshot_id, but neither property currently states ownership or compare-and-swap semantics.
  - services/knowledge-engine/app/schemas/workbench_foundation.py and frontend/src/lib/workbench/contracts.ts mirror those fields without semantic descriptions.
  - docs/dev-changes/2026-08-02-omni-unified-ai-workbench-g1-foundation/consumer-matrix.yaml:10-17 gives immutable snapshot and rebind rules, while lines 50-69 freeze the shared authority paths and require W5 to consume rather than create a parallel writer.
  - docs/dev-changes/2026-08-02-omni-unified-ai-workbench-w0/parallel-development-order.md:103-110 requires G2 to update the shared contract and consumer matrix serially before downstream lane fixes.
  - services/knowledge-engine/app/services/agent_contracts.py explicitly projects only the ten legacy session columns and does not adopt or mutate any G1 context field.
  - WorkspaceLease lease-59e502ddeeff450e8da90e6f5580d83d grants one R2 writer for the seven exact contract paths and does not overlap the active W5 leases.
