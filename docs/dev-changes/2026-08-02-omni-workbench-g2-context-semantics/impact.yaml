risks:
- id: G2-RISK-001
  description: A later W5 implementation could mutate the accepted agent-session context to model a page switch, weakening the security anchor and conflicting with migration 104.
  mitigation: Freeze the session field as provider-acceptance/security anchor in every authority description and assert migration 104 remains byte-identical.
- id: G2-RISK-002
  description: A later operation could read the mutable Host head during resume and silently retarget an already-running or approval-waiting operation.
  mitigation: Define runtime_executions.context_snapshot_id and RunOperationProjection.context_snapshot_id as the immutable operation target selected at start, with contract tests in both languages.
- id: G2-RISK-003
  description: A frontend or secondary service could become another current-head writer.
  mitigation: Define FrontendAgentBinding as a projection of the Host-owned head and require expected snapshot plus expected revision compare-and-swap through the single Host writer.
- id: G2-RISK-004
  description: Restart recovery could combine an old operation's frozen snapshot with the session's newer current revision when the public operation projection omits context_revision.
  mitigation: 'Enforce the required nullable context_revision as an iff pair with context_snapshot_id in JSON Schema, Pydantic, TypeScript, and contract tests: legacy values are both null; new W5 values are both non-null with a positive revision.'
out_of_scope:
- Editing, replacing, appending to, or executing migrations/104_workbench_context_and_agent_binding.sql or any other migration.
- Changing a database COMMENT through an additive migration; the existing metadata is sufficient once the authority matrix disambiguates the three layers.
- Implementing Host CAS, Knowledge Engine routes, Agent Chat behavior, runtime writes, or W5 tests; those remain in the isolated W5 lane.
- Mutating mcp.agent_session_contracts.context_snapshot_id, relaxing its trigger, or creating a second session/context history table.
- Touching the W5 worktree, Shell/sidebar/Feature Registry files, Desktop, shared runtime resources, or the canonical dirty worktree.
- Remote push, pull request, merge, default-branch delivery attestation, or shared database adoption.
rollback:
  strategy: Revert the isolated G2 follow-up commit before integration, or revert both G2 commits to return to the G1 authority. The added key is nullable for legacy normalization, and migration 104, runtime code, and persistent data remain unchanged, so rollback requires no data operation.
  data_recovery: Not applicable; this delta does not connect to or write any database or external system.
