compatibility:
  api:
    status: compatible
    strategy: RunOperationProjection adds one required wire key, context_revision, whose value is integer >= 1 or null. Boundary adapters must emit explicit null for legacy operations; every new W5 operation emits its persisted positive revision. No enum, route, request, or other response field changes.
  database:
    status: compatible
    strategy: Migration 104 and every database object, trigger, column, constraint, index, and COMMENT remain byte-identical. The existing agent-session value is interpreted as the accepted security anchor; the existing runtime-execution value remains the immutable per-operation target. Host current-head state is not added to the database in this delta.
  workflow:
    status: compatible
    strategy: A session's provider-acceptance anchor never moves. The Host-owned current-head CAS freezes both snapshot and revision into each new W5 HostRun; RunOperationProjection exposes both values on restart. Existing legacy operations normalize a missing revision to explicit null and never inherit a later head.
  data_source:
    status: not_applicable
    strategy: No external source, credential, collector, or runtime database is accessed.
