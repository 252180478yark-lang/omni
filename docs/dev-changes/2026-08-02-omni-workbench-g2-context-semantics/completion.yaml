contract_delta:
- description: Sequenced the Git-derived index and strict final checks after transition to GRAPH_DIFF_READY while retaining both as mandatory local commit actions.
  reason: Index mode and strict final validation intentionally require GRAPH_DIFF_READY, while a required result would have to exist before the state transition and create a circular Gate.
  effect: G2-VERIFY-008 and G2-VERIFY-009 are schema-optional like the delivered G1 precedent, but this branch is not committed until both exact commands pass and are recorded.
  accepted: true
- description: Added RunOperationProjection.context_revision to the existing six-path authority and test scope after the first local G2 commit.
  reason: Follow-up audit of the isolated W5 HostRun proved it durably freezes context_snapshot_id plus context_revision, while the public operation projection could not recover that complete pair after restart.
  effect: JSON, Python, and TypeScript add a required nullable revision key; legacy projections emit null, new W5 projections must emit a positive persisted revision, and no database or migration path changes.
  accepted: true
