  - id: W1-DELTA-004
    discovered_at: '2026-08-02T10:25:30Z'
    reason: Registry correction made /system-graph the canonical renderer for the existing System Graph capability and exposed that FrontendCollector scans canonical routes and aliases but not the new owned_surfaces contract.
