intent:
  problem: The web application exposes 45 page routes through a long legacy sidebar, has no unified work/development information architecture, and carries aliases that overlap real renderers without a production resolver or auditable compatibility behavior.
  expected_outcome: Deliver one reversible web Shell driven only by the generated Feature Registry, with exactly five work groups and five development groups, deterministic route ownership, honest context/provider/status slots, compatibility routing and telemetry, and no deletion or duplication of existing capabilities.
  user_visible_behavior:
  - Users can switch between Work and Development modes without remounting page content or losing the current context, operation, or Agent session slots.
  - Work mode exposes exactly Today, Products, Operations, Content, and Knowledge; Development mode exposes exactly Agents, Skills & Tools, Workflows, Prompt & Eval, and Runs & System.
  - The existing SKU pipeline is presented as SKU 圈包链路 while retaining the boundary SKU -> selling-point matrix -> audience matching -> audience-pack SOP -> audience_pack_id.
  - Shell badges report actual known values and otherwise show neutral unknown or unavailable states; W1 does not claim a real resolved provider or context binding.
  - Registered legacy aliases redirect once to a canonical renderer while preserving query parameters and emitting best-effort compatibility telemetry; unregistered HTML and App Router navigations render one shared-Shell compatibility page and record an authenticated gap when available.
  - Building and redeploying with NEXT_PUBLIC_OMNI_UNIFIED_SHELL=0 restores the legacy shell and navigation without deleting pages or data.
