  - id: W1-DELTA-002
    discovered_at: '2026-08-02T10:11:42Z'
    reason: Integration review found that the registered Prompt & Eval landing renders a blank surface when the existing nodes response is empty, violating AC-FR011-01 and the W1 no-fake-data boundary.
