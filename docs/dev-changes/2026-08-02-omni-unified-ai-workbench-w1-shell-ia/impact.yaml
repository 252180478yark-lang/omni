  - Desktop cross-surface parity remains a W6 acceptance responsibility; W1 verifies the web Shell and router only.
  - Historical Path-B documents proposed /ad-review -> /marketing/review, but main has no /marketing/review renderer; W1 only recovers that advertised bookmark back to the real /ad-review canonical and does not claim to implement the historical forward migration direction.
  - The current identity service has no feature-level entitlement contract; W1 honors the existing registry visibility boundary and does not weaken API or R0-R3 enforcement, but it does not invent client-side ACLs from development ownership metadata.
