compatibility:
  api:
    status: compatible
    strategy: Add one same-origin telemetry BFF with typed unavailable responses, and tighten the existing Models, Knowledge Eval/rebuild, and Prompt node/rule BFFs with the current admin identity plus the adapter's explicit owner compatibility role, same-origin mutation checks, and signed service calls; never expose service tokens or configuration details to the browser.
  database:
    status: not_applicable
    strategy: W1 does not change database schema, migrations, or persisted business data.
  workflow:
    status: compatible
    strategy: Preserve all existing feature_id values and renderers; the generated registry adds IA, deterministic order, owned surfaces, migration phase, and flag metadata. Real aliases are exact, direct-to-canonical, single-hop redirects and cannot overlap owned surfaces.
  data_source:
    status: compatible
    strategy: Continue generating byte-identical backend and frontend registries from the same YAML source; Shell health uses the existing overview response and reports unknown or unavailable when evidence is absent.
