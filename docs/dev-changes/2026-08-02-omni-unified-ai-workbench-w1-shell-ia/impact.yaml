  - id: W1-DELTA-011
    discovered_at: '2026-08-02T12:05:00Z'
    reason: Final independent accessibility review found that the Prompt detail drawer lacked modal-dialog naming, Escape/focus return and focus containment, while dynamic Models and Knowledge outcomes were visually rendered without explicit live-region semantics.
    added_paths:
