  contract_profile: full
  reasons:
  - W1 changes the shared FeatureDefinition schema and its generated backend/frontend registry projections.
  - W1 changes top-level navigation, browser routing, compatibility redirects, and best-effort navigation telemetry.
  - W1 adds persistent browser preference state and a rollback flag while preserving every existing renderer and feature_id.
  - The slice is reversible, does not change database schema or adopt shared runtime resources, tightens developer BFF access with the current admin role plus an explicitly supported owner compatibility role, and gives the new evidence-only telemetry BFF a separate ordinary-authenticated identity boundary.
