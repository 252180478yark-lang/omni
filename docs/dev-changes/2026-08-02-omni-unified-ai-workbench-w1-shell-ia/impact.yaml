  - id: W1-DELTA-007
    discovered_at: '2026-08-02T10:59:44Z'
    reason: Final PRD review found that /qa is not an advertising-review alias, the existing Knowledge Eval page had no explicit no-evaluation-set empty state, the Models and evaluation mutation BFFs lacked the privileged approval-actor gate, and /workspace still exposed a second business/development/execution mode selector inside the new two-mode Shell.
