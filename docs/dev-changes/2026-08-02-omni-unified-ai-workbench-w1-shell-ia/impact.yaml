risks:
- id: W1-RISK-001
  description: A compatibility alias that overlaps a real Next page could silently swallow the renderer or form a redirect cycle.
  mitigation: Partition all 45 pages exactly once, prohibit alias/owned overlap, require aliases to target a canonical directly, use exact matching only, prove /qa and the historically advertised but never page-backed /marketing/review bookmark redirect with query preservation, and prove /ad-review/flywheel remains an independently reachable owned renderer.
- id: W1-RISK-002
  description: A hard-coded menu or landing table could become a second IA source and drift from FeatureDefinition.
  mitigation: Generate primary_order and contextual order from the registry, validate uniqueness per mode/group, derive each landing from the minimum order, and keep sidebar presentation data limited to icons and descriptions.
- id: W1-RISK-003
  description: Shell status badges could imply that context/provider/runtime contracts are already implemented.
  mitigation: Freeze continuity slots but default to neutral unknown or unavailable, populate only observed overview health, and leave W3-W5 service contracts out of scope.
- id: W1-RISK-004
  description: The new top bar and sidebar can clip full-height chat/playground pages or regress keyboard and contrast behavior.
  mitigation: Cover responsive viewport behavior, visible focus, reduced motion, semantic status text, axe checks, and screenshot review in self-hosted Playwright.
- id: W1-RISK-005
  description: Browser storage or telemetry failure could break navigation.
  mitigation: Keep mode state in memory with an aria-live degradation notice, make telemetry best-effort, and provide a single environment flag that restores the legacy shell.
out_of_scope:
- Real WorkbenchContextSnapshot persistence, provider resolution, fallback, Codex/Host execution, or Agent session backend binding; these belong to W5.
- AI Blueprint, real run center data, operation lifecycle controls, approval inbox behavior, artifact drawer behavior, and shared runtime adoption; these belong to later slices.
- Desktop navigation changes or Desktop/Web parity evidence; W6 owns that surface.
- Database migrations, new entitlement systems, secret values, new model configuration capability or data structures, and business data writes; existing developer write operations remain available only through the current admin role or explicitly supported owner compatibility role, same-origin, and signed-service boundaries.
- Physical deletion of legacy pages, capabilities, feature definitions, or data.
- Copying bytes from the dirty primary worktree; only the user-approved SKU audience-pack business semantics are retained.
- Merging W1 or claiming formal delivery from branch CI; this authorized run stops after the reviewed W1 branch is pushed.
rollback:
  strategy: Build and redeploy with NEXT_PUBLIC_OMNI_UNIFIED_SHELL=0 to restore the legacy shell/navigation; before commit revert only exact W1 paths, and after commit revert only the W1 commit without deleting renderers or data.
  data_recovery: No database or business data changes occur. Compatibility telemetry is append-only best-effort evidence and is not required for navigation recovery.
