contract_delta:
- description: Complete migrated developer-page keyboard, dialog and live-region semantics.
  reason: Final independent accessibility review found that the Prompt detail overlay could not identify itself as a modal dialog or restore keyboard focus, and that dynamic Models and Knowledge outcomes lacked explicit announcement semantics.
  effect: Prompt details now expose a labelled modal dialog, close on Escape, contain Tab focus and restore the invoking control; loading/errors and Models/Knowledge outcomes use status or alert live regions, with browser tests for focus, Escape, axe and announcements.
  accepted: true
- description: Separate ordinary authenticated navigation evidence from privileged approval authority.
  reason: Final acceptance proved that real identity sessions use role=user, while the new navigation telemetry BFF initially reused the approval-only actor type and would reject every ordinary authenticated alias or route-gap event.
  effect: The shared identity adapter now exposes a read-only authenticated actor contract for the new telemetry endpoint, while the approval wrapper still rejects role=user and returns only admin or the explicitly supported owner compatibility role; same-origin, rate-limit, deduplication, service-token, and developer mutation boundaries remain unchanged.
  accepted: true
- description: Make Shell storage degradation visible and apply real mode-conditioned card density.
  reason: Screen-reader-only degradation text did not satisfy the visible fallback requirement, and the initial mode labels did not materially change information density between Work and Development.
  effect: The Shell shows an aria-live visible storage fallback notice, exposes work/development and comfortable/compact semantics, and applies 16px versus 12px card padding through Shell-scoped tokens with browser assertions against actual cards.
  accepted: true
- description: Extend the FR-011 read-only and privileged approval-actor boundary through Prompt Lab node and rule inspection.
  reason: Prompt Lab was registered as prompt-inspection/read but its existing drawer exposed rule create, edit, toggle, and delete actions through unauthenticated BFFs.
  effect: The unified Shell presents Prompt Lab as read-only, node and rule details require admin or the adapter's owner compatibility role, rule mutations additionally require same-origin requests, and negative tests prove rejection occurs before upstream access; general output-feedback capture remains outside this developer surface and unchanged.
  accepted: true
- description: Close the final FR-002/FR-011 compatibility, empty-state, permission, and two-mode boundary gaps found by independent PRD review.
  reason: /qa did not prove an advertising-review migration, Knowledge Eval lacked an evaluation-set empty state, developer mutation BFFs could reach upstream services without the privileged approval actor, and /workspace still rendered a second three-mode selector.
  effect: /marketing/review redirects once to /ad-review with telemetry and query preservation; the real Flywheel renderer remains owned; Models is read-only in the unified Shell; model/evaluation/rebuild BFFs fail unauthorized requests before upstream access; Knowledge Eval identifies the absence of registered evaluation sets; and legacy workspace query modes canonicalize to the existing System Graph/runtime pages while flag-off behavior remains unchanged.
  accepted: true
- description: Wire compatibility telemetry and the unified-Shell rollback through the real RuntimeAllocation and Docker build contracts.
  reason: Cross-lane runtime review proved that unit tests supplied a temporary compatibility token while standard host/container runtimes had no shared token projection, and that a NEXT_PUBLIC flag set only at container runtime cannot change the compiled browser bundle.
  effect: RuntimeAllocation creates a dedicated external token reference, host and Compose launch paths project it only to frontend and knowledge-engine, the frontend builder receives NEXT_PUBLIC_OMNI_UNIFIED_SHELL as a build argument, and required tests cover secret isolation, parsed Compose output, and a flag-off production build.
  accepted: true
- description: Render the shared SystemGraphView at its canonical /system-graph route.
  reason: The previous default redirect lost the System Graph feature identity and breadcrumb when a user selected its development-IA entry.
  effect: /system-graph directly reuses the existing fact-graph component, legacy_plan=1 retains the existing candidate-plan editor, /workspace/development remains owned by workspace-operations, and browser evidence checks the canonical entry without duplicating business logic.
  accepted: true
- description: Clarify the W1 permission boundary against the current identity contract.
  reason: Current main has identity roles but no feature entitlement or ACL authority; FeatureDefinition.owner is development ownership and cannot safely be repurposed as user authorization.
  effect: W1 filters lifecycle/visible entries, preserves every existing server-side permission and R0-R3 gate, and adds no client-side privilege bypass. Feature-level entitlements are not fabricated; the PRD's conditional unauthorized-feature case remains non-applicable until a real entitlement authority is defined.
  accepted: true
- description: Correct alias classification so six distinct live renderers remain reachable and exactly two non-rendering compatibility bookmarks resolve directly to canonical pages.
  reason: Independent code review proved that /ad-review/flywheel, /content-leaderboard, /decisions, /insights, /review, and /system-graph contain distinct business behavior; redirecting them would violate FR-002 and FR-010. /qa is a genuine redirect adapter, while historical documents advertised /marketing/review without ever supplying that renderer on main.
  effect: The six paths remain owned surfaces; /system-graph is canonical; /qa redirects once to /chat; and /marketing/review redirects once to the real /ad-review renderer with query preservation and bounded telemetry. This restores the historical bookmark but does not claim to implement the earlier proposed opposite /ad-review -> /marketing/review migration direction, and Desktop parity remains W6 evidence.
  accepted: true
- description: Extend the existing System Graph frontend collector for FeatureDefinition owned surfaces.
  reason: The corrected canonical System Graph route exposed that the S3 collector only understood canonical routes and legacy aliases, so a real owned page could disappear from the graph projection.
  effect: W1-CHG-006 adds canonical and owned renderer routes to the graph while excluding compatibility aliases, covered by the existing collector regression suite.
  accepted: true
- description: Add one shared-Shell compatibility not-found surface and remove anonymous middleware gap writes.
  reason: Raw HTML middleware responses cannot represent Next RSC/client-side not-found navigation, and anonymous random 404 requests could amplify service-token telemetry writes.
  effect: W1-CHG-003 adds frontend/src/app/not-found.tsx; unregistered routes render consistently through the root Shell and emit only authenticated, bounded, deduplicated best-effort gap telemetry. Alias redirects remain exact and fail closed.
  accepted: true
- description: Add the registered Prompt Lab renderer to the developer-boundary slice for its required empty state and read-only inspection contract.
  reason: Cross-lane review proved that an empty Prompt/Eval nodes response left the P0 page blank and its drawer still exposed editing controls, while AC-FR011-01 requires an explicit empty state and forbids pretending that an advanced evaluation backend exists.
  effect: W1-CHG-009 adds the Prompt Lab page, drawer, and node/rule BFF boundary; browser acceptance asserts truthful empty guidance, the unified Shell exposes read-only inspection, admin or the adapter's owner compatibility role protects developer reads, mutations fail closed, and no experiment backend is fabricated.
  accepted: true
- description: Split the frontend production build from repository-wide historical lint while retaining exact lint coverage for every W1 TypeScript and TSX path.
  reason: The original required npm build command completes production compilation and TypeScript validation, then exits on 107 errors across 42 files that are byte-identical to the attested W1 base and have zero intersection with the W1 diff.
  effect: W1-VERIFY-006 now runs the same Next production build with only the legacy lint phase disabled, W1-VERIFY-006A requires zero-error scoped ESLint over every W1 source and test, and W1-VERIFY-006B retains the original command as explicit non-required baseline-debt evidence. No product path, behavior, risk, or acceptance criterion is weakened.
  accepted: true
