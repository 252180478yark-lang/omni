risks:
- risk: Changing the default direct-call behavior could break existing unit tests that intentionally write contracts without Git staging.
  mitigation: Keep worktree evaluation as the explicit default for direct function calls; only CLI modes select index or a named head tree.
- risk: An index source could accidentally be used for CI ref mode.
  mitigation: Bind --base/--head to the provided head ref and cover it with a regression test.
out_of_scope:
- Repairing or committing unrelated S0, P0, Creator, or Live candidate paths.
- Rewriting the historical p0-v4-canonical-deployment contract.
- Credential rotation, runtime deployment, or external Human Gate operations.
rollback:
  strategy: Revert the gate and validator helper together; direct callers retain their existing worktree behavior throughout the change.
  data_recovery: Not applicable because no persistent data or external state changes.
