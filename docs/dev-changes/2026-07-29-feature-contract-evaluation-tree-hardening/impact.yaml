before_snapshot:
  ref: git:e534655124387655d6528960c67616269f68771c
intent:
  problem: The feature-contract gate detects changed contract paths from a Git diff but reads their YAML from the mutable worktree. A staged deletion can therefore pass when an untracked worktree copy remains, so the gate does not prove the actual evaluated Git snapshot.
  expected_outcome: 'Bind contract parsing and archival-path checks to the same evaluation source as the changed-file list: HEAD tree for CI ref mode, index for local changed-files-file mode, and worktree only for direct unit-test callers.'
  user_visible_behavior:
  - A deleted indexed contract cannot pass because of a worktree copy.
  - Local staged validation evaluates the index without absorbing unstaged edits.
  - CI base/head validation evaluates the declared head tree, not checkout drift.
current_chain:
  nodes:
  - service:feature_contracts.check_feature_contracts
  - service:dev_contract.read_yaml
  - state:git.worktree
  - state:git.index
  - state:git.evaluation-head
  edges:
  - from: ci:feature-contract-gate
    to: service:feature_contracts.check_feature_contracts
    relation: calls
  - from: service:feature_contracts.check_feature_contracts
    to: state:git.worktree
    relation: reads
  evidence:
  - scripts/check_feature_contracts.py:_changed_contract_files identifies the changed contract pair from the diff.
  - scripts/check_feature_contracts.py:check_feature_contracts currently uses Path.is_file and contract_validator.read_yaml against the worktree.
  - The P0 audit reproduced a staged contract deletion that passed solely because an untracked worktree copy existed.
