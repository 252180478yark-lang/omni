risks:
- Materializing Skill junctions incorrectly could remove their source targets or include a host-only link; each junction must first resolve inside this repository, be copied to a temporary ordinary directory, and only then replace the link while preserving the .claude target.
- Requiring v2 fields in schema v1 would invalidate completed S0 contracts; compatibility must be centralized in dev_contract.py and covered by both v1 and v2 strict tests.
- Checking only the current Windows worktree would hide junction dependence; a clean clone with the staged S1 patch must prove that all 18 Skills load as ordinary tracked files.
- The frontend Codex runner has no provider-neutral session persistence or trusted host execution boundary; treating it as S1-ready would expose an unsafe, non-resumable browser-to-host path.
- .codex/config.toml contains a machine-local MCP address and must remain outside the portable S1 asset set.
out_of_scope:
- S2 PreToolUse/Stop hooks, warning logs, and process enforcement beyond the existing advisory SessionStart hook.
- The current frontend Codex runner candidate, its default-provider behavior, Docker runtime, provider-session migration, history/resume behavior, Host Bridge authentication, and any browser-to-host execution path; these remain S10 work under a separate contract.
- S0 migration source, P0 prompt, or isolated-verifier changes, including the four prompt files modified after the S0 staging snapshot.
- S3 FeatureDefinition, graph schema, collectors, UI, external platform writes, and all unrelated dirty worktree paths.
rollback:
  strategy: Revert or path-scope unstage only the declared governance files. For a materialized junction, remove only its new ordinary directory and recreate the link from its unchanged, validated in-repository .claude/skills source; never remove the source target. The existing frontend runner remains untouched.
  data_recovery: No database, provider session, external system, credential, or production artifact is changed.
verification_plan:
- id: VER-001
  layer: policy
  command: python -B scripts/check_agent_policy.py --require-tracked
  proves: AGENTS is UTF-8 and size-bounded, every routed Skill exists as a tracked ordinary-file tree, and no routed Skill reference is missing.
  required: true
- id: VER-002
  layer: unit
  command: python -B -m unittest discover -s tests -p "test_agents_policy.py" -v
  proves: The policy gate rejects malformed instructions, missing/reparse or untracked routed Skill assets, while the SessionStart hook remains advisory.
  required: true
- id: VER-003
  layer: archive
  command: python -B scripts/verify_agent_archives.py
  proves: The compact AGENTS file and its immutable rollback archive have the expected size and content hash.
  required: true
- id: VER-004
  layer: cli
  command: python -X utf8 scripts/validate_prd.py docs/prds/2026-07-29-omni-fde-system-convergence-master-prd/2026-07-29-omni-fde-system-convergence-master-prd-v1.1.md --strict
  proves: The stable repository-root PRD validator executes the canonical READY PRD.
  required: true
- id: VER-005
  layer: unit
  command: python -B -m unittest discover -s tests -p "test_prd_validator_entrypoint.py" -v
  proves: The root PRD validator preserves arguments and reports missing inputs instead of relying on a Skill-relative working directory.
  required: true
- id: VER-006
  layer: contract
  command: python -B -m pytest -q -p no:cacheprovider tests/test_feature_contracts.py .agents/skills/omni-feature-development/tests/test_dev_contract.py
  proves: Legacy v1 contracts remain strict-valid, generated v2 contracts require feature/snapshot identity at lock, and v2 graph snapshots bind to the declared before reference.
  required: true
- id: VER-007
  layer: diff_hygiene
  command: git diff --cached --check
  proves: The staged S1 patch has no whitespace errors; the feature-contract gate is run as a post-COMPLETE assertion because it intentionally requires this contract to already be COMPLETE.
  required: true
- id: VER-008
  layer: clean_clone
  command: python -B -m unittest discover -s tests -p "test_agent_skill_portability.py" -v
  proves: A clean clone plus the staged S1 patch has all 18 routed Skills, no reparse-point dependency, and a passing tracked-assets policy gate.
  required: true
