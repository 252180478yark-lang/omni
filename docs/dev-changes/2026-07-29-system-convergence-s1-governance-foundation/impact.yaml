intent:
  problem: Governance assets load in the current Windows worktree but are not yet a portable, versioned S1 baseline; 11 of 18 AGENTS-routed Skills are Windows junctions, the documented PRD validator lacks a repository-root entrypoint, and the contract format cannot yet bind future work to a feature and before snapshot without invalidating historical v1 evidence.
  expected_outcome: A clean clone loads all 18 Skills explicitly routed by AGENTS as ordinary tracked files, validates repository instruction hygiene and archive integrity, exposes a stable root PRD-validator command, and validates both historical v1 and new v2 feature contracts.
  user_visible_behavior:
  - A new Codex task can load the versioned contract-first workflow without local junctions or a repeated setup prompt.
  - The documented PRD validator can be invoked from the repository root.
  - Existing v1 S0 contracts remain strict-valid, while newly initialized contracts carry feature references and a before-snapshot reference.
