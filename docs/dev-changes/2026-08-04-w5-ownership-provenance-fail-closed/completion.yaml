contract_delta:
  - description: Corrected the final strict validation command to the only schema-v3 state that permits strict candidate validation.
    reason: The initial IMPACT_LOCKED strict command was structurally impossible because strict schema-v3 validation requires GRAPH_DIFF_READY.
    effect: No implementation or path scope changed; the final evidence command now validates the precise terminal candidate.
    accepted: true
  - description: Closed Sol P1/P0 verifier-result hardening findings.
    reason: A non-Mapping or malformed verifier result could raise before ownership resolution; a false result with an empty reasons list could leave no rejection reason and be treated as delivered; a signed v2 failed check could be masked by a live success.
    effect: Only literal Mapping valid=true with an empty well-formed reasons list is positive provenance. Every other result, exception, or timeout stays active through a stable fail-closed reason. V2 attestation checks and live checks must both pass; the tested v1 compatibility path accepts verified live checks only when signed checks are absent.
    accepted: true
