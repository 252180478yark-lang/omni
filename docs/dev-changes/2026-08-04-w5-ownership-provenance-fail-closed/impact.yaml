intent:
  problem: A caller-supplied delivered contract id can bypass provenance verification and suppress an active ownership scope.
  expected_outcome: Only an attestation validated by the same explicit provenance verifier can exclude a contract from active ownership.
  user_visible_behavior:
  - Offline, timeout, malformed, repository, commit, tree, artifact, or check mismatch evidence leaves the contract active.
  - A currently active runtime lease remains an independent ownership blocker even after valid delivery evidence.
