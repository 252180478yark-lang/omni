intent:
  problem: P0 12 秒种草视频允许没有已采纳画像的订单，并把痛点桥作为任意非空字符串。 当前订单 10d86fa6-4d15-4701-8f19-f455123e8315 因此只把人群记录和 SKU 白名单 当作背景文本，脚本没有经画像证据、具体痛点、可见结果和可信理由的正式种草契约约束。
  expected_outcome: 新 P0 订单必须冻结已采纳的画像和结构化、证据可追溯的痛点—产品动作—结果桥； 12 秒脚本在进入付费视频审批前必须通过正式种草内容闸、三角向量闸和画像来源预匹配。
  user_visible_behavior:
  - 没有已采纳画像时，P0 页面明确显示阻断项，不能创建可写 ContentSpec 的正式订单。
  - 用户先审两条证据化痛点桥并选一条，再审仅开头钩子不同的两条 12 秒脚本。
  - 脚本审核显示画像证据、场景、痛点、产品动作、可见结果、产品理由和内容闸结果。
  - 画像缺失、桥无证据、内容闸失败或向量来源降级时，付费视频审批不可打开。
