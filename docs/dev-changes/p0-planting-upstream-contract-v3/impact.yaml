risks:
- Existing v2 orders lack portrait/bridge fields; version checks must preserve their audit read path while forbidding new v2 writes.
- The canonical bridge tool is registered at an MCP layer; wrapping it must not create a second unsynchronized bridge schema or bypass audit/trace behavior.
- The current explicit GenerateCreativePack BFF route does not pass portrait_id, pain_solution_bridge, or upstream_fact_hash; P0 must avoid this loss path or repair its contract.
- Adding a stricter gate can block more drafts; the page must make first_blocker and the required next action visible instead of showing an empty state.
out_of_scope:
- Paid video rerendering, provider choice, and Human Gate approval for a new video attempt.
- Deterministic product-packshot compositing and product-label raw-video QA changes; those stay as a subsequent renderer-quality change.
- Ecommerce visual and AI-insert historical branches.
- Changing the P0 12-second four-beat duration or adding a second historical video chain.
rollback:
  strategy: Deploy as a new P0 v3 contract; revert the v3 code/prompt/UI change if needed while retaining v2 read-only order support. Do not mutate historical order/spec/review records.
  data_recovery: No destructive data operation is planned. New v3 draft orders can be cancelled through the existing workflow; historical raw_rejected order remains audit evidence.
