compatibility:
  api:
    status: compatible
    strategy: The P0 BFF operation map gains a bridge-review operation; existing operations keep their names but P0 v3 buildSpec requires a selected structured bridge.
  database:
    status: compatible
    strategy: No destructive migration. P0 v3 persists bridge JSON and hashes in existing JSONB ContentSpec/TruthSnapshot fields; v2 orders stay readable and immutable.
  workflow:
    status: compatible
    strategy: P0 v3 adds a BRIDGE_REVIEW blocker between truth and spec, then keeps the 12-second four-beat, prompt, approval, raw-QA, and release states.
  data_source:
    status: compatible
    strategy: Reuse existing SKU, audience record, adopted portrait, optional adopted pack, and product-reference data; no new external source.
