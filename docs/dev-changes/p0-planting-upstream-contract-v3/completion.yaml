contract_delta:
- description: 将 frontend 验证从全仓 lint 调整为改动的 P0 页面和 BFF route 的精确 lint。
  reason: 全仓 lint 在未触及的既有页面和 API route 中有大量 no-explicit-any、unused 和 JSX 实体错误，不能作为本次 P0 改动的归因验证。
  effect: P0 改动仍由零警告的目标 lint 覆盖；既有全仓 lint 债务被保留为异常而未被掩盖。
  accepted: true
- description: 将 bridge-review MCP registry 和 P0 v3 付费审批拒绝测试纳入影响合同。
  reason: 新 MCP 工具需要 doctor registry 显式覆盖，且正式向量门的拒绝分支需要专门的无状态迁移测试。
  effect: MCP doctor 不再报告新工具漂移，审批门禁具备 unscored、record fallback 和五维失败三种回归证据。
  accepted: true
- description: 修复变更合同校验器对 Next.js 动态路由目录方括号的通配符误判。
  reason: 合同语法只把 * 和 ? 定义为 glob；真实路径 p0-video/[operation]/route.ts 却被校验器当成 glob，阻断精确路径的完成校验。
  effect: 动态路由目录可以作为精确实际变更路径进入范围校验，且不改变任何 P0 业务运行逻辑。
  accepted: true
