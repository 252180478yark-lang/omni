risks:
- id: RISK-001
  description: More than one adopted pack may exist for a person; implicit latest-pack selection would make the input non-reproducible.
  mitigation: UI and MCP require one explicit audience_pack_id that canonical loader validates against SKU, audience and matrix lineage.
- id: RISK-002
  description: Existing v3 orders omit pack context and become invalid if the same contract version is tightened.
  mitigation: Introduce p0.v4 and preserve v2/v3 as read-only supported audit versions.
- id: RISK-003
  description: Fresh runtime preflight is blocked because unrelated migration 096 is present and checksum-matched in runtime but its source is still Git-untracked; v4 migration 097 is likewise not yet canonical or applied.
  mitigation: Do not bypass, reconcile or edit migration 096 in this change. The owning change must make 096 canonical; then make 097 canonical, apply only 097, and re-run preflight.
out_of_scope:
- Resolving source tracking or ownership for migrations/096_creator_homepage_first30_rank.sql or any unrelated repository migration.
- Cancelling, deleting, rewriting or generating from the already-created incomplete v3 order 88f04565-b9b0-4a11-bf75-261728b90163.
- Script generation, paid video generation, external provider configuration and video-provider calls.
rollback:
  strategy: Revert the v4 code paths if needed; the nullable schema column is backward-compatible, no existing v2/v3 record is modified, and any v4 order remains an immutable audit record that can be explicitly cancelled later.
  data_recovery: Snapshot data is append-only. The new nullable column does not overwrite legacy data; no recovery operation is needed.
