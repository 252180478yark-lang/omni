compatibility:
  api:
    status: compatible
    strategy: Existing operation names stay stable; create and inputs gain audience-pack fields for new v4 orders only.
  database:
    status: compatible
    strategy: Add nullable audience_pack_id with an FK and index. v2/v3 rows remain unchanged; v4 persistence requires the value before insert.
  workflow:
    status: breaking
    strategy: New writes use p0.v4 and require an adopted matching pack. p0.v2 and p0.v3 remain readable/auditable but are superseded for mutable workflow actions.
  data_source:
    status: compatible
    strategy: Reuse the existing adopted pipeline.audience_packs source; no platform call or new collector.
