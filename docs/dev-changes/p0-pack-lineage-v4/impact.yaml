intent:
  problem: P0 v3 创建订单只接收已采纳人群、画像和产品参考图，没有接收或冻结已采纳 audience_pack_id。 运行时订单 88f04565-b9b0-4a11-bf75-261728b90163 因而把 facts.lineage.audience_pack_id 冻结为 null， pack_calibration 为空且桥接不要求 pack evidence；这不满足“前置链路内容和知识完整进入视频”的要求。
  expected_outcome: 新 P0 v4 订单必须由用户选择一个与 SKU、人群、矩阵血缘匹配的已采纳人群包，并将其作为 canonical planting bridge context 的一部分冻结；桥接、ContentSpec、脚本和向量门均使用同一包证据。
  user_visible_behavior:
  - P0 输入区会显示与所选人群匹配的已采纳人群包；未选择时不允许创建新订单。
  - 新订单只接受与已采纳人群、已采纳画像、SKU 和矩阵血缘一致的已采纳包。
  - 新 v4 桥接必须带有可追溯的人群包校准证据；旧 v2/v3 订单仍可审计但不能继续写入。
