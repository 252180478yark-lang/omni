  reason: 审计发现只有快照无法在订单查询、不可变审计和工作流复核中可靠地证明用户实际选定的包；v2/v3 历史行又不能被强制回填。
  effect: v4 写入必须持久化同一包 ID，v2/v3 保持可读；部署前会被 097 迁移和 P0 preflight 明确阻断，不能静默绕过。
  accepted: true
- description: 将 096 运行时 blocker 的表述从 ledger 缺失修正为 canonical source untracked。
  reason: 只读 preflight 证明 096 已在 runtime ledger 且 checksum 匹配；它被阻断的唯一原因是源码尚未纳入 canonical Git。
  effect: 不会错误重跑或 reconcile 096；后续必须先由其 owner 纳入 canonical Git，再纳入并定向应用 097。
  accepted: true
