  command: uv run --no-project --with 'pytest>=8,<9' --with 'pyyaml>=6,<7' pytest -q tests/test_workspace_ownership.py tests/test_w5_recovery_evidence.py -k 'not test_manifest_rejects_common_dir_junction_escape' && cd frontend && npx vitest run tests/workbench-navigation-events.test.ts
