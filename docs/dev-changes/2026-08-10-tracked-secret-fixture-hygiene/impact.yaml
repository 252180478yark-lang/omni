intent:
  problem: Seven tracked-baseline findings are false positives created by deterministic test literals in one frontend test, one disposable migration verifier and the W5 scanner tests themselves.
  expected_outcome: Preserve every test assertion while ensuring the repository contains no credential-shaped contiguous fixture literal and the unmodified tracked scanner passes with zero findings.
  user_visible_behavior:
  - No product behavior changes; S0 secret hygiene reports the truthful clean tracked baseline without an allowlist exception.
