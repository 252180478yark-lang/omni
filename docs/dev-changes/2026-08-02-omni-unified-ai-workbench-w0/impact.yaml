  description: Treating choice A or a self-authored manifest as delivery proof could overwrite or misattribute predecessor work.
  mitigation: Preserve the primary file, verify GitHub receipt provenance live, require exact path coverage, and fail on any owner or lease not named by the supersession record.
- id: W0-RISK-002
  description: origin/main or a W1 target fingerprint could drift after W0 evidence is recorded.
  mitigation: Re-run fetch, commit, blob, SHA-256, status, and ownership checks before any W1 lock; drift keeps the Gate closed.
out_of_scope:
