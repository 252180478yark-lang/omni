contract_delta:
- description: Split pre-transition structural validation from post-transition strict and Git-derived candidate validation.
  reason: The original locked plan made GRAPH_DIFF_READY validation a required prerequisite to the transition that creates GRAPH_DIFF_READY, which is circular under the repository state machine.
  effect: W0-VERIFY-004 now validates the VERIFYING contract before transition; W0-VERIFY-006 and W0-VERIFY-008 remain exact post-transition checks and are recorded after the local endpoint is reached. Scope, risk, product boundaries, and target paths are unchanged.
  accepted: true
- description: Make the W0 baseline verifier reproducible on both the pre-commit worktree and its committed candidate.
  reason: The original verifier required HEAD to equal the immutable product baseline, so the same required command failed immediately after the five allowed W0 files were committed.
  effect: The verifier still pins origin/main and merge-base to c8c8eec7, requires the candidate to descend from that baseline, and rejects any committed or worktree path outside the exact W0 contract directory. Product scope and W1 write authority remain unchanged.
  accepted: true
- description: Close the committed-candidate completeness and live-provenance reliability gaps found during delivery preflight.
  reason: The post-commit verifier allowed a subset of the five W0 files, the manifest hash changed without refreshing graph_diff.snapshot_after, mixed committed/worktree evaluation made advisory worktree mode incomplete, and GitHub artifact downloads produced repeatable transient content-unverifiable failures.
  effect: The candidate must contain all and only the five hard-coded W0 paths, the manifest cannot expand that authority, history must remain linear, every intermediate commit is checked for out-of-scope paths, reserved product mode/type/blob entries must equal the baseline, and all dynamically loaded collectors must match frozen Git/SHA-256 fingerprints. The verifier checks the manifest digest against the completion graph snapshot, confines receipt caches, verifies unique and live run/artifact metadata, replaces mixed worktree discovery with exact index mode, and gives only three enumerated provenance-availability failures one bounded retry. Content, digest, owner, lease, and scope failures remain fail-closed.
  accepted: true
