contract_delta:
- description: Upgraded this locked contract from schema v2 to schema v3 and changed repository-authored completion into GRAPH_DIFF_READY plus external CI attestation.
  reason: The audit proved a completion YAML in the same uncommitted tree cannot independently prove that its own implementation is delivered in an immutable reachable commit.
  effect: Historical v1/v2 contracts remain compatible; every new v3 change can be verified locally but only trusted default-branch CI can project effective COMPLETE.
  accepted: true
- description: Added CHG-006 for a read-only runtime manifest/guard after the locked repository audit.
  reason: Docker inspection found another worktree sharing the canonical database, knowledge volume, and cron responsibilities, which is a deterministic source of apparently random development failures.
  effect: S0.5 now detects and explains the conflict without stopping containers or changing databases; resource isolation and migration execution remain S1.5 work.
  accepted: true
- description: Added CHG-007 and VER-008/VER-009 for the runner adapter bootstrap, but explicitly excluded Web UI and session-manager activation.
  reason: The blocking runner CI gate and clean candidate need Codex runner, effort types, and matching Claude compatibility, while activating danger-full-access from the Web UI would be a materially larger Host Bridge/security slice.
  effect: The adapter is compile- and unit-tested in the delivery candidate; user-facing provider selection remains deferred and no new Web execution path is enabled by S0.5.
  accepted: true
- description: Restricted delivery-seal to trusted default-branch post-merge pushes and denied all database/migration attestations until a blocking S1.5 migration gate exists.
  reason: Red-team integration found that PR/feature pushes and R2 migration files could otherwise receive a false COMPLETE artifact despite not being delivered or database-verified.
  effect: PRs, feature branches, and manual runs only validate candidates; migration work remains verified_not_delivered until its real blocking gate is installed.
  accepted: true
- description: Added the current branch versus origin/main tracking-ref divergence to PRD v1.2 and the implementation status snapshot.
  reason: The branch is ahead by 326 commits, so default-branch merge-base evaluation would mix long-lived historical work into this small governance candidate.
  effect: S0.5 creates an immutable candidate from the audited HEAD, while historical target-ref convergence is treated as a separate integration task and cannot be hidden inside a new feature receipt.
  accepted: true
- description: Added an explicit PDF binary rule to the repository attributes and CHG-005 scope during immutable candidate construction.
  reason: Git diff --check correctly exposed that the archived PDFs were being parsed as text byte streams and reported meaningless trailing-whitespace failures.
  effect: Source line-ending rules remain deterministic, PDF content is no longer text-normalized or whitespace-scanned, and the clean candidate can prove patch integrity without suppressing real source errors.
  accepted: true
- description: Added SessionManager to CHG-007 with only a Map iteration compatibility rewrite in the immutable candidate.
  reason: Full TypeScript validation of the clean base exposed TS2802 because the repository tsconfig has no ES2015 target and the base file used for-of over Map; the shared worktree contains broader provider-selection edits that are intentionally not part of S0.5.
  effect: The clean candidate passes the existing full typecheck without enabling Codex through the Web/session path; the broader shared-worktree changes remain uncommitted and outside this delivery.
  accepted: true
- description: Stabilized the S0.5 CI bootstrap after the first real default-branch baseline run and added CHG-008 for the Knowledge Engine packaging/test and Vitest configuration files before delivery.
  reason: GitHub Actions run 30470080606 proved that the blocking unit job omitted httpx and that the informational full-suite install could not resolve the app/config flat layout; clean frontend verification also proved Vitest was collecting a Playwright E2E spec.
  effect: CHG-004 retains ownership of .github/workflows/ci.yml, CHG-008 owns the newly touched package and test-runner paths in this same contract, the original local 9042a9b8 and first 8a9b717 integration candidates are superseded before default delivery, and main cannot advance until the corrected remote integration run passes.
  accepted: true
- description: Promoted every required clean-runner verification into the delivery-seal dependency graph and removed eager creation of the container-only asset root.
  reason: Integration run 30471467914 passed the original four blocking jobs while its continued full-suite step failed during collection on PermissionError /app; review also proved editable install, full collection, and full Vitest discovery could regress without blocking an attestation.
  effect: A dedicated KE bootstrap gate now installs and collects on Linux, the Codex runner gate runs all frontend unit tests, app import does not create the asset root, and delivery cannot seal if any of those checks fail.
  accepted: true
- description: Restricted delivery to branch refs and made default-branch CI runs non-cancellable.
  reason: A tag or case-variant branch named like the default branch could satisfy Actions expression matching, and cancelling default run A after push B could leave A permanently without an attestation because B validates only A..B.
  effect: Push triggers exclude tags, the seal fails closed on a Bash case-sensitive exact branch ref, and each default-branch commit receives a unique concurrency group while feature-branch runs remain replaceable.
  accepted: true
