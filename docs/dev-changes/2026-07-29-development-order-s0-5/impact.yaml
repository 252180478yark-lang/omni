risks:
- id: RSK-001
  description: A new hard local gate could deadlock the already dirty shared worktree.
  mitigation: S0.5 keeps SessionStart advisory and makes immutable commit/CI the authority; PreToolUse and Stop blocking remain deferred until active-change identity exists.
- id: RSK-002
  description: Schema v3 could invalidate historical completed contracts.
  mitigation: Preserve schema v1/v2 semantics and exercise explicit compatibility fixtures.
- id: RSK-003
  description: A self-authored delivered_commit field would be self-referential and unverifiable in the same commit.
  mitigation: Store only base/risk/candidate intent in-repo and generate the delivered SHA/tree/path digests as an external CI attestation.
- id: RSK-004
  description: Broad CI refactoring could hide existing integration failures.
  mitigation: Keep existing blocking jobs, bind checkout and evaluation SHA, and do not include the informational full suite in a COMPLETE attestation.
- id: RSK-005
  description: Runtime inspection could expose connection strings or mutate containers while diagnosing ownership.
  mitigation: Redact all environment values, keep S0.5 commands read-only, and defer stop/rebuild/migration execution to an explicit later slice.
- id: RSK-006
  description: A bundled Codex runner launched from the wrong cwd could silently skip the project AGENTS and the new development contract.
  mitigation: Deliver the existing fail-closed cwd resolver and its unit/type checks with the governance bootstrap so every launched task resolves E:/agent/omni and loads AGENTS.md.
- id: RSK-007
  description: PDF artifacts can be misclassified as text and make a clean candidate fail whitespace validation on binary byte streams.
  mitigation: Track a deterministic .gitattributes rule marking PDF files binary while keeping source line-ending rules explicit.
- id: RSK-008
  description: The clean base frontend fails full TypeScript validation when iterating SessionManager's Map under the repository's default compiler target.
  mitigation: Include only the behavior-neutral Map.forEach compatibility rewrite in the immutable candidate; do not include the broader worktree provider-selection activation.
- id: RSK-009
  description: Developer-machine dependencies can make the historical CI bootstrap appear green locally while a clean Linux runner fails before executing tests.
  mitigation: Reproduce both dependency layers locally, make editable installation/full collection/frontend unit discovery blocking delivery-seal dependencies, and require a remote integration run before advancing main to the S0.5 subject.
- id: RSK-010
  description: A module import can write a container-only /app path, and an information-only job can look green even when its continued step failed.
  mitigation: Remove the unnecessary eager asset-root creation, keep upload storage configurable, inspect step conclusions rather than only job conclusions, and bind clean Linux collection to a blocking gate.
- id: RSK-011
  description: GitHub expression string equality is case-insensitive, so a case-variant branch name can satisfy a ref_name-only default-branch job condition.
  mitigation: Keep the lightweight job condition but fail closed inside the trusted job unless Bash confirms the exact case-sensitive refs/heads/default-branch ref before checkout or attestation.
out_of_scope:
- No system-graph page, runtime animation, FeatureDefinition, trace spine, health registry, Host Bridge, Human Gate worker, or client retirement is implemented in S0.5.
- No container is stopped, rebuilt, renamed, or moved; no worktree, branch, staged user path, database row, migration, volume, or user data is deleted or rewritten.
- Existing lint debt and stopped optional services are recorded in PRD v1.2 but are not falsely declared repaired by this governance slice.
rollback:
  strategy: Revert the S0.5 governance files and CI job while retaining v1.2 as historical documentation; schema v1/v2 remain executable throughout rollback.
  data_recovery: Not applicable because the slice changes no business data, schema, runtime container, or external system.
