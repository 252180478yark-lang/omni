risk:
  level: R2
  reasons:
  - Changes repository-wide development governance, Codex hooks, CI evaluation semantics, runtime ownership checks, and the canonical master PRD.
  - A defect could either over-block ordinary development or allow an uncommitted cross-layer candidate to be mistaken for delivery.
  external_effects: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The repository currently treats worktree/index YAML consistency as completion even when governance assets are absent from HEAD, changed-path input can be incomplete, CI does not bind a delivery result to one immutable tree, and ordinary single-layer changes are over-gated while real cross-layer/runtime drift can escape.
  expected_outcome: Introduce a backward-compatible schema-v3 delivery candidate, Git-derived worktree/index/commit evaluation modes, risk-derived contract enforcement, and a CI-generated external delivery attestation; expose the state at Codex session start and publish PRD v1.2 with the remaining runtime-isolation, health, migration, Human Gate, and retirement work.
  user_visible_behavior:
  - A new Codex task reports whether it is reading a worktree candidate, staged candidate, or immutable delivered commit before development starts.
  - Local reversible single-layer work is advisory or light-weight, while cross-layer, governance, schema, runtime, external, paid, secret, and irreversible changes receive proportionate deterministic gates.
  - A YAML contract cannot by itself prove delivery; only CI validation of an immutable commit can emit a delivery attestation.
  - The bundled Codex runner adapter resolves the Omni repository root so a later Host Bridge activation loads the same AGENTS, Skill, Hook, and PRD rules; S0.5 does not expose the adapter through the Web UI.
  - The blocking CI bootstrap is reproducible in empty Python environments, and unit runners no longer mix frontend Playwright E2E with Vitest.
  - Every required S0.5 verification is a dependency of the delivery seal; default-branch runs cannot be cancelled by a later push, and neither tags nor case-variant branch names can impersonate the exact default branch ref.
