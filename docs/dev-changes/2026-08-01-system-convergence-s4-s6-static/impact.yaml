  level: R2
  reasons:
  - This adds deterministic graph, planning, CI-warning, REST/BFF/MCP adapters, and pilot contracts across schema, service, CLI, CI, and tests.
  - The implementation is repository-local and does not execute migrations, start runtime resources, publish, call external systems, or alter business data.
  external_effects: []
