    required: false
    gate_ref: ''
intent:
  problem: S3 can scan immutable facts, but lacks a deterministic planned-to-fact projection, evidence-backed repair cards, candidate-plan revision/CAS, and an R1/R2/R3 pilot calibration surface.
  expected_outcome: A static, directly testable S4-S6 chain projects an impact contract over a fact snapshot, emits stable warning artifacts, preserves unknown rather than claiming removal, supports immutable candidate plan revisions and confirmation projections, and proves R3 fixtures cannot invoke an effect before approval.
  user_visible_behavior:
  - Required-edge gaps are shown as evidence-backed warning or unknown repair cards instead of silently turning facts green.
  - Candidate plans remain revisions until explicit confirmation and cannot create a product write before confirmation.
  - R1/R2 pilot fixtures can close their deterministic loop automatically in an isolated allocation; R3 fixtures remain pending with zero effect execution.
