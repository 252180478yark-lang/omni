risks:
- id: RSK-001
  description: A partial collector could be mistaken for a removed required edge.
  mitigation: Missing edges are unknown whenever any relevant source is partial or unknown; only fully successful sources can emit deterministic missing warnings.
- id: RSK-002
  description: A plan confirmation could overwrite a concurrent or stale candidate plan.
  mitigation: Every mutation requires an expected revision and confirmation rejects stale snapshots or unresolved critical unknowns.
- id: RSK-003
  description: Pilot calibration could accidentally turn unproven hypotheses into blocks.
  mitigation: Only an explicit allowlist of deterministic observed-fact issue codes can block; hypotheses stay warnings.
- id: RSK-004
  description: An R3 test could call an external effect callback.
  mitigation: The fixture exposes only a pending result and never accepts or invokes an effect callback.
- id: RSK-005
  description: A plan adapter could be mistaken for a product execution authority.
  mitigation: The REST and MCP adapters only write candidate-plan revisions in an explicit local artifact root; confirmation returns an in-memory impact draft and reports product_write_performed false.
- id: RSK-006
  description: A vertical pilot could touch a canonical runtime or present a fixture receipt as external CI.
  mitigation: The vertical test acquires a noncanonical temporary runtime allocation, commits only in a temporary repository, records a fixture-labeled attestation, and leaves delivery status pending external CI.
- id: RSK-007
  description: Abstract adapter names could be presented as observed graph facts without collector evidence.
  mitigation: Canonical FeatureDefinition nodes and AST/decorator-derived edges are required for the final after-scan; abstract planned nodes remain plans until those facts exist.
- id: RSK-008
  description: The S3 baseline snapshot hash is recorded but its immutable JSON artifact is not materialized in this checkout, preventing a mechanical full before-to-after enumeration.
  mitigation: Preserve the exact baseline hash, record a time-bounded accepted unknown, and require every canonical S4-S6 edge to be present with after-scan evidence; no delivery claim is made from this local graph state.
out_of_scope:
- No database migration, shared database access, Docker startup, production plan storage, external write, actual external CI attestation issuance, or worktree ownership operation is part of this change.
- The separate pending R3 gate at docs/dev-changes/2026-08-01-system-convergence-s4-entry-prereqs/gate-plan.yaml remains unapproved and untouched.
rollback:
  strategy: Revert this single repository-local candidate; no migrations, runtime resources, or external state are created.
  data_recovery: No business or persistent production data is written. File-backed test artifacts are created only inside temporary test directories.
