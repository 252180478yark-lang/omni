compatibility:
  api:
    status: not_applicable
    strategy: A local-owner-only REST adapter and same-domain BFF/MCP facade expose candidate plan artifacts. They accept no product writer and require explicit confirmation before an impact draft is returned.
  database:
    status: not_applicable
    strategy: S5 revisions are file-backed artifacts under an explicit service-owned directory; no migration, shared database access, or DDL is introduced.
  workflow:
    status: compatible
    strategy: Existing S3 snapshots stay immutable, existing approval operations remain authoritative, and the new R3 fixture is incapable of invoking a real effect.
  data_source:
    status: compatible
    strategy: Only explicit impact YAML and immutable graph snapshots are read; collector failures remain unknown.
