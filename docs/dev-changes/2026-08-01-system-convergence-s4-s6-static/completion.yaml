contract_delta:
- description: Expanded the R2-only S5/S6 static candidate to include authenticated adapters and isolated vertical evidence.
  reason: S5 and S6 acceptance require an executable API/MCP permission boundary and an isolated allocation/receipt vertical proof beyond storage-neutral unit services.
  effect: Re-locked R2-only additions for local-owner REST/BFF/MCP adapters and temporary fixture runtime allocation, while preserving no product writer, no Docker/shared DB, and no external CI claim.
  accepted: true
- description: Added an evidence-only S4 graph binding because abstract adapter names are not scanner facts.
  reason: GraphDiffReady must be based on canonical FeatureDefinition nodes and observed source edges rather than the planned-layer labels alone.
  effect: Re-locked only FeatureDefinition, generated projection, AST/decorator recognition, and their hermetic test; no new runtime, database, or external effect is authorized.
  accepted: true
