contract_delta:
- description: Health registry discovery now consumes the generated frontend FeatureDefinition projection.
  reason: Source scanning of TypeScript href literals would preserve a second identity authority.
  effect: Frontend and backend projections are byte-identical and generator check mode fails on either stale output.
  accepted: true
- description: The existing status generator and new deterministic health/runtime verification artifacts were added to the locked scope.
  reason: S14 already had a canonical status projection under a different name and needed an evidence-producing disposable verifier.
  effect: Status remains generated, and PostgreSQL evidence is restricted to an allocated omni_verify database.
  accepted: true
- description: Backend parity verification was split by service and MCP doctor gained a registry-only CLI mode.
  reason: Knowledge Engine and Scout both expose a top-level Python app package and cannot be imported safely in one pytest process.
  effect: Each service is tested in an isolated process while the normal database-backed runtime doctor remains unchanged.
  accepted: true
- description: Strict index verification added the already implemented runtime BFF, Scout registration, and regression-test paths to the locked planned globs.
  reason: Representative completion paths were insufficient for the v3 protected-path accounting gate.
  effect: Every protected staged path can now be mapped to one planned change without changing runtime behavior or external effects.
  accepted: true
- description: The integrated contract baseline was rebased from the superseded S6 gap candidate to the repaired single-owner S6 commit f62e1b4163389d026da932e9a4425899d740567a.
  reason: Current origin/main already owns the static S4-S6 paths, so retaining the old overlapping base would recreate the duplicate-owner CI failure.
  effect: S6 and S7-S14 are sequential candidates, each with exactly one delivery-ready v3 owner over its own commit range.
  accepted: true
- description: Explicit graph refs now materialize and scan the requested immutable Git tree instead of labeling current-worktree observations with another commit.
  reason: Rebased before/after scans exposed a false empty diff even though the requested commits differed.
  effect: The new snapshots prove f62e1b4 at 164 nodes and 180 edges versus 109e63f at 166 nodes and 182 edges, with commit identities embedded in the content-addressed artifacts.
  accepted: true
- description: Frontend static collection includes declared compatibility alias pages while retaining the canonical command-center route.
  reason: S11 keeps the legacy candidate-plan page reachable until S13 retirement gates pass; scanning only the canonical page falsely reported its BFF chain as removed.
  effect: Both /workspace/development and /system-graph remain factual graph nodes, while the retired direct selling-points page call is the only removed node.
  accepted: true
