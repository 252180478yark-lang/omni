  - services/knowledge-engine/app/routers/system_graph.py exposes S4-S6 plan and issue routes but no refresh, persisted snapshot graph, search, diff, or evidence read contract.
  - frontend/src/app/system-graph/page.tsx is a candidate-plan page and frontend/src/components/app-sidebar.tsx exposes it as a separately maintained top-level item.
  - frontend/src/app/sku-pipeline/page.tsx is approximately 7500 lines and frontend/src/app/api/omni/sku-pipeline contains many route-specific string mappings.
  - services/knowledge-engine/app/routers/mcp_exec.py contains route-specific tool wrappers plus a dynamic legacy route, while mcp_catalog.py owns another registry dispatcher.
  - services/scout-agent/app/services/metric_ingest.py and runbook_executor.py update mvp_daily_metric directly with ON CONFLICT and have no metric-owner contract.
