intent:
  problem: The deterministic graph cannot yet be consumed through a durable API or unified command-center UI; frontend entry and operation contracts are duplicated; backend execution and metric writers have parallel truth paths; legacy-client retirement lacks telemetry and reconciliation evidence.
  expected_outcome: S7 and S11-S14 have one evidence-backed implementation candidate integrated with the existing S8-S10 candidate, while every R3 retirement effect remains fail-closed until 14-day evidence and a separate explicit gate exist.
  user_visible_behavior:
  - Workspace advanced mode and SKU detail use the same snapshot-backed graph model, status legend, accessible tree, Chinese evidence drawer, and explicit loading/empty/error/partial states.
  - Execution mode uses only persisted runtime events and exposes gaps, replay, Host degradation, and fact-only plan drafts.
  - Sidebar, home, onboarding, aliases, and system graph derive feature identity from the canonical FeatureDefinition projection.
  - SKU Pipeline calls a closed typed operation registry; an unregistered operation cannot proxy an arbitrary MCP tool.
  - Canonical and legacy tool URLs share one executor, with equivalent typed success/error, audit, trace, timeout, Gate, and compatibility telemetry semantics.
  - Non-owner metric writers append observations and collisions but cannot overwrite the canonical value.
  - A retirement report blocks physical deletion when exclusive usage, checksum, attachment, setting, secret reauthorization, Host smoke, restore, or 14-day evidence is incomplete.
