risks:
- id: RSK-S7-FACTUALITY
  description: The command center could manufacture a complete graph or hide partial collectors.
  mitigation: Render only immutable snapshot/runtime events, preserve source results and unknown states, and test missing/partial/error projections.
- id: RSK-S11-REGRESSION
  description: Registry and SKU Pipeline convergence could break historical routes or a production step.
  mitigation: Retain aliases, migrate a closed operation registry, run type, component, and one-step browser tests, and reject arbitrary tool names.
- id: RSK-S12-DATA
  description: Metric ownership could silently discard or overwrite a competing writer.
  mitigation: Append every observation, persist collisions, preserve the canonical reader, and test owner/non-owner behavior on PostgreSQL.
- id: RSK-S13-LOSS
  description: Premature retirement could lose client history, attachments, settings, or secret access.
  mitigation: This contract cannot delete; it emits a fail-closed report requiring checksums, reauthorization, Host/restore smoke, and 14-day evidence.
- id: RSK-S14-BLOCKING
  description: Expanding deterministic policy could block unrelated historical debt.
  mitigation: Ratchet only validated P0 issue codes and compare the changed-path baseline in CI fixtures.
out_of_scope:
- Physical deletion, uninstall, archive, or modification of E:/agent/omni-desktop or any client/user data.
- Applying migrations to the canonical/shared database or changing a running canonical service.
- Exporting, reading, logging, or migrating keytar secrets; only reauthorization status may be recorded.
- External publishing, paid model calls, visible browser login, or configured provider execution.
- P1 free-form graph layout editing and an optional final Electron thin-shell decision.
rollback:
  strategy: Revert the candidate commit; keep legacy URL adapters, desktop fallback, canonical metric reader, and historical migrations intact. New additive tables can remain unused or be removed only by a later separately reviewed cleanup migration.
  data_recovery: Runtime events, graph snapshots, metric observations/collisions, and compatibility telemetry are append-only. No existing row or external asset is deleted, and disposable verification databases are released after tests.
