compatibility:
  api:
    status: compatible
    strategy: New clients use the typed canonical execution and graph routes; legacy per-tool and catalog URLs remain adapters over the same executor and emit deprecation telemetry.
  database:
    status: compatible
    strategy: Migrations 101-103 only add schemas, tables, indexes, and views through scripts/apply_migrations.py; no historical migration is renamed or edited and no shared database is touched by this change.
  workflow:
    status: compatible
    strategy: Existing plan, tool, metric reader, Web chat, WeCom, and desktop fallback states remain readable; new writes use runtime trace, owner observations, and compatibility telemetry.
  data_source:
    status: compatible
    strategy: Collectors and Scout sources retain raw evidence; unavailable dynamic sources remain unknown and non-owner metric attempts are preserved as observations/collisions rather than dropped.
