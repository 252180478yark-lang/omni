risk:
  level: R2
  contract_profile: full
  reasons:
  - Adds additive migrations, authenticated REST and MCP contracts, a persistent graph repository, a canonical tool executor, metric ownership, and repository-wide deterministic policy.
  - Converges navigation and SKU Pipeline operations while retaining aliases and compatibility telemetry.
  - Imports the already verified S8-S10 runtime/Host candidate onto the S4-S6 baseline without running a shared migration or invoking a configured provider.
  - Prepares S13 retirement evidence but deliberately excludes physical client or data deletion, shared-database migration execution, secrets, and external publication.
  external_effects: []
  scope_deltas:
  - id: DELTA-001
    discovered_at: '2026-08-01T15:08:00Z'
    reason: HealthRegistry still parsed visible href literals from TypeScript; S11 projection makes generated FeatureDefinition JSON the only valid discovery source.
    added_paths:
    - services/knowledge-engine/app/services/health_registry.py
    required_level: R2
    risk_change: none; replaces source scanning with the already locked canonical projection.
  - id: DELTA-002
    discovered_at: '2026-08-01T15:34:00Z'
    reason: The repository already owns the canonical implementation-status generator under a different name, and S14 needs one deterministic health-baseline generator plus the disposable PostgreSQL verifier named in VER-006.
    added_paths:
    - scripts/generate_implementation_status.py
    - scripts/generate_fde_health_baseline.py
    - scripts/verify_s7_s14_runtime.ps1
    required_level: R2
    risk_change: none; these are deterministic projection and disposable verification paths with no shared-runtime mutation.
  - id: DELTA-003
    discovered_at: '2026-08-01T15:06:00Z'
    reason: Verification must isolate the two Python services that both use the top-level app package, and MCP registration needs an explicit database-free doctor mode.
    added_paths:
    - services/knowledge-engine/app/mcp/doctor.py
    required_level: R2
    risk_change: none; the normal runtime doctor remains unchanged and registry-only mode performs read-only import checks.
  - id: DELTA-004
    discovered_at: '2026-08-01T15:14:00Z'
    reason: Strict index verification exposed imported S8-S10 BFF, Scout registration, and existing regression-test paths that were implemented but missing from the planned path globs.
    added_paths:
    - frontend/src/app/api/omni/host-bridge/**
    - frontend/src/app/api/omni/runtime-findings/route.ts
    - frontend/src/app/api/omni/runtime-plan-drafts/route.ts
    - frontend/src/app/api/omni/runtime-traces/**
    - frontend/tests/approval-ws-authorization.test.ts
    - frontend/tests/system-graph-plan.test.tsx
    - frontend/tests/system-health-overview.test.ts
    - services/knowledge-engine/tests/test_s7_s14_postgres.py
    - services/scout-agent/app/main.py
    required_level: R2
    risk_change: none; this records already implemented and verified paths without expanding behavior or external effects.
  - id: DELTA-005
    discovered_at: '2026-08-01T16:05:00Z'
    reason: Rebased before/after verification proved that scan_repository resolved request.ref only for the commit label while every collector still read the current worktree, allowing a false empty diff between different commits.
    added_paths:
    - services/knowledge-engine/app/services/system_graph/scanner.py
    - services/knowledge-engine/tests/test_system_graph_snapshots.py
    required_level: R2
    risk_change: none; the scanner will materialize the requested immutable Git tree for static collection and retain unknown semantics for unavailable dynamic sources.
  - id: DELTA-006
    discovered_at: '2026-08-01T16:24:00Z'
    reason: The S11 route convergence kept /system-graph as a compatibility page but the static frontend collector only scanned the new canonical page, incorrectly reporting the still-reachable candidate-plan BFF chain as removed.
    added_paths:
    - services/knowledge-engine/app/services/system_graph/collectors/frontend.py
    - services/knowledge-engine/config/features/system-convergence-s4-s6.yaml
    - services/knowledge-engine/tests/test_system_graph_collectors.py
