actual_changes:
- id: ACT-PROFILE-001
  planned_change_id: PROFILE-001
  summary: Forward the validated core/content/full profile through start, verify and stop allocation acquisition; verify only the selected tier, probe nginx only for full, and boundedly wait up to the validated health timeout for asynchronous startup.
  paths:
  - scripts/dev-start-mac.sh
  - scripts/dev-stop-mac.sh
  - scripts/verify-mac-recovery.sh
- id: ACT-PROFILE-002
  planned_change_id: PROFILE-002
  summary: Add static regressions requiring all macOS lifecycle scripts to forward the profile and requiring the verifier's exact core/content/full service tiers.
  paths:
  - tests/test_dev_runtime_environment.py
contract_delta:
- description: Added a bounded service-readiness wait to the profile-aware verifier inside the already planned verification workflow.
  reason: The locked one-command live check reproduced a real race because dev-start-mac.sh intentionally returns while health checks still report starting.
  effect: Immediate start-and-verify now waits up to 120 seconds by default, rejects invalid timeout inputs, and still fails closed for missing, exited, dead, unhealthy or never-ready services.
  accepted: true
