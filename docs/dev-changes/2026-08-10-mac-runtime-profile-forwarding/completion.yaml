- id: PROFILE-VER-001
  command: PYTHONPATH=services/knowledge-engine services/knowledge-engine/.venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_dev_runtime_environment.py tests/test_runtime_allocation.py tests/test_compose_runtime_contract.py
  status: passed
  exit_code: 0
  evidence: 53 macOS lifecycle, immutable allocation, bounded readiness and exact Compose profile-projection tests passed in 7.09 seconds.
- id: PROFILE-VER-002
  command: bash -n scripts/dev-start-mac.sh scripts/dev-stop-mac.sh scripts/verify-mac-recovery.sh
  status: passed
  exit_code: 0
  evidence: All three modified macOS lifecycle scripts passed Bash syntax validation.
- id: PROFILE-VER-003
  command: OMNI_RUNTIME_PROFILE=content OMNI_CHANGE_ID=mac-runtime-profile-forwarding-live OMNI_OWNER=yk bash scripts/dev-start-mac.sh && OMNI_RUNTIME_PROFILE=content OMNI_CHANGE_ID=mac-runtime-profile-forwarding-live OMNI_OWNER=yk bash scripts/verify-mac-recovery.sh
  status: passed
  exit_code: 0
  evidence: The exact locked command acquired runtime_profile=content, started and verified eight manifest-owned services, read a 19,078,167-byte database with 158 tables, served the product read path, and returned system graph snapshot sha256:7cc58d430b1ba8911489afb218d7fe178c8d51a52b306b220988c9e6690afa7e with 187 nodes and 211 edges. The four dynamic-disabled or attestation-unsupplied collectors remained explicitly unknown rather than being misreported missing.
