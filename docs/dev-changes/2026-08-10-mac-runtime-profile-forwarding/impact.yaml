risk:
  level: R2
  contract_profile: full
  reasons:
  - macOS start, verify and stop workflows currently read a requested runtime profile but do not pass it into the immutable RuntimeAllocation boundary.
  - Correcting profile projection changes which isolated Docker services are started and verified, while preserving loopback ports, disposable databases and volumes.
  external_effects: []
  scope_deltas: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The macOS scripts silently acquire the manifest default core profile even when OMNI_RUNTIME_PROFILE is content or full. Verification also assumes the full service set for every profile, so content-mode acceptance is either incomplete or impossible.
  expected_outcome: Start, verify and stop forward the same validated profile into RuntimeAllocation; Docker Compose receives its projected COMPOSE_PROFILES; verification checks exactly the services and probes owned by that profile.
  user_visible_behavior:
  - OMNI_RUNTIME_PROFILE=content starts the core services plus video-analysis, livestream-analysis and scout-agent.
  - OMNI_RUNTIME_PROFILE=core verifies only the core service set, while full additionally verifies news, ad review and nginx.
  - Stop reacquires the same immutable profile and stops the matching runtime without deleting its database or volumes.
current_chain:
  nodes:
  - id: workflow:macos-runtime-start
    role: Shell launcher for an isolated local Docker runtime.
  - id: workflow:macos-runtime-verify
    role: Runtime and product-read acceptance verifier.
  - id: workflow:macos-runtime-stop
    role: Non-destructive stop workflow for the allocated runtime.
  - id: service:runtime-allocation-cli
    role: Immutable profile and resource allocation authority.
  - id: service:docker-compose-profile-projection
    role: Starts the service set selected by COMPOSE_PROFILES.
  edges:
  - from: workflow:macos-runtime-start
    to: service:runtime-allocation-cli
    relation: calls-without-requested-profile
  - from: workflow:macos-runtime-verify
    to: service:runtime-allocation-cli
    relation: calls-without-requested-profile
  - from: workflow:macos-runtime-stop
    to: service:runtime-allocation-cli
    relation: calls-without-requested-profile
  - from: service:runtime-allocation-cli
    to: service:docker-compose-profile-projection
    relation: projects-default-core
  evidence:
  - scripts/dev-start-mac.sh invokes runtime_allocation.py acquire without --runtime-profile and does not validate OMNI_RUNTIME_PROFILE.
  - scripts/verify-mac-recovery.sh and scripts/dev-stop-mac.sh validate RUNTIME_PROFILE but omit --runtime-profile from acquire.
  - Runtime allocation allocation-0927b3803f6f4716a36afe19770cec07 recorded runtime_profile=core after a start request with OMNI_RUNTIME_PROFILE=content; only the seven core containers exist.
  - config/runtime-manifest.yaml defines exact core, content and full service projections and RuntimeAllocation exports COMPOSE_PROFILES from the selected immutable profile.
