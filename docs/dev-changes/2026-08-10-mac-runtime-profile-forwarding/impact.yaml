risks:
- id: PROFILE-RISK-001
  description: Reacquiring an existing allocation with a different profile must fail closed rather than silently mutate it.
  mitigation: Keep RuntimeAllocation CAS semantics unchanged and test only that lifecycle scripts pass the requested profile.
- id: PROFILE-RISK-002
  description: A profile-specific verifier can accidentally skip a service that the manifest includes.
  mitigation: Derive script expectations in explicit core/content/full tiers and retain compose projection tests against the manifest truth.
- id: PROFILE-RISK-003
  description: Stopping a content/full runtime with an omitted or different profile can fail to resolve the allocation.
  mitigation: Forward the same validated profile in dev-stop-mac.sh and live-test the content lifecycle without deleting volumes.
out_of_scope:
- No changes to Dockerfiles, Compose service definitions, runtime-manifest profile membership, ports, databases, volumes or migration files.
- No account, login, cookie, RBAC, JWT, HMAC, bearer token or product credential behavior.
- No automatic deletion, volume removal, database recovery or cleanup of unrelated historical runtimes.
rollback:
  strategy: Revert the three shell-script changes and their regression test; stop the isolated candidate containers and release only the candidate allocation with CAS.
  data_recovery: No business data is migrated or deleted. Named candidate volumes remain recoverable after docker stop or code rollback.
