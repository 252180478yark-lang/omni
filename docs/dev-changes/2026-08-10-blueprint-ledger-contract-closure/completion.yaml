actual_changes:
- id: BLC-ACT-001
  planned_change_id: BLC-CHG-001
  summary: Replaced the two independent eight-second graph fetches with one bounded, configurable sixty-second reader while preserving 503/unavailable and abort error semantics.
  paths:
  - frontend/src/app/api/omni/system-graph/_graph-fetch.ts
  - frontend/src/app/api/omni/system-graph/snapshot/route.ts
  - frontend/src/app/api/omni/workbench/suggestions/route.ts
  - frontend/.env.example
  - frontend/tests/system-graph-snapshot-bff.test.ts
  - frontend/tests/workbench-suggestions-grounding.test.ts
- id: BLC-ACT-002
  planned_change_id: BLC-CHG-002
  summary: Made the first snapshot read single-flight, moved repository scanning off the async loop, persisted the immutable cold scan, and covered persistence plus concurrent readers.
  paths:
  - services/knowledge-engine/app/routers/system_graph.py
  - services/knowledge-engine/tests/test_system_graph_router.py
- id: BLC-ACT-003
  planned_change_id: BLC-CHG-003
  summary: Reconstructed fourteen live GitHub delivery receipts, captured before/after ownership and migration evidence, and regenerated the PRD ledger from verified delivery facts.
  paths:
  - docs/dev-changes/2026-08-10-blueprint-ledger-contract-closure/delivery-recovery-manifest.yaml
  - docs/dev-changes/2026-08-10-blueprint-ledger-contract-closure/ownership-before.yaml
  - docs/dev-changes/2026-08-10-blueprint-ledger-contract-closure/ownership-after.yaml
  - docs/dev-changes/2026-08-10-blueprint-ledger-contract-closure/migration-baseline-evidence.json
  - docs/prds/2026-07-29-omni-fde-system-convergence-master-prd/implementation-status.yaml
- id: BLC-ACT-004
  planned_change_id: BLC-CHG-004
  summary: Removed duplicate attestation downloads, added bounded parallel provenance verification and memoization, retained atomic zero-write-on-failure recovery, and kept legacy v1 delivery receipts recoverable.
  paths:
  - scripts/generate_implementation_status.py
  - scripts/rebuild_delivery_receipts.py
  - tests/test_implementation_status.py
  - tests/test_delivery_receipt_rebuild.py
- id: BLC-ACT-005
  planned_change_id: BLC-CHG-005
  summary: Added an explicit opt-in bounded live-provenance refresh to readiness so externally delivered contracts release active ownership without weakening the offline SessionStart default.
  paths:
  - scripts/check_development_readiness.py
  - tests/test_development_readiness.py
contract_delta:
- description: Verify the current-source frontend and Knowledge Engine through isolated candidate images attached read-only to the accepted full-runtime dependencies.
  reason: Rebuilding the existing accepted runtime in place would mutate another acceptance run and its immutable build labels; a second overlapping RuntimeAllocation was correctly unavailable while that write lease remained active.
  effect: Two exact candidate images were built, exercised on private ports 32235/32239, and their temporary containers were removed; the existing full runtime was neither rebuilt nor stopped.
  accepted: true
verification_results:
- id: BLC-VER-001
  command: cd frontend && npx vitest run tests/system-graph-snapshot-bff.test.ts
  status: passed
  exit_code: 0
  evidence: Snapshot BFF success, bounded timeout configuration and abort/error behavior passed as part of the two-file six-test run.
- id: BLC-VER-002
  command: cd frontend && npx vitest run tests/workbench-suggestions-grounding.test.ts
  status: passed
  exit_code: 0
  evidence: Suggestions grounding preserved sufficient and unavailable semantics; the combined BFF run passed 2 files and 6 tests in 0.51s.
- id: BLC-VER-003
  command: uv run --project services/knowledge-engine --extra dev python -B -m pytest -q -p no:cacheprovider services/knowledge-engine/tests/test_system_graph_router.py services/knowledge-engine/tests/test_system_graph_s7_router.py
  status: passed
  exit_code: 0
  evidence: 5 tests passed in 20.74s, including cold persistence, concurrent single-flight readers and existing S7 refresh behavior.
- id: BLC-VER-004
  command: uv run --with pyyaml python scripts/rebuild_delivery_receipts.py --manifest docs/dev-changes/2026-08-10-blueprint-ledger-contract-closure/delivery-recovery-manifest.yaml --dry-run
  status: passed
  exit_code: 0
  evidence: All 14 manifest entries passed live GitHub run, artifact, digest, evidence and reachability checks within the shared deadline; dry-run performed no cache writes.
- id: BLC-VER-005
  command: uv run --with pyyaml python scripts/check_development_readiness.py --json --refresh-live-provenance --live-timeout-seconds 60
  status: passed
  exit_code: 0
  evidence: 31 contracts were evaluated; only this VERIFYING contract remained active, with zero active-pattern overlaps and zero contract errors. Secret scan passed; unrelated linked-worktree ownership and current-user hook trust remained explicit warnings.
- id: BLC-VER-005A
  command: docker exec omni-prd-v12-main-full-accept-52866f3f-knowledge-engine-1 bash -c 'cd /app && PYTHONPATH=/app python scripts/p0_baseline_preflight.py'
  status: passed
  exit_code: 0
  evidence: Baseline status ready with no blockers; repository count 87 and runtime ledger count 95 share migration 104 head checksum 4e99b93e156ea4eb45f4efc1b0d9fefc7f26036571be96e6c0c074a0162b4b04.
- id: BLC-VER-006
  command: python3 scripts/check_agent_policy.py --require-tracked
  status: passed
  exit_code: 0
  evidence: AGENTS policy passed at 13741/16384 bytes with valid dynamic totals, Skill references and tracked routed assets; git diff --check also exited zero.
- id: BLC-VER-007
  command: curl --fail --max-time 60 http://127.0.0.1:23604/api/omni/system-graph/snapshot
  status: passed
  exit_code: 0
  evidence: Candidate KE image sha256:6bd6962 and frontend image sha256:4f8c382 returned snapshot HTTP 200 in 1.594s then 0.024s/0.020s; ten parallel reads were all 200 with one snapshot ID, and suggestions returned HTTP 200 with evidenceState=sufficient. Existing full runtime was untouched.
- id: BLC-VER-008
  command: uv run --with pytest --with pyyaml pytest -q tests/test_delivery_receipt_rebuild.py tests/test_implementation_status.py
  status: passed
  exit_code: 0
  evidence: The combined delivery recovery, projection and readiness suite passed 69 tests in 21.00s.
- id: BLC-VER-009
  command: uv run --with pytest --with pyyaml pytest -q tests/test_development_readiness.py
  status: passed
  exit_code: 0
  evidence: Readiness tests passed in the 69-test governance run, covering opt-in live refresh, offline fail-closed behavior, timeout handling and delivered-owner release.
