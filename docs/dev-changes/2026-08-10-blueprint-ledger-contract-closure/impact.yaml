  evidence:
  - Both frontend graph readers currently use AbortSignal.timeout(8000), while the repository recovery verifier already budgets sixty seconds for a graph read.
  - A direct live Knowledge Engine cold snapshot read took approximately 24.49 seconds.
  - The read router scans the repository when latest_snapshot is absent but does not save the result; the refresh path does save it.
  - The Git common verified-receipts cache is empty, and the tracked W0 recovery manifest lists only four deliveries through 2026-08-01.
