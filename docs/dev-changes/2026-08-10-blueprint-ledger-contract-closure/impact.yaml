risk:
  level: R2
  contract_profile: full
  reasons:
  - The fix changes the Web BFF timeout contract, Knowledge Engine cold-read persistence, and the evidence inputs used to assign cross-worktree contract ownership.
  - A false success in either graph or delivery projection would hide unavailable runtime state or incorrectly release an active path owner.
  external_effects: []
  scope_deltas:
  - id: BLC-DELTA-001
    discovered_at: '2026-08-10T02:05:00+08:00'
    reason: The first real six-receipt recovery exhausted the single sixty-second live-provenance deadline because every attestation artifact was downloaded once for manifest hash validation and a second time inside live_github_provenance. The final receipt correctly failed closed even though its workflow and artifacts remained valid.
    added_paths:
    - scripts/generate_implementation_status.py
    - scripts/rebuild_delivery_receipts.py
    - tests/test_implementation_status.py
    - tests/test_delivery_receipt_rebuild.py
    required_level: R2
    risk_change: Reuse only the already downloaded, raw-SHA-verified authoritative attestation payload during the same recovery call; continue to query live run/artifact/evidence provenance and keep the shared sixty-second deadline.
  - id: BLC-DELTA-002
    discovered_at: '2026-08-10T02:10:00+08:00'
    reason: After rebuilding the shared cache, the readiness report still retained every delivered contract because its API never accepts a provenance verifier and intentionally calls ownership in offline fail-closed mode. Supplying --attestation changes paths only and therefore cannot ever establish delivery.
    added_paths:
    - scripts/check_development_readiness.py
    - tests/test_development_readiness.py
    required_level: R2
    risk_change: Add an explicit opt-in live refresh flag with one bounded deadline; preserve the fast offline fail-closed default and SessionStart behavior.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The system blueprint intermittently fails because two BFF readers abort after eight seconds while an empty Knowledge Engine snapshot repository performs a roughly twenty-four-second synchronous repository scan on every read. Separately, the shared verified-receipt cache is empty and its versioned recovery manifest omits the two latest main deliveries, so the PRD ledger and workspace ownership projection treat delivered schema-v3 contracts as active.
  expected_outcome: The first truthful graph read may perform one bounded repository scan and persist its immutable result, later reads reuse the stored snapshot, both Web consumers share a configurable sixty-second default timeout, and the PRD ledger/readiness inventory is regenerated only from provenance-verified CI receipts.
  user_visible_behavior:
  - Opening the blueprint after a cold start returns the real snapshot instead of an eight-second 502, while genuine upstream failures remain explicit errors.
  - Subsequent blueprint and grounded-suggestion reads avoid repeated full-repository scans.
  - Progress and contract ownership exclude only contracts proven delivered by immutable, reachable main CI attestations; unresolved work remains active.
