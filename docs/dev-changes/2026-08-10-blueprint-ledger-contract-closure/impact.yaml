compatibility:
  api:
    status: compatible
    strategy: Response schemas and error status semantics remain unchanged; only the bounded upstream wait and cold-read implementation change.
  database:
    status: compatible
    strategy: Reuse the existing immutable snapshot repository and tables; no migration or record mutation is introduced beyond idempotent snapshot insertion.
  workflow:
    status: compatible
    strategy: Delivery remains CI-attestation authoritative; the versioned manifest only reconstructs the non-authoritative shared cache and never sets COMPLETE itself.
  data_source:
    status: compatible
    strategy: Repository scan and GitHub Actions attestation sources are unchanged and continue to fail closed when unavailable or unverifiable.
