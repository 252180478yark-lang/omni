risks:
- id: BLC-RISK-001
  description: A longer BFF timeout without persistence would only hide repeated cold scans.
  mitigation: Persist the first scan idempotently and test that the next read uses latest_snapshot without rescanning.
- id: BLC-RISK-002
  description: Reconstructed receipt files could be forged or refer to an unreachable/non-main commit.
  mitigation: Reuse live GitHub provenance, artifact digest, raw payload hash, committed contract, target ref, and reachability verification before atomically caching.
- id: BLC-RISK-003
  description: Concurrent cold reads could duplicate expensive scans.
  mitigation: Use a process-local single-flight lock with a second latest_snapshot check and immutable repository idempotency.
- id: BLC-RISK-004
  description: Skipping the recovery verifier's second artifact download could accidentally trust local cache or manifest content.
  mitigation: The optimization accepts only the exact payload already downloaded from the declared live artifact and matched against the committed manifest raw SHA; live run, artifact, evidence digest, target branch, reachability, contract and required-check verification remain mandatory.
- id: BLC-RISK-005
  description: Making network provenance implicit in SessionStart would add latency and let transient GitHub failures destabilize every task.
  mitigation: Keep readiness offline by default; require an explicit manual live-refresh flag, share one maximum sixty-second budget, and leave unverifiable receipts active.
out_of_scope:
- No new product account, credential, RBAC, token, migration, destructive graph operation, or external publication.
- Desktop W6 product files belong to a separate omni-desktop schema-v3 contract; this contract only refreshes the main-repository ledger and ownership truth.
- Existing unrelated dirty worktrees and runtime bridge identity drift are reported truthfully but not modified.
rollback:
  strategy: Revert the BFF helper/router and Knowledge Engine cold-read changes; delete only this task's reconstructed cache files if needed, then regenerate the projection from the remaining verified receipts.
  data_recovery: Existing graph snapshots are immutable and content-addressed, so rollback requires no destructive database recovery; generated ledger/cache artifacts can be deterministically rebuilt from CI artifacts.
