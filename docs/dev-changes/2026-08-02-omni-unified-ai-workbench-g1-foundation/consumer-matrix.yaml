schema_version: 1
foundation_change_id: 2026-08-02-omni-unified-ai-workbench-g1-foundation
base_commit: 16d3855a9ffac4db8957bbf562ace1f3f0c2eb5f
authority:
  contract_schema: config/schemas/workbench-foundation.v1.schema.json
  python_mirror: services/knowledge-engine/app/schemas/workbench_foundation.py
  typescript_mirror: frontend/src/lib/workbench/contracts.ts
  migration: migrations/104_workbench_context_and_agent_binding.sql
contracts:
- name: WorkbenchContextSnapshot
  owner: G1-foundation
  consumers: [W1, W3, W5]
  rule: Immutable object/task/permission binding; origin_surface_ref is provenance only, while current surface belongs to FrontendAgentBinding.
- name: FrontendAgentBinding
  owner: G1-foundation
  consumers: [W1, W3, W5]
  rule: Surface changes retain session, operation, Host current-head revision, and cursor; object/task/permission changes advance only the Host-owned current head through single-writer CAS and never retarget the accepted session anchor or an existing operation.
- name: ResolvedAgentProvider
  owner: G1-foundation
  consumers: [W5, W6]
  rule: Resolution is disclosed before ACTIVE; provider and runner mode are immutable after accepted_at.
- name: OpaqueProjectIdentity
  owner: G1-foundation
  consumers: [W5, W6]
  rule: Public boundaries expose only project_handle, project_hash, and display_name; raw project_dir remains Host-internal.
- name: HostCapabilityManifest
  owner: G1-foundation
  consumers: [W5, W6]
  rule: Protocol/build compatibility and provider/file/resume capabilities gate local actions.
- name: AgentArtifactProjection
  owner: G1-foundation
  consumers: [W1, W3, W5]
  rule: Read-only metadata is derived from existing attachments, runtime events, or formal asset lineage; it is not a second artifact writer and contains no path or raw payload.
- name: RunOperationProjection
  owner: G1-foundation
  consumers: [W3, W5]
  rule: Maps existing runtime and approval truth sources; context_snapshot_id plus context_revision is the frozen target pair selected when the operation starts. Legacy projections require both fields to be explicit null, every new W5 operation requires both a non-null snapshot and positive persisted revision, and Host runs remain attempts rather than a second operation.
- name: RunEventProjection
  owner: G1-foundation
  consumers: [W3, W5]
  rule: Cursor/event/checkpoint projection is normalized and redacted; no new event ledger is created by G1.
- name: WorkbenchIAProjection
  owner: G1-foundation
  consumers: [W1, W2, W3, W5, W6]
  rule: One feature_id, owner, renderer, canonical route, and alias projection; Feature Registry remains the capability source of truth.
- name: WorkbenchExtensionSlot
  owner: G1-foundation
  consumers: [W1, G2]
  rule: Slots are exactly assistant, blueprint, run-center, approval, and artifact-drawer.
context_binding_semantics:
  version: g2-v1
  session_security_anchor:
    authority: mcp.agent_session_contracts.context_snapshot_id
    purpose: Provider-acceptance and security anchor for the logical session.
    writer: Agent session provider-acceptance owner.
    mutation: Immutable once non-null; provider acceptance rechecks and freezes the same value.
    prohibited_use: Do not mutate this column to represent a later page or business-object rebind.
  host_current_head:
    authority: FrontendAgentBinding.context_snapshot_id+context_revision
    purpose: Current canonical context revision for new work in the same logical session.
    writer: Host single writer only; frontend and Knowledge Engine are requesters or projections, never co-writers.
    mutation: Compare-and-swap requires expected context_snapshot_id and context_revision and advances only to the canonical next revision.
    persistence: Host implementation detail; G2 adds no database column, table, or migration.
  operation_frozen_target:
    authority: mcp.runtime_executions.context_snapshot_id
    projection: RunOperationProjection.context_snapshot_id
    revision_projection: RunOperationProjection.context_revision
    revision_source: W5 HostRun.context_revision
    purpose: Snapshot and revision selected from the Host current head when one operation starts.
    writer: Existing runtime execution writer at operation creation.
    mutation: The snapshot/revision pair is immutable; resume, approval wait, retry, and recovery retain both original values.
    legacy_rule: Pre-W5 operations require context_snapshot_id and context_revision to be explicit null rather than borrowing the session current revision.
    new_w5_rule: Every new W5 operation requires non-null context_snapshot_id and positive context_revision from its persisted HostRun.
  invariants:
  - Advancing the Host current head never changes the accepted session security anchor.
  - Advancing the Host current head never retargets an existing runtime execution.
  - A FrontendAgentBinding.operation_id may select an older operation whose RunOperationProjection context differs from the current Host head.
  - Every new operation freezes exactly the Host snapshot and revision accepted at its start boundary.
  - Restart projection never combines an operation snapshot with a different session revision.
  - 'RunOperationProjection context_snapshot_id and context_revision are an iff pair: both null for legacy or both non-null for a new W5 operation.'
write_ownership:
  foundation:
  - config/schemas/workbench-foundation.v1.schema.json
  - frontend/src/lib/workbench/contracts.ts
  - services/knowledge-engine/app/schemas/workbench_foundation.py
  - migrations/104_workbench_context_and_agent_binding.sql
  compatibility_only:
  - services/knowledge-engine/app/services/agent_contracts.py
  - services/knowledge-engine/tests/test_agent_contracts.py
  verification_only:
  - scripts/verify_workbench_g1_migration.ps1
  boundaries:
    session_contract_token: workbench.v1
    compatibility_rule: G1 keeps the legacy ten-column session projection readable after migration 104 but does not adopt or write new workbench fields.
    handoff_rule: W5 may extend the same service from the delivered G1 baseline; it must consume the frozen workbench.v1 fields and must not create a parallel session writer.
  lane_restrictions:
    W1: consume_only
    W3: consume_only
    W5: consume_only
    W6: consume_only
migration:
  baseline_head: 103_metric_ownership_and_compatibility.sql
  owner: G1-foundation
  mode: additive_source_only
  shared_database_execution: forbidden_without_separate_R3_gate
  creates:
  - mcp.workbench_context_snapshots
  extends:
  - mcp.agent_session_contracts
  - mcp.runtime_executions
  - mcp.approval_operations
  explicitly_does_not_create:
  - second_agent_session_table
  - second_operation_table
  - second_event_table
  - second_artifact_writer
handoff:
  contract_changes_after_delivery: Stop the consuming lane and route a contract delta through the serial G2 Integration owner.
  required_delivery: Main-branch CI attestation bound to the immutable G1 commit and tree.
