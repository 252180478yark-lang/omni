contract_delta:
- description: Added a deterministic disposable PostgreSQL verifier to the locked G1 scope.
  reason: Independent review proved static migration checks could not execute the clean, existing, restart, checksum-parity, legacy-row, and immutability-trigger acceptance required by the W0 G1 gate.
  effect: G1-CHG-007 and G1-VERIFY-008 now require an isolated temporary PostgreSQL container; no shared database is addressed or mutated.
  accepted: true
- description: Corrected the frontend typecheck command to name the repository's frontend tsconfig explicitly.
  reason: npm exec preserves the repository working directory even with --prefix, so the locked command without -p printed TypeScript help and exited 1 instead of compiling the frontend.
  effect: G1-VERIFY-004 now runs the same strict TypeScript compiler against frontend/tsconfig.json without changing product scope.
  accepted: true
- description: Added a minimal explicit-column compatibility projection for the legacy database session store.
  reason: Migration 104 adds nullable columns, while the existing SELECT and RETURNING star queries pass every column into an extra-forbid legacy record and would fail immediately after upgrade.
  effect: G1-CHG-008 preserves existing get/upsert behavior without adopting or writing new W5 fields; the disposable PostgreSQL verifier exercises the post-104 path.
  accepted: true
- description: Aligned locked projection details with the PRD and existing runtime truth sources during independent review.
  reason: The PRD names safe_diff_summary, existing runtime rows do not all carry an idempotency digest, and the current FeatureDefinition route contract rejects query and fragment characters.
  effect: Artifact projection uses safe_diff_summary, idempotency_key_hash remains a required wire key with a nullable legacy value and an additive runtime column, and IA routes share the existing route grammar.
  accepted: true
- description: Hardened JSON, Python, and PostgreSQL validation to one path-safe and migration-compatible contract.
  reason: Review and live request modeling exposed RFC3339 parsing, raw reference encodings, whitespace, uniqueness, lineage, and once-set binding cases that static field-name parity alone did not cover.
  effect: Public payloads accept timezone-bearing JSON timestamps while rejecting raw absolute paths, and migration 104 enforces the same safe refs, reason codes, evidence uniqueness, display names, self-parent, provider, runtime, and approval immutability invariants.
  accepted: true
- description: Sequenced the Git-derived index check after the GRAPH_DIFF_READY transition while retaining it as a mandatory local release action.
  reason: check_feature_contracts index mode intentionally rejects schema-v3 contracts in VERIFYING, while the state transition validator cannot advance when a required verification result is absent, creating a circular Gate if the index check itself is marked required.
  effect: G1-VERIFY-006 is schema-optional like the W0 precedent, but this candidate is not committed or pushed unless the exact staged-index command passes and is recorded.
  accepted: true
