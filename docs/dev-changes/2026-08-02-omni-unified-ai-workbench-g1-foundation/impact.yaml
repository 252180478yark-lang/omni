compatibility:
  api:
    status: compatible
    strategy: G1 defines additive versioned payload contracts only; no existing route is changed. W5 and later integration lanes must explicitly adopt the v1 wire fields without creating parallel APIs.
  database:
    status: compatible
    strategy: Migration 104 adds one append-only context table and nullable columns/FKs/indexes to existing runtime, session, and approval tables. Existing rows remain valid, and the legacy session store explicitly projects its original columns so strict record parsing ignores additive fields; no table, column, event, session, operation, attachment, or artifact history is renamed or deleted.
  workflow:
    status: compatible
    strategy: Current session/runtime/approval workflows continue unchanged until their owning lanes opt into context and provider acceptance fields. Once provider_accepted_at is set, a database trigger rejects in-place provider, runner mode, context, lineage, or project identity mutation.
  data_source:
    status: not_applicable
    strategy: G1 adds no external source or credential flow.
