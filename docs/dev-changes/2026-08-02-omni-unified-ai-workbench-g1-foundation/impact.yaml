risks:
- id: G1-RISK-001
  description: Python and TypeScript mirrors could drift from the JSON Schema and let lanes disagree about field names or enums.
  mitigation: Export runtime field manifests in both mirrors and compare them with the same JSON Schema in required Python and Vitest parity tests.
- id: G1-RISK-002
  description: A new table or binding could accidentally become a second operation, event, session, or artifact writer.
  mitigation: Migration 104 creates only the immutable context store, extends existing truth sources, and the consumer matrix explicitly forbids parallel writers; artifact and run contracts remain read-only projections.
- id: G1-RISK-003
  description: A provider or page-context change after first run acceptance could silently retarget an active session.
  mitigation: The provider acceptance and context binding fields are nullable for legacy compatibility, while a database trigger makes provider, runner mode, context, lineage, and opaque project identity immutable after acceptance.
- id: G1-RISK-004
  description: A raw project path could be introduced into a supposedly shared public payload.
  mitigation: The public schema contains only project_handle, project_hash, and display_name; tests reject path-shaped display names and scan the schema/types for project_dir.
out_of_scope:
- Agent Chat, Host Bridge, provider command execution, provider event normalization, adoption of new context/artifact/session fields, or UI components; these belong to W5 after G1 delivery. G1 includes only the minimal explicit-column projection needed to keep the existing strict session store compatible with migration 104.
- AppShell, sidebar, Feature Registry, canonical route wiring, or top-level extension-slot rendering; these belong to W1/G2.
- A second operation/event table or runtime writer; W3 must project existing runtime_executions/runtime_events and approval_operations truth sources.
- A persistent agent_artifact_projection table; W5 must derive the read-only projection from existing attachment, runtime event, and formal asset lineage sources.
- Desktop files, renderer adoption, physical retirement, or AC-FR008-01; these belong to W6.
- Editing or publishing the untracked PRD v1.3 candidate in the canonical dirty worktree.
- Executing migration 104 against any shared database, adopting the schema in a shared runtime, or performing any R3 external effect.
rollback:
  strategy: Before delivery, revert only the G1 candidate commit. After an additive schema has been applied, disable downstream consumers and revert application code while retaining the context table and nullable columns; do not drop immutable history or rewrite migration 104.
  data_recovery: G1 writes no business rows and performs no shared migration. Disposable CI databases may be discarded; any future shared adoption retains additive rows and needs a separately authorized forward migration for schema removal.
