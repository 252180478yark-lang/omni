intent:
  problem: W0 is delivered, but the workbench lanes still lack one machine-readable authority for immutable context, provider resolution, safe project identity, artifact/run projections, IA ownership, and extension slots; W5 is forbidden from inventing those contracts or a shared migration inside its lane.
  expected_outcome: Deliver one versioned JSON Schema with parity-checked Python and TypeScript mirrors plus one additive migration that binds existing session/runtime/approval truth sources to immutable workbench context without adding a second operation, event, session, or artifact writer.
  user_visible_behavior:
  - G1 does not add or change a user-facing page by itself.
  - Downstream lanes receive stable context, provider, artifact, run, IA, Host capability, extension-slot, and opaque project identity contracts.
  - Historical sessions remain readable; new bindings can be adopted progressively without raw project paths crossing the Host boundary.
