risks:
- id: LOSS-RISK-001
  description: A quarantine could be mistaken for delivery or retirement.
  mitigation: Require explicit false completion/retirement fields, preserve unmerged_not_delivered, and never pass quarantine records into active scope exclusion.
- id: LOSS-RISK-002
  description: A later-restored object could remain hidden behind the quarantine.
  mitigation: Object availability takes precedence; any reappearing object must pass the original commit/state/hash binding and disables quarantine status.
- id: LOSS-RISK-003
  description: Self-authored worktree YAML could become authoritative.
  mitigation: Inventory exposes quarantines only from an immutable subject commit already verified by the existing external delivery resolver.
out_of_scope:
- Reconstructing or fabricating commit 8df227bc1be5dee02bea8006d596e30aae802539.
- Editing or rewriting the historical S8-S10 and supersession contracts.
- Marking the historical candidate COMPLETE, delivered, retired, or deleted.
- Resolving unrelated secret-scan, migration-runtime, Hook-trust, active-worktree, or external CI delivery gates.
rollback:
  strategy: Revert the quarantine commit; the original exact-object fail-closed behavior returns and no historical evidence or runtime data changes.
  data_recovery: Not applicable; the change adds a read-only governance interpretation and versioned record only.
