intent:
  problem: The historical S8-S10 candidate commit 8df227bc1be5dee02bea8006d596e30aae802539 is permanently unavailable from the original Windows repository, local objects, origin heads, pull refs, and direct fetch. A production test requires that object on every machine even though its handoff remains unmerged and not delivered.
  expected_outcome: A versioned, CI-attested quarantine records the exact missing candidate and expected hashes without reconstructing, retiring, or delivering it. Portable verification reports the loss explicitly; if the object reappears, normal hash binding becomes mandatory again.
  user_visible_behavior:
  - Ownership inventory exposes an evidence quarantine only after the quarantine contract itself has a trusted external delivery receipt.
  - The quarantine never removes an active source worktree, grants ownership, marks the historical candidate delivered, or authorizes retirement.
  - Before CI attestation the repository remains locally verified but not delivered.
current_chain:
  nodes:
  - id: state:historical-s8-s10-unmerged-candidate
    role: Unavailable commit recorded by the historical handoff as unmerged_not_delivered.
  - id: service:scripts.workspace_ownership.trusted_retirements
    role: Requires exact source Git blobs before a handoff can retire active ownership.
  - id: test:tests/test_workspace_ownership.py::test_production_s8_s10_handoff_hashes_bind_to_the_historical_git_blobs
    role: Currently requires the unavailable object unconditionally.
  edges:
  - from: test:tests/test_workspace_ownership.py::test_production_s8_s10_handoff_hashes_bind_to_the_historical_git_blobs
    to: service:scripts.workspace_ownership.trusted_retirements
    relation: verifies
  evidence:
  - docs/dev-changes/2026-08-04-s8-s10-supersession-handoff/impact.yaml records candidate 8df227bc1be5dee02bea8006d596e30aae802539, both source hashes, and unmerged_not_delivered.
  - docs/dev-changes/2026-08-07-prd-receipt-cache-rebuild/completion.yaml records that local and direct-origin recovery failed and explicitly deselects the single object-dependent test.
  - User confirmed on 2026-08-10 that the original Windows source can no longer be recovered and authorized direct fail-closed repair.
