compatibility:
  api:
    status: not_applicable
    strategy: No HTTP, MCP, IPC, or frontend contract changes.
  database:
    status: not_applicable
    strategy: No database, migration, or persistent business data changes.
  workflow:
    status: compatible
    strategy: Existing exact-hash retirement remains unchanged. The additive quarantine has no ownership or delivery effect, requires its own CI attestation for inventory reporting, and automatically stops applying if the candidate object becomes available.
  data_source:
    status: compatible
    strategy: Git object lookup remains local and read-only; no remote response or mutable external state is trusted as delivery evidence.
