risk:
  level: R2
  contract_profile: full
  reasons:
  - The merge composes a macOS container-recovery runtime with frontend, BFF, Knowledge Engine, runtime-profile and local-owner changes from a divergent branch.
  - Four conflict resolutions must preserve both loopback single-user trust and the existing macOS Docker entrypoint without reviving identity-service or internal credentials.
  - Existing v3 contracts have different immutable bases, so their commit lineage and unique path ownership must remain intact for final commit-mode validation.
  external_effects: []
  scope_deltas:
  - id: INT-DELTA-001
    discovered_at: '2026-08-09T14:03:00Z'
    reason: Merge inspection proved the existing macOS scripts assume the retired full-stack service set, do not pass runtime_profile to RuntimeAllocation, always print Nginx, and verification still requires identity-service. The new core/content/full projection would therefore make the supported macOS entrypoint fail or report false endpoints.
    added_paths:
    - scripts/dev-start-mac.sh
    - scripts/dev-stop-mac.sh
    - scripts/verify-mac-recovery.sh
    required_level: R2
    risk_change: Compatible workflow repair. Default macOS startup becomes the slim content profile; core/full remain explicit and all ports stay loopback-bound.
  - id: INT-DELTA-002
    discovered_at: '2026-08-09T14:16:56Z'
    reason: Live verification proved two deterministic false negatives. RuntimeAllocation hashes `.planning` evidence even though it does not alter runnable source, so recording verification evidence invalidates the active allocation. The recovery verifier also applies recovered-data thresholds to every isolated allocation even though the supported start script intentionally creates a fresh disposable database.
    added_paths:
    - scripts/runtime_allocation.py
    - tests/test_runtime_allocation.py
    required_level: R2
    risk_change: Compatible verification repair. Planning-only edits stop invalidating runnable source identity; strict recovered-data thresholds remain available only when explicitly requested, while default isolated-runtime verification reports typed empty or populated data without weakening service health checks.
  - id: INT-DELTA-003
    discovered_at: '2026-08-09T14:33:19Z'
    reason: Live BFF verification reproduced the owner-facing system-graph 500. The read-only repository bind contains a linked-worktree `.git` pointer to a host-only administrative path, so `git -C /workspace rev-parse HEAD` fails even though repository files and the allocation's immutable `OMNI_SOURCE_COMMIT` are present.
    added_paths:
    - services/knowledge-engine/app/services/system_graph/canonical.py
    - services/knowledge-engine/tests/test_system_graph_canonical.py
    required_level: R2
    risk_change: Compatible read-path recovery. HEAD resolution may use the validated allocation commit only when linked-worktree metadata is unavailable; evidence blobs continue to use Git's canonical hash-object algorithm without repository discovery. Explicit non-HEAD refs still fail closed.
  - id: INT-DELTA-004
    discovered_at: '2026-08-09T14:47:00Z'
    reason: During the graph-fix rebuild, an independent research workflow created 121 MB of reports and previews under the repository's top-level `outputs/` directory. RuntimeAllocation treated these generated artifacts as runnable source and rejected verification even though no runtime file changed after the image build.
    added_paths: []
    required_level: R2
    risk_change: Compatible source-identity refinement within INT-004. Exclude only the top-level `outputs/` artifact tree, matching existing docs/planning/output/export exclusions; nested runnable directories with the same name remain fingerprinted.
  - id: INT-DELTA-005
    discovered_at: '2026-08-09T14:49:00Z'
    reason: Two content-profile rebuilds proved that `OMNI_BUILD_SOURCE_FINGERPRINT` is declared before apt/pip/Playwright installation in every Python service Dockerfile. A one-file source change therefore invalidates all dependency layers and caused repeated 8-10 minute ARM64 rebuilds across six services.
    added_paths:
    - services/infra-core/migrations/Dockerfile
    - services/knowledge-engine/Dockerfile
    - services/ai-provider-hub/Dockerfile
    - services/video-analysis/Dockerfile
    - services/livestream-analysis/Dockerfile
    - services/scout-agent/Dockerfile
    - tests/test_docker_build_cache_contract.py
    required_level: R2
    risk_change: Build-only compatible optimization. Move immutable build identity after expensive dependency installation but before runnable source COPY, retaining the same runtime ENV/labels while allowing dependencies to stay cached across source-only fingerprints.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The validated content/development frontend and single-user local-trust implementation exists only on a sibling branch, while the current macOS worktree contains a separate validated runtime-recovery candidate. A blind merge can overwrite recovery files, revive obsolete credentials, or leave conflicts and unverifiable contract ownership.
  expected_outcome: Both histories are composed on one local branch with the macOS recovery assets preserved, the content/development frontend and local-owner runtime present, four conflicts resolved according to the single-user/loopback contract, and deterministic evidence that the merged chain is ready for the separately contracted WebSocket scheme hardening pass.
  user_visible_behavior:
  - The canonical workspace retains the content-production surface and the development/system-graph surface from the convergence branch.
  - The local owner uses retained pages and BFF routes without product login, password, cookie or internal service token.
  - The macOS start, stop and recovery-verification scripts remain available after the merge.
  - macOS startup defaults to the content profile, while `OMNI_RUNTIME_PROFILE=core|content|full` selects the exact manifest-backed service set and verification never requires the retired identity service.
  - The development system graph remains readable from a linked macOS worktree mounted read-only into Docker; missing host-only Git administration paths no longer become an untyped 500.
  - Docker profiles remain loopback-bound and do not restore identity-service to the current runtime.
