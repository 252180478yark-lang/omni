risks:
- id: INT-RISK-001
  description: Resolving README or AGENTS conflicts toward either side alone could reintroduce product passwords or discard the supported macOS workflow.
  mitigation: Resolve both files semantically, then run policy and diff checks and inspect the final single-user/macOS sections.
- id: INT-RISK-002
  description: Resolving frontend/server.ts toward the macOS side alone could keep cookie authorization; resolving toward the target alone without review could weaken the known WebSocket scheme boundary.
  mitigation: Use target local-owner and OMNI_FRONTEND_HOST behavior for the merge, then establish an independent contract from the merge commit before hardening Origin scheme validation.
- id: INT-RISK-003
  description: Multi-base v3 contracts cannot be sealed by one index-mode base.
  mitigation: Preserve the original commits and contracts, validate each strict contract, and use commit mode against the final immutable HEAD without fabricating a CI run id.
- id: INT-RISK-004
  description: A profile-blind macOS verifier can falsely fail on absent optional services or falsely report a full-only Nginx endpoint.
  mitigation: Pass one validated runtime_profile into allocation, derive long-lived services from the versioned manifest, and probe Nginx only for full.
- id: INT-RISK-005
  description: Planning evidence written after startup can change the active allocation fingerprint even though no runnable source changed; conversely, relaxing all fingerprint inputs would allow stale binaries to be misreported as current.
  mitigation: Exclude only the repository `.planning` evidence tree, retain hashing for runnable tracked and untracked source, and add a regression test proving source changes still invalidate the fingerprint.
- id: INT-RISK-006
  description: A recovery-only data threshold can reject a healthy fresh isolated runtime, while removing the threshold entirely could hide a failed recovery audit.
  mitigation: Keep service, frontend and Knowledge Engine probes mandatory; report database/product counts in all modes; require the historical size and row thresholds only with explicit `OMNI_REQUIRE_RECOVERED_DATA=1`.
- id: INT-RISK-007
  description: Falling back from broken linked-worktree Git discovery too broadly could mislabel an arbitrary ref or generate non-canonical evidence hashes.
  mitigation: Permit fallback only for HEAD, require a 40-hex allocation source commit, retain failure for explicit refs, and use standalone `git hash-object --no-filters` for byte-identical blob IDs with regression tests.
- id: INT-RISK-008
  description: Generated report artifacts from concurrent local workflows can invalidate an otherwise identical runtime; a broad directory-name exclusion could also hide runnable source.
  mitigation: Exclude `outputs` only when it is the repository's first path segment and retain fingerprint coverage for all other untracked runnable paths; extend the content fingerprint regression test.
- id: INT-RISK-009
  description: Moving build identity too late could leave images without immutable runtime evidence; moving it after source COPY would not restore cache reuse.
  mitigation: Keep both ARG/ENV pairs in every content Python image, place them after the last dependency-install step and before the first runnable source COPY, and enforce ordering plus exact metadata names in a dedicated test.
out_of_scope:
- WebSocket Origin scheme hardening is intentionally implemented only after the merge commit under a new v3 contract whose base includes the target contracts.
- No external push, deployment, paid action, shared-library migration, hard deletion or Docker volume removal.
- No rewrite of historical v3 base commits or false transition of any repository contract to COMPLETE.
rollback:
