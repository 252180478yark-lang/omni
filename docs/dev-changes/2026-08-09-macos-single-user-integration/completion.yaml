actual_changes:
- id: ACT-INT-003
  planned_change_id: INT-003
  summary: Changed live macOS verification to manifest-backed service checks with an explicit strict recovered-data mode; the profile-aware start and stop bytes already exist at this contract's curated immutable baseline.
  paths:
  - scripts/verify-mac-recovery.sh
- id: ACT-INT-004
  planned_change_id: INT-004
  summary: Excluded only top-level planning and generated outputs evidence from runnable source identity so verification and concurrent report artifacts cannot invalidate an unchanged runtime, while retaining dirty runnable-source invalidation everywhere else.
  paths:
  - scripts/runtime_allocation.py
  - tests/test_runtime_allocation.py
- id: ACT-INT-005
  planned_change_id: INT-005
  summary: Recovered static system-graph scanning for read-only linked-worktree mounts by using the preflight-validated allocation commit for HEAD only and Git's standalone canonical blob hashing when host administration metadata is unavailable.
  paths:
  - services/knowledge-engine/app/services/system_graph/canonical.py
  - services/knowledge-engine/tests/test_system_graph_canonical.py
- id: ACT-INT-006
  planned_change_id: INT-006
  summary: Moved immutable build identity after apt, pip and Playwright dependencies but before runnable source in all six content Python images, with an ordering contract that prevents source fingerprints from invalidating expensive dependency layers.
  paths:
  - services/infra-core/migrations/Dockerfile
  - services/knowledge-engine/Dockerfile
  - services/ai-provider-hub/Dockerfile
  - services/video-analysis/Dockerfile
  - services/livestream-analysis/Dockerfile
  - services/scout-agent/Dockerfile
  - tests/test_docker_build_cache_contract.py
contract_delta:
- description: Released dev-start-mac.sh and dev-stop-mac.sh from final ownership while retaining verify-mac-recovery.sh.
  reason: Commit-mode evidence proved both start/stop scripts are byte-identical to the curated fa45bbe baseline, whereas the verifier changes after that baseline and remains an actual integration delta.
  effect: The contract owns only paths changed after its immutable delivery baseline; lifecycle behavior remains covered by retained runtime evidence without fabricating a diff.
  accepted: true
- description: Rebased the curated macOS integration contract onto the immutable recovery commit in this unified lineage and removed personal planning plus historical-contract composition from owned product scope.
  reason: The source branch contained unrelated tracked planning and non-ancestor commit identities; only runtime/profile, source identity, graph fallback and Docker cache repairs were authorized for mainline integration.
  effect: Every retained actual path is changed after an ancestor baseline, unrelated local artifacts stay out of the candidate, and historical feature contracts continue to own their own product paths.
  accepted: true
- description: Added profile-aware macOS start, stop and verification after merge discovery proved the previous scripts assumed the retired full runtime.
  reason: The supported content profile would otherwise omit services the verifier hardcoded as required and print endpoints that were not started.
  effect: macOS defaults to the eight-service content projection; core/full stay explicit and service checks come from the versioned manifest.
  accepted: true
- description: Narrowed source fingerprinting and separated ordinary runtime health from strict recovered-data thresholds.
  reason: Live execution proved `.planning` evidence invalidated an active allocation and a fresh disposable volume was falsely required to contain a 1GB recovered database.
  effect: Runnable source changes still invalidate allocations; planning-only evidence does not. All services and typed product stats remain mandatory, with strict recovery thresholds retained behind `OMNI_REQUIRE_RECOVERED_DATA=1`.
  accepted: true
- description: Added a narrow linked-worktree canonical-source fallback after live system-graph BFF verification returned 500 in Docker.
  reason: The read-only checkout's `.git` pointer targeted a host-only worktree administration directory, while RuntimeAllocation already supplied the immutable source commit.
  effect: HEAD and evidence blobs resolve without mounting extra host Git metadata; explicit refs remain Git-only and fail closed. The live BFF now returns 189 nodes and 213 edges.
  accepted: true
- description: Excluded the top-level generated `outputs/` tree from runnable source identity.
  reason: A concurrent research workflow created 121 MB of spreadsheet and preview artifacts during a build, invalidating an otherwise identical active runtime.
  effect: Top-level generated reports no longer invalidate allocations; nested runnable `outputs` directories remain covered and external artifacts are preserved untouched.
  accepted: true
- description: Reordered build identity in six content Python Dockerfiles.
  reason: Two source-only rebuilds repeatedly reinstalled apt, pip and Playwright layers for every content service because the fingerprint ENV preceded dependencies.
  effect: Runtime image evidence is unchanged, while subsequent source-only builds can reuse expensive dependency layers; a dedicated ordering test enforces the boundary.
  accepted: true
