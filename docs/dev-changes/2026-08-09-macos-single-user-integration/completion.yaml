contract_delta:
- description: Added profile-aware macOS start, stop and verification after merge discovery proved the previous scripts assumed the retired full runtime.
  reason: The supported content profile would otherwise omit services the verifier hardcoded as required and print endpoints that were not started.
  effect: macOS defaults to the eight-service content projection; core/full stay explicit and service checks come from the versioned manifest.
  accepted: true
- description: Narrowed source fingerprinting and separated ordinary runtime health from strict recovered-data thresholds.
  reason: Live execution proved `.planning` evidence invalidated an active allocation and a fresh disposable volume was falsely required to contain a 1GB recovered database.
  effect: Runnable source changes still invalidate allocations; planning-only evidence does not. All services and typed product stats remain mandatory, with strict recovery thresholds retained behind `OMNI_REQUIRE_RECOVERED_DATA=1`.
  accepted: true
- description: Added a narrow linked-worktree canonical-source fallback after live system-graph BFF verification returned 500 in Docker.
  reason: The read-only checkout's `.git` pointer targeted a host-only worktree administration directory, while RuntimeAllocation already supplied the immutable source commit.
  effect: HEAD and evidence blobs resolve without mounting extra host Git metadata; explicit refs remain Git-only and fail closed. The live BFF now returns 189 nodes and 213 edges.
  accepted: true
- description: Excluded the top-level generated `outputs/` tree from runnable source identity.
  reason: A concurrent research workflow created 121 MB of spreadsheet and preview artifacts during a build, invalidating an otherwise identical active runtime.
  effect: Top-level generated reports no longer invalidate allocations; nested runnable `outputs` directories remain covered and external artifacts are preserved untouched.
  accepted: true
- description: Reordered build identity in six content Python Dockerfiles.
  reason: Two source-only rebuilds repeatedly reinstalled apt, pip and Playwright layers for every content service because the fingerprint ENV preceded dependencies.
  effect: Runtime image evidence is unchanged, while subsequent source-only builds can reuse expensive dependency layers; a dedicated ordering test enforces the boundary.
  accepted: true
