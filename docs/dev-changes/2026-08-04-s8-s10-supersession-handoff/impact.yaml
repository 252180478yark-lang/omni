ownership_handoff:
  mode: retire_unmerged_candidate
  effective_when: this_contract_is_ci_attested
  source:
    change_id: 2026-08-01-system-convergence-s8-s10
    candidate_commit: 8df227bc1be5dee02bea8006d596e30aae802539
    required_state: GRAPH_DIFF_READY
    impact_sha256: 62ad4dd2ca63535ecec73af0f52ee11817ee1b75f1247d9f0636115a049d21b8
    completion_sha256: 6a3990ef74681ab4ba7dd8eb647b6051b7d7c6369ee39003a7e733cb02dcf81e
    delivery_status: unmerged_not_delivered
  successor:
    change_id: 2026-08-02-omni-unified-ai-workbench-w5
    ownership_effect: Source scope is retired; W5 remains independently active and is never auto-delivered or expanded.
    required_future_contract_delta:
      id: W5-DELTA-CANONICAL-ARTIFACT-TEST
      path: frontend/tests/agent-chat/unit/canonical-artifact-client.test.ts
      requirement: Before W5 stages canonical-artifact-client.ts, its own impact/completion delta must own this exact test path and a matching verification command.
  evidence_retention:
    retain_source_worktree: true
    retain_source_commit: true
    retain_source_contracts: true
    remove_paths: false
risks:
- id: RETIRE-RISK-001
  description: A local or mismatched record could hide an active historical owner.
  mitigation: Require a verified delivery receipt for this handoff, load its impact blob from the attested commit, and compare the historical candidate commit plus both contract hashes before retirement.
- id: RETIRE-RISK-002
  description: Retirement could be misconstrued as formal delivery of S8-S10.
  mitigation: Record unmerged_not_delivered explicitly, preserve all historical evidence, and expose retirement separately from delivered contracts.
- id: RETIRE-RISK-003
  description: W5 could silently inherit an untested canonical artifact client path.
  mitigation: Record the exact W5-owned future delta dependency without editing W5 or its test files.
out_of_scope:
- No change to any W5 dirty product file, its contracts, runtime allocation, database, Docker resource, or lease.
- No modification, deletion, commit rewrite, merge, or delivery claim for the historical S8-S10 candidate.
- No shared runtime adoption, migration, provider invocation, or Desktop retirement.
rollback:
  strategy: Revert the attested recovery commit to restore conservative active ownership for the historical candidate; no source evidence is deleted.
  data_recovery: Not applicable; the change only reads Git metadata and contracts.
verification_plan:
- id: RETIRE-VERIFY-001
  layer: unit
  command: python -m pytest tests/test_workspace_ownership.py -q
  proves: Attested exact-match retirement removes only the intended historical active scope; once the existing S7-S14 delivery is also verified, W5 is the unique active owner of its actual product path. Absent attestation, wrong commit, wrong hash, or dirty/mismatched source worktree remains blocking.
  required: true
- id: RETIRE-VERIFY-002
  layer: ownership-projection
  command: python -X utf8 scripts/workspace_ownership.py --current-only --secret-scope changed
  proves: Current worktree inventory reports retirement evidence separately and never mutates sibling worktrees.
  required: true
- id: RETIRE-VERIFY-003
  layer: contract
  command: python -X utf8 .agents/skills/omni-feature-development/scripts/dev_contract.py validate --impact docs/dev-changes/2026-08-04-s8-s10-supersession-handoff/impact.yaml --completion docs/dev-changes/2026-08-04-s8-s10-supersession-handoff/completion.yaml --expect-state GRAPH_DIFF_READY --strict
  proves: The R2 candidate has exact scope, executed evidence, retirement semantics, and graph closure before CI.
  required: true
