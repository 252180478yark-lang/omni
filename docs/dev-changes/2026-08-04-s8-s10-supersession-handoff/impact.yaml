compatibility:
  api:
    status: not_applicable
    strategy: No HTTP, WebSocket, MCP, or public contract changes.
  database:
    status: not_applicable
    strategy: No database, schema, migration, or runtime data change.
  workflow:
    status: compatible
    strategy: An old candidate remains active by default. It can be retired only after the handoff contract itself is attested and only when the exact historical commit and contract hashes match in a freshly clean source worktree; W5 delivery remains independent.
  data_source:
    status: compatible
    strategy: Reuses the existing CI-attestation provenance verifier and does not accept caller-supplied delivery or retirement assertions.
