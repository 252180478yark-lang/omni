  scope_deltas: []
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The stale 2026-08-01 S8-S10 GRAPH_DIFF_READY candidate still claims 48 W5 dirty product paths, so ownership inventory reports ambiguity after its old lease expires.
  expected_outcome: A CI-attested governance handoff retires only the verified unmerged S8-S10 candidate from active ownership and preserves its evidence as not delivered. W5 becomes the only active owner of its actual product paths only when its existing S7-S14 delivery receipt and this handoff receipt are both verified by the same provenance path.
  user_visible_behavior:
  - Unverified, malformed, mismatched, or locally asserted handoff data leaves the historical S8-S10 scope active.
  - A valid handoff never marks S8-S10 delivered and never removes its worktree, commit, contract, or test evidence.
  - W5 cannot stage canonical-artifact client changes until its own contract delta explicitly owns the missing client test and verification.
current_chain:
  nodes:
  - id: service:scripts.workspace_ownership.active_contract_scopes
    role: Reads active contracts from every linked worktree.
  - id: state:historical-s8-s10-candidate
    role: Unmerged GRAPH_DIFF_READY candidate at 8df227bc1be5dee02bea8006d596e30aae802539.
  - id: state:w5-recovery-candidate
    role: Dirty W5 implementation whose 48 intersecting product paths require a unique owner before recovery.
  - id: test:tests/test_workspace_ownership.py
    role: Regression coverage for ownership and provenance decisions.
  edges:
  - from: service:scripts.workspace_ownership.active_contract_scopes
    to: state:historical-s8-s10-candidate
    relation: inventories
  - from: state:historical-s8-s10-candidate
    to: state:w5-recovery-candidate
    relation: conflicts_on_actual_paths
  - from: test:tests/test_workspace_ownership.py
    to: service:scripts.workspace_ownership.active_contract_scopes
    relation: verifies
  evidence:
  - E:/agent/omni/.worktrees/system-convergence-s8-s10 is clean at 8df227bc1be5dee02bea8006d596e30aae802539 with state GRAPH_DIFF_READY.
  - E:/agent/omni/.worktrees/omni-unified-ai-workbench-w5 remains dirty and has 48 product paths intersecting the historical candidate.
  - scripts/workspace_ownership.py currently treats all GRAPH_DIFF_READY schema-v3 contracts as active unless they have a delivery receipt.
