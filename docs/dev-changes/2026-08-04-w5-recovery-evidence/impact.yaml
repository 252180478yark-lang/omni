risk:
  level: R2
  contract_profile: full
  reasons:
  - Recovery evidence controls whether a stale, dirty R3 W5 candidate can be handed to a new writer.
  - The evidence binds external CI receipts, historical supersession, secret hygiene, and a read-only dirty-worktree fingerprint.
  external_effects: []
  scope_deltas:
  - id: W5-RECOVERY-DELTA-001
    discovered_at: '2026-08-04T18:34:00Z'
    reason: Recovery preservation requires retaining a stable external source anchor even when receipt or ownership gates remain blocked; only a disagreeing second source sample is unsafe to persist.
    added_paths: []
    required_level: R2
    risk_change: Tightens evidence retention without broadening source, runtime, lease, receipt, or product authority.
  - id: W5-RECOVERY-DELTA-002
    discovered_at: '2026-08-04T18:52:00Z'
    reason: Strict validation of GRAPH_DIFF_READY is necessarily a post-transition check, so it cannot be a pre-transition required result without creating a circular state gate.
    added_paths: []
    required_level: R2
    risk_change: Keeps the strict check mandatory for the candidate handoff while allowing the state machine to reach the state it validates.
  - id: W5-RECOVERY-DELTA-003
    discovered_at: '2026-08-04T19:08:00Z'
    reason: 'Sol P1 review found six fail-open recovery-evidence seams: external output escape, caller-selected residual and receipt scope, unknown lease state, overwriteable manifests, implicit secret defaults, and absent index-gate proof.'
    added_paths: []
    required_level: R2
    risk_change: Narrows the existing evidence-only behavior. It adds no W5, runtime, lease, receipt, product, or external-system write authority.
  - id: W5-RECOVERY-DELTA-004
    discovered_at: '2026-08-05T02:14:00Z'
    reason: Sol final P1 found that source-row selection could ignore malformed global allocation or lease records, including missing worktree identity, duplicate lease ids, and orphan active allocations.
    added_paths: []
    required_level: R2
    risk_change: Narrows recovery proof further by validating every global allocation and lease schema, identity link, ownership link, and uniqueness constraint before evaluating source activity; it adds no runtime or lease write authority.
  - id: W5-RECOVERY-DELTA-005
    discovered_at: '2026-08-05T02:16:00Z'
    reason: Sol final P1 found that symbolic-link-only output checks can miss Windows junction or other reparse-point redirects beneath the Git common directory.
    added_paths: []
    required_level: R2
    risk_change: Narrows external evidence output to canonical non-reparse Git common-dir layers and rejects redirected .git/omni-runtime paths; it adds no source, runtime, lease, or product write authority.
  - id: W5-RECOVERY-DELTA-006
    discovered_at: '2026-08-05T02:22:00Z'
    reason: Sol final review found that only active leases were required to have a reverse allocation and an expired active lease could appear inactive while its linked allocation remained effectively active.
    added_paths: []
    required_level: R2
    risk_change: Narrows recovery proof by requiring all lease states to map one-to-one to allocations and by comparing raw state, effective expiry-derived state, and expiration values in both directions; it adds no runtime or lease write authority.
  approval:
    required: false
    gate_ref: ''
intent:
  problem: The W5 recovery scene is a 71-path dirty worktree that must be preserved but cannot be safely resumed from a local status assertion, partial receipt set, or an unscoped secret-scan exception.
  expected_outcome: A read-only evidence tool append-writes only inside the Git common-dir recovery directory, derives required receipts and residual expectation from its authoritative inventory, uses one memoized bounded live provenance verifier across official receipts and ownership projection, validates every allocation and lease record plus their identity, ownership, uniqueness, bidirectional one-to-one links, and matched effective expiry-derived state before proving zero active source allocation, and fails closed until ownership is W5 except for the two declared residuals.
  user_visible_behavior:
  - The recovery manifest contains only path, Git-status, digest, and runtime-identity metadata; it never copies source contents or credential values, and its output path cannot traverse a symlink, Windows junction, or other reparse point.
  - Partial receipts, unavailable live provenance, an unretired historical owner, any malformed or orphan global allocation or lease record, a one-sided active/effective state or expiry mismatch, source fingerprint drift, or secret findings outside an exact path-rule-fingerprint fixture registry prevent a recovery-ready claim. A stable source anchor is append-written as blocked evidence; a double-sample drift is never persisted.
  - The tool never allocates or releases a runtime, edits W5, stages paths, or injects delivered contract ids.
