  - id: service:scripts.generate_implementation_status.bounded_live_provenance
    role: Shared deadline provenance verifier for external delivery receipts.
  - id: state:worktree.w5-recovery-manifest
    role: Git-common-dir evidence artifact outside the W5 source worktree.
  - id: test:tests.test_w5_recovery_evidence
    role: Regression coverage for receipt, verifier, fingerprint, fixture, and supersession fail-closed semantics.
  edges:
  - from: service:scripts.w5_recovery_evidence.build_recovery_evidence
    to: service:scripts.workspace_ownership.inventory_workspace
    relation: inventories
  - from: service:scripts.w5_recovery_evidence.build_recovery_evidence
