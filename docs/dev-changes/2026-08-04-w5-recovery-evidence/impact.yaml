risks:
- id: W5-RECOVERY-RISK-RECEIPT-BYPASS
  description: A partial or local receipt list could hide an active historical owner.
  mitigation: Derive the complete authoritative historical delivery ID inventory inside the tool, use one bounded verifier instance, and reject any missing or invalid registry proof.
- id: W5-RECOVERY-RISK-FIXTURE-BYPASS
  description: A broad secret allowlist could conceal a real credential in the dirty recovery scene.
  mitigation: Disable the scanner's default allowlist for recovery, permit only exact test path-plus-rule-plus-fingerprint entries, and record raw versus allowlisted redacted findings; any other finding is blocking.
- id: W5-RECOVERY-RISK-DRIFT
  description: A stable status count alone can hide changed recovery content.
  mitigation: Bind both status-manifest SHA-256 and runtime source fingerprint, and require the expected values before returning recovery_ready.
out_of_scope:
- No W5 Host, frontend, Knowledge Engine, Docker, runtime, lease, database, migration, secret, or product-file mutation.
- No change to historical contracts, delivery receipts, GitHub workflow, S8-S10 retirement, or implementation-status source projection.
- No claim that W5 is delivered, executable, or safe to run; this only prepares a read-only evidence handoff.
rollback:
  strategy: Revert the isolated evidence-tool commit. Existing external manifests remain immutable audit artifacts and W5 remains untouched.
  data_recovery: No persistent business data is changed. The external manifest contains no source content or secret value and can be retained for recovery audit.
