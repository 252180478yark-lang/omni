contract_delta:
- description: Stable blocked evidence is retained outside W5 when both source samples agree, instead of requiring every receipt and ownership guard to pass before an anchor can be written.
  reason: A blocked recovery handoff still needs a durable, content-bound source reference; retaining it does not grant write authority or a recovery-ready state.
  effect: Source-sample drift remains non-persistent, while all receipt, ownership, runtime-lease, supersession, and secret-hygiene failures continue to block recovery_ready.
  accepted: true
- description: The GRAPH_DIFF_READY strict validator is a post-transition check rather than a pre-transition required result.
  reason: Its expected state is GRAPH_DIFF_READY, which does not exist until the state transition succeeds.
  effect: The exact strict command is still executed and recorded before candidate handoff, without a circular transition requirement.
  accepted: true
- description: Sol P1 recovery-evidence hardening removes all caller approval seams and makes external manifests append-only.
  reason: The initial candidate allowed a caller-selected receipt/residual expectation, tolerated ambiguous allocation absence, and permitted a custom output directory.
  effect: Recovery now derives its authoritative receipt and residual sets internally, blocks unknown allocation state, uses exact fixture fingerprints without default policy inheritance, and only appends new common-dir records.
  accepted: true
- description: Sol final P1 requires full global allocation and lease validation before a source-worktree activity result is trusted.
  reason: Selecting matching source rows first could silently ignore a missing worktree_id, malformed allocation, duplicate lease id, or orphan active record elsewhere in the shared runtime store.
  effect: Every record now must satisfy schema, timestamp, state, uniqueness, and lease-to-allocation identity and ownership links; any violation blocks recovery rather than being filtered out.
  accepted: true
- description: Sol final P1 rejects Windows junction and other reparse-point output redirects beneath the Git common directory.
  reason: Symlink-only checks do not reliably detect a Windows junction at .git/omni-runtime, which could redirect evidence outside its canonical audit location.
  effect: Every common-dir output layer is checked as a canonical relative path and a non-reparse point before and after directory creation; a junction escape is regression-tested.
  accepted: true
- description: Sol final P1 requires every lease state to have exactly one linked allocation with matching raw state, effective expiry-derived state, and expiry value.
  reason: An orphan released/stale lease and an expired active lease paired with an unexpired active allocation could otherwise bypass the active-only reverse check.
  effect: Lease/allocation linkage is now bidirectional for all states; any orphan, raw/effective state mismatch, or expiry mismatch blocks recovery even when the source lease alone derives stale.
  accepted: true
