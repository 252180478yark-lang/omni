risks:
- PDF 文件进入 docs 会增加仓库体积；以版本不可变和显式目录控制增长。
- 自动索引若允许手工编辑会漂移；README 与 catalog 仅由发布器生成。
- 旧 PRD 命名不一致；本次不批量迁移，避免破坏硬引用。
out_of_scope:
