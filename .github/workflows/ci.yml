# omni 最小 CI —— 回归网门禁（蓝图 §4 L0-7【R-29】· 阶段0）
#
# 目的：把 KE pytest + stream-json 契约测试纳入门禁，「改地基/schema/runner 先绿再合并」。
# 不追求一上来覆盖全套——分两层，先有一条**永远能绿的快门**，再挂一条**信息性全量**。
#
# job 分层：
#   1) unit-gate（**阻断合并**）：装最小 import closure，跑纯单元测试
#      （含本切片新增的 stream-json 契约测试）。秒级、不需 DB/网络/重依赖，
#      保证门禁稳定为绿。这是 L0-7 的最小达标线。
#   2) ke-bootstrap-gate（**阻断合并**）：在干净环境安装全部 KE 依赖并收集全套测试，
#      防止开发机依赖或可写目录掩盖 Linux runner 的启动问题。
#   3) migration-parity-gate（**阻断合并**）：同一 runner 验证空库及 015 存量库
#      replay 016 后达到完整 head/checksum parity。
#   4) convergence-foundation-gate（**阻断合并**）：在干净安装后实际运行
#      S2/S2.5/S3 的 hooks、health、approval、graph、runtime preflight 与 identity auth。
#   5) full-suite（**不阻断 · 信息性**）：保留全量业务测试真实通过率；migration
#      正确性由独立阻断 gate 负责，不把信息性测试伪装成 migration 证明。
#
# 默认分支 run 不允许被后续 push 取消；每个被交付的不可变提交都必须有自己的封印。

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# 同一分支新 push 取消旧 run，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || 'cancelable' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 阻断门禁：根 AGENTS 必须保持精简，动态事实只能从运行时目录读取。
  # 本地 Codex Hook 只提醒；这条 CI 才是不可绕过的确定性边界。
  # ---------------------------------------------------------------------------
  agents-policy-gate:
    name: AGENTS 精简与 Skill 引用（门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装治理检查最小依赖
        run: pip install "pyyaml>=6.0,<7" "pytest>=8.0,<9"

      - name: 校验根 AGENTS 策略
        run: python -B scripts/check_agent_policy.py --require-tracked

      - name: 校验关键开发资产已存在于不可变提交（非全面 readiness）
        run: python -B scripts/check_development_readiness.py --strict-critical-assets

      - name: 验证运行 Guard 规则与脱敏
        run: python -B -m pytest -q -p no:cacheprovider tests/test_runtime_guard.py tests/test_development_readiness.py

      - name: 生成运行基线静态报告（S1.5 前不阻断）
        continue-on-error: true
        run: python -B scripts/runtime_guard.py static --json

      - name: 跑 AGENTS 策略与可移植性测试
        run: python -B -m unittest discover -s tests -p "test_agent*.py" -v

      - name: 验证 PRD 根入口
        run: python -B -m unittest discover -s tests -p "test_prd_validator_entrypoint.py" -v

  # ---------------------------------------------------------------------------
  # 阻断门禁：产品/基础设施 diff 必须由本次 diff 中的有效合同覆盖。
  # v1/v2 兼容历史 COMPLETE；v3 必须为 GRAPH_DIFF_READY，最终 COMPLETE 由外部封印给出。
  # ---------------------------------------------------------------------------
  feature-contract-gate:
    name: 功能合同与变更范围（门禁）
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装合同门禁最小依赖
        run: pip install "pyyaml>=6.0,<7" "pytest>=8.0,<9"

      - name: 跑功能合同与门禁测试
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_feature_contracts.py
          .agents/skills/omni-feature-development/tests/test_dev_contract.py

      - name: 计算 diff 并校验功能合同
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$EVENT_HEAD_SHA"
          else
            BASE_SHA=""
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
            if [ -z "$BASE_SHA" ]; then
              echo "cannot resolve merge-base against origin/$DEFAULT_BRANCH" >&2
              exit 2
            fi
          fi
          python -B scripts/check_feature_contracts.py --mode commit --base "$BASE_SHA" --head "$HEAD_SHA"

  # ---------------------------------------------------------------------------
  # 阻断门禁：同一 canonical runner 必须在空库和存量库（先到 015，再 replay 016）
  # 达到完整 repository head/checksum parity。所有数据库均为本 job 临时 disposable DB。
  # ---------------------------------------------------------------------------
  migration-parity-gate:
    name: Migration 空库与存量库 parity（门禁）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: ci-disposable-only
      OMNI_DATABASE_DISPOSABLE: "true"
      OMNI_WORKTREE_ID: worktree-1111111111111111
      OMNI_RUNTIME_ID: ci-migration-parity
      OMNI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OMNI_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OMNI_SOURCE_FINGERPRINT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      OMNI_BUILD_SOURCE_FINGERPRINT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 migration gate 依赖
        run: pip install "psycopg2-binary>=2.9,<3" "pytest>=8,<9"

      - name: 跑 runner 合同与仓库静态 parity
        run: |
          python -B -m pytest -q -p no:cacheprovider tests/test_migration_runner_contract.py
          python -B scripts/apply_migrations.py --dry-run --verify

      - name: 创建两个临时数据库与精确 RuntimeAllocation evidence
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          import psycopg2

          connection = psycopg2.connect(
              host="127.0.0.1",
              port=5432,
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              dbname="postgres",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              for database in ("omni_ci_empty", "omni_ci_existing"):
                  cursor.execute(f'CREATE DATABASE "{database}"')
          connection.close()

          now = datetime.datetime.now(datetime.timezone.utc)
          expires = (now + datetime.timedelta(hours=2)).isoformat()
          for index, database in enumerate(("omni_ci_empty", "omni_ci_existing"), 1):
              allocation_id = f"allocation-{index:032x}"
              lease_id = f"lease-{index:032x}"
              state = {
                  "schema_version": 1,
                  "generation": index,
                  "leases": [{
                      "lease_id": lease_id,
                      "change_id": "ci-migration-parity",
                      "worktree_id": os.environ["OMNI_WORKTREE_ID"],
                      "state": "active",
                      "expires_at": expires,
                  }],
                  "allocations": [{
                      "allocation_id": allocation_id,
                      "lease_id": lease_id,
                      "change_id": "ci-migration-parity",
                      "worktree_id": os.environ["OMNI_WORKTREE_ID"],
                      "source_fingerprint": os.environ["OMNI_SOURCE_FINGERPRINT"],
                      "runtime_id": os.environ["OMNI_RUNTIME_ID"],
                      "database": database,
                      "canonical": False,
                      "state": "active",
                      "expires_at": expires,
                  }],
              }
              Path(f"{database}-allocation.json").write_text(
                  json.dumps(state), encoding="utf-8"
              )
          PY

      - name: 空库运行到完整 head/checksum parity
        env:
          MIGRATION_DATABASE: omni_ci_empty
          OMNI_ALLOCATION_ID: allocation-00000000000000000000000000000001
          OMNI_RUNTIME_ALLOCATION_FILE: omni_ci_empty-allocation.json
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${MIGRATION_DATABASE}"
          python -B scripts/apply_migrations.py --allocation-aware \
            --receipt-dir "$RUNNER_TEMP/empty-receipts"

      - name: 构造存量 015 ledger（仍使用同一 runner）
        env:
          MIGRATION_DATABASE: omni_ci_existing
          OMNI_ALLOCATION_ID: allocation-00000000000000000000000000000002
          OMNI_RUNTIME_ALLOCATION_FILE: omni_ci_existing-allocation.json
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${MIGRATION_DATABASE}"
          SELECTORS="$(python - <<'PY'
          from pathlib import Path
          print(",".join(
              path.name for path in sorted(Path("migrations").glob("*.sql"))
              if int(path.name.split("_", 1)[0]) <= 15
          ))
          PY
          )"
          python -B scripts/apply_migrations.py --only "$SELECTORS" \
            --receipt-dir "$RUNNER_TEMP/existing-receipts"

      - name: 验证 016 尚未应用后 replay 到 head，再验证幂等 restart
        env:
          MIGRATION_DATABASE: omni_ci_existing
          OMNI_ALLOCATION_ID: allocation-00000000000000000000000000000002
          OMNI_RUNTIME_ALLOCATION_FILE: omni_ci_existing-allocation.json
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${MIGRATION_DATABASE}"
          python - <<'PY'
          import os
          import psycopg2
          connection = psycopg2.connect(os.environ["DATABASE_URL"])
          with connection, connection.cursor() as cursor:
              cursor.execute("SELECT filename FROM schema_migrations ORDER BY filename")
              names = [row[0] for row in cursor.fetchall()]
          connection.close()
          assert names and names[-1].startswith("015_"), names[-1:]
          assert not any(name.startswith("016_") for name in names)
          PY
          python -B scripts/apply_migrations.py --allocation-aware \
            --receipt-dir "$RUNNER_TEMP/existing-receipts"
          python -B scripts/apply_migrations.py --allocation-aware \
            --receipt-dir "$RUNNER_TEMP/existing-receipts"

      - name: 核验两个数据库与 receipt 均为完整 parity
        env:
          EMPTY_MIGRATION_DATABASE: omni_ci_empty
          EXISTING_MIGRATION_DATABASE: omni_ci_existing
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import psycopg2

          repository = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("migrations").glob("*.sql"))
          }
          for env_name in ("EMPTY_MIGRATION_DATABASE", "EXISTING_MIGRATION_DATABASE"):
              connection = psycopg2.connect(
                  host="127.0.0.1",
                  port=5432,
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
                  dbname=os.environ[env_name],
              )
              with connection, connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT filename, checksum FROM schema_migrations ORDER BY filename"
                  )
                  ledger = dict(cursor.fetchall())
              connection.close()
              assert ledger == repository
              assert "016_mcp_audit.sql" in ledger

          empty_dir = Path(os.environ["RUNNER_TEMP"]) / "empty-receipts"
          existing_dir = Path(os.environ["RUNNER_TEMP"]) / "existing-receipts"
          empty_index = json.loads((empty_dir / "index.json").read_text(encoding="utf-8"))
          existing_index = json.loads((existing_dir / "index.json").read_text(encoding="utf-8"))
          empty_receipt = json.loads((empty_dir / empty_index[-1]["filename"]).read_text(encoding="utf-8"))
          existing_receipts = [
              json.loads((existing_dir / item["filename"]).read_text(encoding="utf-8"))
              for item in existing_index
          ]
          assert empty_receipt["database_fixture"]["empty_database"] is True
          assert any("016_mcp_audit.sql" in item["applied"] for item in existing_receipts)
          assert existing_receipts[-1]["applied"] == []
          assert existing_receipts[-1]["after"]["pending"] == []
          PY

  # ---------------------------------------------------------------------------
  # 阻断门禁：Omni 内置 Codex runner 必须能安全解析 CLI、固定项目 cwd 并通过类型检查。
  # ---------------------------------------------------------------------------
  codex-runner-gate:
    name: Codex runner 启动与类型（门禁）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖
        run: npm ci

      - name: 验证前端单测与 Codex runner
        run: npm run test:unit

      - name: 前端类型检查
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 阻断门禁：零外部依赖纯单元测试（含 stream-json 契约）。必须绿才能合并。
  # ---------------------------------------------------------------------------
  unit-gate:
    name: KE 纯单元 + stream-json 契约（门禁）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge-engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装最小测试依赖（不装重业务依赖，保证快且稳）
        run: |
          python -m pip install --upgrade pip
          # 仅 pytest 栈；下面挑的测试不 import fastmcp/asyncpg/langgraph 等重依赖。
          pip install \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.0" \
            "httpx>=0.27.0" \
            "pyyaml>=6.0,<7" \
            "pydantic-settings>=2.6.0" \
            "asyncpg>=0.30.0" \
            "pgvector>=0.3.6"

      - name: 跑零依赖纯单元测试（含契约测试）
        run: |
          # 这批测试不碰 DB / 网络 / fastmcp，本地已验证可独立跑绿。
          # 改 runner 契约 / trace / prompt 渲染 / 成本工具，必须先让这条绿。
          python -m pytest -q \
            tests/test_streamjson_contract.py \
            tests/test_mcp_config.py \
            tests/test_mcp_prompts.py \
            tests/test_mcp_trace.py \
            tests/test_mcp_utils.py \
            tests/test_mcp_pattern_lib.py \
            tests/test_harvester_parser.py

  # ---------------------------------------------------------------------------
  # 阻断门禁：干净 Linux 环境必须能安装 KE 并收集全套测试。
  # 这里只验证 packaging/import/collection，不把尚未完成 migration 自举的执行结果伪装成绿。
  # ---------------------------------------------------------------------------
  ke-bootstrap-gate:
    name: KE 干净安装与测试收集（门禁）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge-engine
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 干净安装 KE 全部依赖（含 dev）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 收集全套 KE 测试
        env:
          OMNI_UPLOAD_DIR: ${{ runner.temp }}/omni/uploads
        run: python -B -m pytest --collect-only -q -p no:cacheprovider tests

  # ---------------------------------------------------------------------------
  # 阻断门禁：bootstrap 只证明可收集；本 job 在独立干净 runner 上真实执行
  # convergence foundation 的确定性 S2/S2.5/S3 测试。各领域分进程运行，避免两个
  # service 都使用顶层 `app` 包时产生测试顺序污染；不连接外部服务或共享数据库。
  # ---------------------------------------------------------------------------
  convergence-foundation-gate:
    name: S2-S3 Convergence Foundation（门禁）
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 干净安装 KE 与 Identity 全部依赖（含 dev）
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/knowledge-engine[dev]" -e "services/identity-service[dev]"

      - name: 实跑 S2 风险策略与 Hooks
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_development_policy.py
          tests/test_development_hooks.py

      - name: 实跑 S2.5 五态健康
        working-directory: services/knowledge-engine
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_system_health.py
          tests/test_system_health_router.py

      - name: 实跑 S2.5 非阻塞审批与恢复 worker
        working-directory: services/knowledge-engine
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_approval_operations.py
          tests/test_approval_operation_worker.py
          tests/test_approval_audit.py

      - name: 实跑 S3 FeatureDefinition 与确定性图谱
        working-directory: services/knowledge-engine
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_feature_definitions.py
          tests/test_system_graph_models.py
          tests/test_system_graph_collectors.py
          tests/test_system_graph_snapshots.py
          tests/test_system_graph_redaction.py

      - name: 实跑 RuntimeAllocation 启动前预检
        working-directory: services/knowledge-engine
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_runtime_preflight.py

      - name: 实跑 Identity 认证与失活用户拒绝
        working-directory: services/identity-service
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_auth.py

  # ---------------------------------------------------------------------------
  # 信息性全量：起 DB + 装全依赖跑整套。migration parity 由独立阻断 gate 证明。
  # ---------------------------------------------------------------------------
  full-suite:
    name: KE 全量 pytest（信息性 · 暂不阻断）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge-engine
    services:
      postgres:
        # 与 blocking migration parity gate 使用同系列 pgvector PostgreSQL。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: omni_vibe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_user -d omni_vibe_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 KE 全部依赖（含 dev）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑全套 pytest（信息性，不阻断合并）
        # 该 job 收集广泛业务依赖的真实通过情况；不替代独立 migration 门禁。
        continue-on-error: true
        env:
          DATABASE_URL: "postgresql+asyncpg://omni_user:changeme_in_production@localhost:5432/omni_vibe_db"
          OMNI_UPLOAD_DIR: ${{ runner.temp }}/omni/uploads
        run: |
          python -m pytest -q tests

  # ---------------------------------------------------------------------------
  # 交付封印：PR、功能分支 push 与手动任务只验证候选；只有默认分支 post-merge
  # push 在所有确定性阻断 job 通过后，才能为同一不可变 commit/tree 生成 COMPLETE。
  # full-suite 仍为信息性；delivery attestation 必须依赖 blocking migration gate。
  # ---------------------------------------------------------------------------
  delivery-seal:
    name: 不可变提交交付封印
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs:
      - agents-policy-gate
      - feature-contract-gate
      - codex-runner-gate
      - unit-gate
      - ke-bootstrap-gate
      - migration-parity-gate
      - convergence-foundation-gate
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EVALUATION_SHA: ${{ github.sha }}
      ACTUAL_REF: ${{ github.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 精确验证默认分支引用
        run: |
          set -euo pipefail
          if [ "$ACTUAL_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "delivery seal requires exact default branch ref" >&2
            exit 2
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装封印最小依赖
        run: pip install "pyyaml>=6.0,<7"

      - name: 解析同一不可变 base/head
        id: refs
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse "$EVALUATION_SHA^{commit}")"
          BASE_SHA="$PUSH_BEFORE_SHA"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "default-branch delivery push is missing github.event.before" >&2
            exit 2
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: 判断本次是否包含 schema v3 交付候选
        id: seal
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import yaml

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          names = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...{head}", "--"],
              text=True,
          ).splitlines()
          required = False
          for name in names:
              if not name.startswith("docs/dev-changes/") or not name.endswith("/impact.yaml"):
                  continue
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              if data.get("schema_version") == 3:
                  required = True
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          PY

      - name: 生成不可变 delivery evidence
        if: steps.seal.outputs.required == 'true'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "kind": "omni_delivery_evidence",
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "required_checks": {
                  "agents-policy-gate": "passed",
                  "feature-contract-gate": "passed",
                  "codex-runner-gate": "passed",
                  "unit-gate": "passed",
                  "ke-bootstrap-gate": "passed",
                  "migration-parity-gate": "passed",
                  "convergence-foundation-gate": "passed",
              },
              "migration_gate_verified": True,
          }
          Path(os.environ["RUNNER_TEMP"], "delivery-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: 上传不可变 delivery evidence
        if: steps.seal.outputs.required == 'true'
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence-${{ steps.refs.outputs.head_sha }}
          path: ${{ runner.temp }}/delivery-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: 生成 CI 外部 delivery attestation
        if: steps.seal.outputs.required == 'true'
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EVIDENCE_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: >-
          python -B scripts/check_feature_contracts.py
          --mode commit
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --attestation-out "$RUNNER_TEMP/delivery-attestation.json"
          --attestor github-actions-required-gates
          --target-ref "$GITHUB_REF"
          --repository "$GITHUB_REPOSITORY"
          --required-check agents-policy-gate=passed
          --required-check feature-contract-gate=passed
          --required-check codex-runner-gate=passed
          --required-check unit-gate=passed
          --required-check ke-bootstrap-gate=passed
          --required-check migration-parity-gate=passed
          --required-check convergence-foundation-gate=passed
          --evidence-artifact-name "delivery-evidence-$HEAD_SHA"
          --evidence-artifact-digest "$EVIDENCE_DIGEST"
          --migration-gate-verified
          --ci-run-id "${{ github.run_id }}"

      - name: 上传交付封印
        if: steps.seal.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-attestation-${{ steps.refs.outputs.head_sha }}
          path: ${{ runner.temp }}/delivery-attestation.json
          if-no-files-found: error
          retention-days: 90
